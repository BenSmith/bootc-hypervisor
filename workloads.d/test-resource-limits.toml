# Test workload for verifying resource constraints
# This config demonstrates all resource limit options

[workload]
name = "resource-test"
enabled = false  # Disabled by default - enable to test resource constraints

[container]
image = "docker.io/library/alpine:latest"
id = "99"
command = ["sleep", "infinity"]

[resources]
# CPU limits - Allow up to 1 full CPU core
cpu_quota = "100%"
cpu_weight = 200  # Higher priority when competing

# Memory limits - Max 512MB, start throttling at 384MB
memory_max = "512M"
memory_high = "384M"
memory_swap_max = "0"  # Disable swap

# I/O limits
io_weight = 150  # Slightly higher I/O priority

# Process limits - Prevent fork bombs
tasks_max = 50

# Timeout overrides
timeout_start_sec = 60
timeout_stop_sec = 15

# Example of custom directives (escape hatch)
# Uncomment to test advanced features:
# custom_directives = {
#   LimitNOFILE = "1024",
#   Nice = "5"
# }
