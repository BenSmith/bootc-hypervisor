# WARNING WARNING WARNING
# This has not been thoroughly tested, and the implementation is AI-generated, so ...
# don't count on this to be your sole mechanism to access important things.
# /WARNING /WARNING /WARNING
#
# Example workload demonstrating secrets management with systemd credentials
# This example shows how to use encrypted credentials for sensitive data

[workload]
name = "webapp-example"
enabled = false  # Disabled by default (this is just an example)

[container]
image = "docker.io/library/nginx:alpine"
id = "99"  # Use a high ID to avoid conflicts

[container.environment]
# Plain environment variables (no secrets)
APP_NAME = "My Web Application"
APP_ENV = "production"
LOG_LEVEL = "info"

# Environment variables with secret references
# These will be expanded at runtime from systemd credentials
API_KEY = "${SECRET:webapp-api-key}"
DATABASE_PASSWORD = "${SECRET:db-password}"
JWT_SECRET = "${SECRET:jwt-secret}"

# Mixed example - URL with embedded secret
DATABASE_URL = "postgresql://dbuser:${SECRET:db-password}@localhost:5432/myapp"

[secrets]
# List of systemd credentials to load
# Each must have a corresponding encrypted file:
#   /etc/credstore.encrypted/{credential-name}.cred
credentials = [
    "webapp-api-key",
    "db-password",
    "jwt-secret"
]

# Optional: Mount secrets as files in the container
# Useful for TLS certificates, SSH keys, config files, etc.
# files = [
#     { credential = "tls-cert", path = "/etc/nginx/ssl/cert.pem" },
#     { credential = "tls-key", path = "/etc/nginx/ssl/key.pem" }
# ]

[network]
mode = "pasta"
ports = ["8080:80"]

# ============================================================================
# SETUP INSTRUCTIONS
# ============================================================================
#
# 1. Create encrypted credentials:
#
#    echo -n "sk-1234567890abcdef" | \
#      sudo systemd-creds encrypt --with-key=tpm2 \
#      --name=webapp-api-key - \
#      /etc/credstore.encrypted/webapp-api-key.cred
#
#    echo -n "secure-db-password-123" | \
#      sudo systemd-creds encrypt --with-key=tpm2 \
#      --name=db-password - \
#      /etc/credstore.encrypted/db-password.cred
#
#    echo -n "my-jwt-secret-key" | \
#      sudo systemd-creds encrypt --with-key=tpm2 \
#      --name=jwt-secret - \
#      /etc/credstore.encrypted/jwt-secret.cred
#
# 2. Verify credentials were created:
#
#    sudo workload-ctl secret list
#
# 3. Enable the workload:
#
#    sudo workload-ctl enable webapp-example
#
# 4. Verify environment variables are set correctly:
#
#    sudo workload-ctl exec webapp-example env | grep -E "(API_KEY|DATABASE)"
#
# 5. Check the decrypted credentials at runtime (as root):
#
#    sudo ls -la /run/credentials/workload-webapp-example-99.service/
#    sudo cat /run/credentials/workload-webapp-example-99.service/webapp-api-key
#
# ============================================================================
# USING workload-ctl secret COMMANDS
# ============================================================================
#
# Create a secret interactively:
#   sudo workload-ctl secret create webapp-api-key
#   (then type the secret and press Ctrl+D)
#
# Create a secret from a file:
#   sudo workload-ctl secret create tls-cert --file /path/to/cert.pem
#
# List all secrets:
#   sudo workload-ctl secret list
#
# Show a decrypted secret (for debugging):
#   sudo workload-ctl secret show webapp-api-key
#
# Rotate a secret (updates value and restarts affected workloads):
#   sudo workload-ctl secret rotate webapp-api-key
#
# Delete a secret:
#   sudo workload-ctl secret delete webapp-api-key
#
# ============================================================================
# SECURITY NOTES
# ============================================================================
#
# - Secrets are encrypted at rest with AES256-GCM
# - TPM2-backed encryption binds secrets to this specific machine
# - Decrypted secrets live in RAM only (/run is tmpfs)
# - Per-workload isolation: workloads can't access each other's secrets
# - Automatic cleanup when service stops
# - Encrypted .cred files are safe to commit to git or include in bootc images
#
# - For maximum security, use TPM2 with PCR policies:
#   sudo systemd-creds encrypt --with-key=tpm2 --tpm2-pcrs=7+11 \
#     --name=my-secret - /etc/credstore.encrypted/my-secret.cred
#
#   This binds decryption to Secure Boot state (PCR 7) and kernel cmdline (PCR 11)
#
# See docs/SECRETS-MANAGEMENT.md for comprehensive documentation.
# ============================================================================
