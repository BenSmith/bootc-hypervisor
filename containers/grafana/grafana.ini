# Grafana configuration
# Full reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
#
# Admin credentials, sign-up policy, and log mode are set via environment
# variables in grafana.toml — no need to duplicate them here.

[paths]
data = /var/lib/grafana

[server]
http_port = 3000
# Uncomment and set these if serving behind a reverse proxy:
# domain = grafana.example.com
# root_url = https://grafana.example.com

[analytics]
reporting_enabled = false
check_for_updates = false
