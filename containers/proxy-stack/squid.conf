# Squid configuration for proxy-stack
# Caches HTTP responses and forwards all traffic through Privoxy for content filtering.

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 1025-65535  # unregistered ports
acl CONNECT method CONNECT

# Only allow CONNECT to SSL ports (HTTPS tunnels)
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Local network access
acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
http_access allow localhost
http_access allow localnet
http_access deny all

http_port 3128

# Use Pi-hole for DNS (running on 127.0.0.1:53 in this container)
dns_nameservers 127.0.0.1

# Cache: 10GB on disk
cache_dir ufs /var/spool/squid 10240 16 256
coredump_dir /var/spool/squid
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 512 MB

# Cache packages and media files longer
refresh_pattern -i \.(rpm|deb|exe|zip|tar|tgz|gz|bz2|iso|dmg)$ 129600 100% 129600
refresh_pattern -i \.(jpg|png|gif|mp3|mp4|webm)$ 10080 90% 43200
refresh_pattern . 0 20% 4320

# Log to stdout/stderr for systemd journal
access_log stdio:/dev/stdout squid
cache_log /dev/stderr
cache_store_log none

# Run as root inside the container. With userns=host, container root maps to
# the workload user on the host — no actual privilege escalation.
cache_effective_user root
cache_effective_group root

visible_hostname proxy-stack
pid_filename /var/spool/squid/squid.pid
