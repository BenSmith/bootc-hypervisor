# Samba configuration
# Place this file at /var/lib/workloads/smb-server/smb.conf
# It will be volume-mounted read-only into the container.
#
# After editing, restart the workload to apply changes:
#   sudo workload-ctl restart smb-server

[global]
    workgroup = WORKGROUP
    server role = standalone server

    # Guest-only access: failed auth falls back to guest
    security = user
    map to guest = Bad User

    logging = systemd
    log level = 1
    max log size = 1000

    smb ports = 445

    # Disable NetBIOS/printing — not needed for direct SMB2/3 access
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

[exports]
    path = /exports
    comment = Shared storage
    browseable = yes
    writable = yes
    guest ok = yes
    force user = _wl-smb-server
    create mask = 0664
    directory mask = 0775
    force create mode = 0664
    force directory mode = 0775
