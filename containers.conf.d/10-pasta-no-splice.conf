# Disable pasta's loopback socket-splicing fast path.
#
# Why: pasta's splice() path (default on) collapses throughput for connections
# forwarded over loopback to a few MB/s on this passt build (observed
# passt-0^20260526 / podman 5.8). A greedy direct reader is unaffected, but any
# in-host reverse proxy (e.g. the Caddy workload in front of the zot registry)
# reading a published port over 127.0.0.1 backpressures the splice path and
# stalls — large `podman pull`s through registry.local would hang for minutes.
#
# Turning splicing off makes pasta use the regular tap path, restoring
# ~1+ GB/s while keeping full per-workload pasta network isolation (no need to
# fall back to --network=host). Applies to every rootless pasta workload.
#
# Re-evaluate (and consider removing) once the passt splice regression is fixed
# upstream. See also workloadctl [network] mode, which can override per-workload
# with mode = "pasta:--no-splice".
[network]
pasta_options = ["--no-splice"]
