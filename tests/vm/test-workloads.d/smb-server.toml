# Test workload: Samba SMB server (network=host, required_files validation)
[workload]
name = "smb-server"
enabled = true

[setup]
required_files = [
    { path = "./smb.conf", hint = "minimal samba config for testing" },
]

[container]
image = "192.168.0.64:5000/smb-server:latest"
pull = "missing"

[storage]
volumes = [
    "./exports:/exports",
    "./samba-state:/var/lib/samba",
    "./samba-run:/run/samba",
    "./samba-logs:/var/log/samba",
    "./smb.conf:/etc/samba/smb.conf:ro",
    "/run/systemd/journal/socket:/run/systemd/journal/socket",
]

[network]
mode = "host"
