# Test workload: Squid caching proxy (HTTP proxy check, required_files validation)
[workload]
name = "squid"
enabled = true

[setup]
required_files = [
    { path = "./squid.conf", hint = "minimal squid config for testing" },
]

[container]
image = "192.168.0.64:5000/squid:latest"
pull = "missing"

[storage]
volumes = [
    "./squid.conf:/etc/squid/squid.conf:ro",
    "./cache:/var/spool/squid",
]

[network]
mode = "pasta"
ports = ["3128:3128"]
