# Test workload: container registry (HTTP endpoint check)
[workload]
name = "registry"
enabled = true

[container]
image = "192.168.0.64:5000/library/registry:2"
pull = "missing"

[container.health]
cmd = "wget -qO- http://localhost:5000/v2/ > /dev/null || exit 1"
interval = "15s"
start_period = "10s"
on_failure = "kill"

[container.environment]
REGISTRY_STORAGE_DELETE_ENABLED = "true"
REGISTRY_LOG_LEVEL = "info"

[storage]
volumes = [
    "./data:/var/lib/registry"
]

[network]
mode = "pasta"
ports = ["5000:5000"]

[resources]
service_type = "simple"
