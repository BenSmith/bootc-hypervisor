# Test workload: Grafana (HTTP web UI check, required_files validation)
[workload]
name = "grafana"
enabled = true

[setup]
required_files = [
    { path = "./grafana.ini", hint = "minimal grafana config for testing" },
]

[container]
image = "192.168.0.64:5000/grafana:latest"
pull = "missing"

[container.environment]
GF_SECURITY_ADMIN_USER = "admin"
GF_SECURITY_ADMIN_PASSWORD = "admin"
GF_USERS_ALLOW_SIGN_UP = "false"
GF_LOG_MODE = "console"

[storage]
volumes = [
    "./grafana.ini:/etc/grafana/grafana.ini:ro",
    "./data:/usr/share/grafana/data",
]

[network]
mode = "pasta"
ports = ["3000:3000"]
