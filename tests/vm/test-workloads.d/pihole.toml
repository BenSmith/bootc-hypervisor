# Test workload: Pi-hole (DNS + web UI, userns=host, network=host)
[workload]
name = "pihole"
enabled = true

[container]
image = "192.168.0.64:5000/pihole/pihole:latest"
pull = "missing"

[container.environment]
TZ = "UTC"
WEBPASSWORD = ""
PIHOLE_DNS_ = "1.1.1.1;1.0.0.1"
FTLCONF_dns_listeningMode = "all"
FTLCONF_dns_ipv6 = "false"

[storage]
volumes = [
    "./etc-pihole:/etc/pihole",
    "./etc-dnsmasq.d:/etc/dnsmasq.d",
]

[security]
userns = "host"

[network]
mode = "host"
