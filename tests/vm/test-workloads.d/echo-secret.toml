# Test workload: secret env vars via --env-file
[workload]
name = "echo-secret"
enabled = true

[container]
image = "192.168.0.64:5000/library/busybox:latest"
command = ["sh", "-c", "echo TOKEN=$TOKEN; echo MODE=$MODE; sleep infinity"]
pull = "missing"

[container.environment]
TOKEN = "${SECRET:test-token}"
MODE = "testing"
