[workload]
name = "wolf-game-streaming"

[container]
image = "registry.local/workload-wolf-game-streaming:latest"
pull = "missing"

[container.health]
cmd = "pgrep -x wolf > /dev/null || exit 1"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[devices]
# This configuration requires a render node (/dev/dri/renderD*)
gpu = "auto"
devices = ["/dev/uinput"]

[security]
userns = "keep-id:uid=1000,gid=1000"
capabilities = [
    "CHOWN", "DAC_OVERRIDE", "FOWNER",
    "SETUID", "SETGID", "FSETID",
    "KILL", "NET_BIND_SERVICE",
    "SETFCAP", "SETPCAP",
    "SYS_CHROOT", "SYS_NICE",
]
extra_groups = ["video", "render", "input"]
selinux_policy = true

[storage]
volumes = [
    "./config:/etc/wolf",
    "./home:/home/steam",
    "/run/udev:/run/udev:ro",
    "/dev/input:/dev/input",
]

[network]
mode = "host"

[resources]
shm_size = "2g"
memory_max = "8G"
memory_high = "6G"
cpu_quota = "400%"
tasks_max = 16384

[host]
# Host prerequisites: uinput kernel module + udev rule.
setup = "setup.sh"

[build]
# GPU_TYPE selects the render stack at build time (amd|nvidia|intel). The
# Containerfile defaults it to amd; override per build via the env var:
#   sudo GPU_TYPE=nvidia workloadctl build wolf-game-streaming
arg_env = ["GPU_TYPE"]
