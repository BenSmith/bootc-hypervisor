# DNS-over-VPN Proxy - Forward DNS queries through WireGuard VPN
#
# Runs dnsmasq inside the container's own network namespace. All DNS queries
# are forwarded to the VPN's DNS server over the WireGuard tunnel. The DNS
# server IP is read from the wg0.conf DNS= line automatically.
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build dns-vpn
#
#   2. Copy WireGuard config and enable:
#        sudo cp ~/Downloads/vpn.conf /var/lib/workloads/dns-vpn/data/wg0.conf
#        sudo workloadctl enable dns-vpn
#
#   3. Open the firewall for LAN access:
#        sudo firewall-cmd --zone=home --add-service=dns --permanent
#        sudo firewall-cmd --reload
#
#   4. Test:
#        dig @<this-host-ip> example.com
#
#   5. Point clients at this host's IP as their DNS server.
#      On other Linux hosts with systemd-resolved:
#        resolvectl dns <interface> <this-host-ip>

[workload]
name = "dns-vpn"

[setup]
required_files = [
    { path = "./wg0.conf", hint = "WireGuard client config from your VPN provider" },
]

[container]
image = "registry.local/workloads/dns-vpn:latest"
pull = "missing"

[container.health]
cmd = "wg show wg0 > /dev/null 2>&1 || exit 1"
interval = "30s"
start_period = "15s"
on_failure = "kill"

[container.environment]
WG_INTERFACE = "wg0"
DNS_PORT = "53"
# UPSTREAM_DNS = ""  # Override the DNS server from wg0.conf if needed

[storage]
volumes = [
    "./wg0.conf:/etc/wireguard/wg0.conf:ro",
]

[network]
mode = "pasta"
ports = ["53:53/udp", "53:53/tcp"]

[security]
# keep-id:uid=0,gid=0: wg-quick requires root inside the container. Container
# UID 0 maps to the workload user in a PRIVATE user namespace — root to the
# container, not to the host, so no host userns and no host root. NET_ADMIN
# grants the tunnel capability separately.
userns = "keep-id:uid=0,gid=0"
capabilities = ["NET_ADMIN"]

[resources]
memory_max = "64M"
memory_high = "48M"
cpu_quota = "10%"

# Marks the image locally buildable: `workloadctl build` produces the same
# ref into root's store, which overrides the registry copy on the next
# enable/update. CI publishes the canonical copy to registry.local.
[build]
