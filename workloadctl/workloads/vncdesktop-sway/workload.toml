# vncdesktop-sway — sway Wayland desktop served over VNC
#
# sway runs in headless wlroots mode; wayvnc serves it on TCP 5900.
# GPU acceleration via /dev/dri/renderD* if available, falls back to software.
#
# A terminal is started automatically, so a fresh session is never a blank
# screen. Close it and you are back to bare background — Ctrl+Alt+Return.
#
# Keyboard shortcuts (Ctrl+Alt is the primary modifier — Super is typically
# intercepted by the local DE before reaching the VNC server):
#   Ctrl+Alt+Return         - Terminal (foot)
#   Ctrl+Alt+Space          - App launcher (fuzzel)
#   Ctrl+Alt+Q              - Close window
#   Ctrl+Alt+F              - Toggle fullscreen
#   Ctrl+Alt+Shift+Space    - Toggle floating
#   Ctrl+Alt+E              - Toggle split direction
#   Ctrl+Alt+H/J/K/L        - Focus left / down / up / right
#   Ctrl+Alt+Shift+H/J/K/L  - Move tile
#   Ctrl+Alt+Tab            - Focus next window
#   Ctrl+Alt+1..4           - Switch workspace
#   Ctrl+Alt+Shift+1..4     - Move container to workspace
#   Ctrl+Alt+R              - Resize mode (then hjkl, Enter to exit)
#   Ctrl+Alt+Shift+R        - Reload sway config
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build vncdesktop-sway
#
#   2. Enable the workload:
#        sudo workloadctl enable vncdesktop-sway
#
#   3. Configure firewall (port 5900):
#        sudo firewall-cmd --add-port=5900/tcp --permanent
#        sudo firewall-cmd --reload
#
#      Or restrict to local network only:
#        sudo firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="192.168.0.0/24" port port="5900" protocol="tcp" accept'
#        sudo firewall-cmd --reload
#
#   4. Connect from any VNC client:
#        vncviewer <host-ip>:5900
#
# Security note:
#   VNC is unencrypted. For remote access over untrusted networks, tunnel
#   over SSH:  ssh -L 5900:localhost:5900 user@hypervisor

[workload]
name = "vncdesktop-sway"

[container]
image = "registry.local/workloads/vncdesktop-sway:latest"
pull = "missing"
systemd = "always"

[container.environment]
CONTAINER_USER = "desktop"
CONTAINER_UID = "1000"
CONTAINER_GID = "1000"
LANG = "C.UTF-8"
NO_AT_BRIDGE = "1"
# Set a VNC password (recommended). Without this, VNC has no authentication.
# VNC_PASSWORD = "changeme"
# Or use an encrypted secret:
# VNC_PASSWORD = "${SECRET:vncdesktop-sway-password}"
# VNC_USERNAME = "desktop"
# DESKTOP_RESOLUTION = "1920x1080"
# Port wayvnc listens on inside the container. Only needed when this shares a
# network namespace with another wayvnc bundle (vncdesktop-wayfire/-labwc also
# default to 5900) -- i.e. under [network] mode = "host". With an isolated mode
# the collision is better solved by publishing to a different host port.
# VNC_PORT = "5901"
# wayvnc log level (quiet/error/warning/info/debug/trace). Unset = wayvnc's
# default (warning). "debug" is the useful ceiling -- "trace" adds nothing,
# because Fedora's neatvnc is built with -DNDEBUG and every nvnc_trace call is
# compiled out. For diagnostics only: the extra output shares the host unit's
# rate-limit budget with every other daemon here and will evict the lines you
# are trying to read, so turn it off again afterwards.
# WAYVNC_LOG_LEVEL = "debug"

[container.health]
# Track the compositor, matching vncdesktop-wayfire: if sway is gone the
# container has nothing left to serve, whereas wayvnc exiting is recoverable on
# its own (wayvnc.service is Restart=on-failure).
cmd = "pgrep -x sway > /dev/null || exit 1"
interval = "30s"
start_period = "15s"
on_failure = "kill"

[devices]
# Optional render node for GPU-accelerated rendering. Falls back to software
# rendering automatically if no usable render node is exposed.
#
# NVIDIA hosts get software rendering regardless of what is set here. With a
# render node, wayvnc dies a few tens of seconds in with "wl_display#1: error 2:
# no memory" and then serves a frozen, input-dead session while its process
# stays up and keeps reporting healthy. start-sway detects the NVIDIA case and
# falls back to pixman, which is stable.
#
# The fallback is empirical -- GPU is the only variable across the runs, but the
# mechanism is NOT established, and earlier write-ups of it in this repo were
# wrong. As of 2026-07-25 the crash no longer reproduces with the GPU forced on
# (WLR_RENDERER = "gles2"), so this fallback may already be obsolete; it stays
# until that has soaked. The full evidence -- what is proven, what has since
# been ruled out by measurement, and what would actually move it forward -- is
# in .reference/notes/vncdesktop-sway-wayvnc-no-memory.md (gitignored, so
# local-only). Read that before repeating any explanation of this.
#
# Setting WLR_RENDERER in [container.environment] overrides the fallback.
gpu = "auto"

[security]
userns = "keep-id:uid=1000,gid=1000"
capabilities = [
    "CHOWN", "DAC_OVERRIDE", "FOWNER",
    "SETUID", "SETGID", "FSETID",
    "KILL",
]
extra_groups = ["video", "render"]
extra_uidmaps = ["+0:@{UID}:1"]
extra_gidmaps = ["+0:@{GID}:1"]
selinux_policy = true

[storage]
volumes = [
    "./home:/home/desktop",
    "/run/udev:/run/udev:ro",
    "/run/systemd/journal/socket:/run/host-systemd/journal/socket",
]

[network]
mode = "host"

[resources]
shm_size = "2G"
memory_max = "4G"
memory_high = "3G"
cpu_quota = "200%"
tasks_max = 16384

# Marks the image locally buildable: `workloadctl build` produces the same
# ref into root's store, which overrides the registry copy on the next
# enable/update. CI publishes the canonical copy to registry.local.
[build]
