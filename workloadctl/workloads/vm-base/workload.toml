# vm-base — generic clean VM starting point.
# Use: workloadctl init vm-base --as <name>
# Copies this workload.toml to /etc/workloads.d/<name>/; the cloud-init seed
# stays in /usr/share/workloadctl/workloads/vm-base/ and is referenced absolutely.
# After init, edit /etc/workloads.d/<name>/workload.toml, then `workloadctl enable <name>`.

[workload]
name = "vm-base"

[vm]
# Fedora 44 Cloud-Base (bump with fedora-versions.yml `stable:`).
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
# --- or copy/reflink a local qcow2 instead: ---
# local_image = "/path/to/image.qcow2"
# --- or build from a bootc image ref (needs bootc-image-builder + /dev/kvm): ---
# image = "ghcr.io/you/custom-bootc:latest"
vcpus = 2
memory = "2G"
system_disk_size = "20G"
# data_disk_size = "20G"   # uncomment for a persistent /dev/vdb data disk
user = "fedora"

[vm.network]
# `egress` has no safe silent default, so it must be stated. "open" is what a
# from-scratch VM needs: cloud-init installs packages from Fedora's mirrors,
# and mirror addresses are neither stable nor enumerable, so an address
# allowlist that covered them would be worthless as a control.
#
# Once the guest is provisioned and you know what it actually talks to, switch
# it over. There are two allowlists and they are not interchangeable:
#
#   egress = "filtered"
#   hosts  = ["example.com", "*.fedoraproject.org"]     # HTTP/HTTPS, by name
#   allow  = ["192.168.0.10:22", "[2001:db8::1]:443"]   # the rest, by address
#
# `hosts` gives this workload its own proxy, which reads the name out of
# `CONNECT host:443` before any TLS handshake — no interception, no CA.
# `allow` becomes nftables elements keyed on the destination address, so it
# takes addresses and ports only: a hostname there would be resolved once at
# start and then be silently wrong the moment the record moved. Setting
# neither, with egress = "filtered", is a validation error rather than a VM
# that boots and can reach nothing.
#
# For THIS bundle: the proxy environment is injected only into the built-in
# cloud-config, and vm-base supplies its own user_data_file below. If you set
# `hosts`, export http_proxy/https_proxy=http://192.0.2.1:3128 in that
# user-data yourself, or the guest will ignore the proxy and be dropped.
egress = "open"

[vm.cloud_init]
user_data_file = "/usr/share/workloadctl/workloads/vm-base/cloud-init/user-data"

# [vm.cloud_init.template_vars]
# MY_VAR = "value"   # referenced as ${MY_VAR} in cloud-init/user-data
