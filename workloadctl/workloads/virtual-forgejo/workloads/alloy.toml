# In-VM Alloy — collects host metrics + systemd journal + OTLP traces and
# forwards everything to the central otel-lgtm at __ALLOY_CENTRAL_HOST__.
# Installed into the guest's /etc/workloads.d/ by the cloud-init bootstrap,
# which substitutes __ALLOY_*__ placeholders from the template_vars in the
# parent workloads.d/virtual-forgejo.toml. SELinux policy for journal access
# is installed by the workload's [host] setup hook on enable.

[workload]
name = "alloy"
enabled = true

[setup]
required_files = [
    { path = "./alloy-config.alloy", hint = "/usr/share/workloadctl/workloads/alloy/alloy-config.alloy" },
]

[container]
image = "docker.io/grafana/alloy:latest"
pull = "newer"

[container.health]
cmd = "bash -c 'exec 3<>/dev/tcp/localhost/12345' || exit 1"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[container.environment]
CENTRAL_HOST = "__ALLOY_CENTRAL_HOST__"
HOST_LABEL   = "__ALLOY_HOST_LABEL__"
ROLE_LABEL   = "__ALLOY_ROLE_LABEL__"

[storage]
volumes = [
    "./alloy-config.alloy:/etc/alloy/config.alloy:ro",
    "/run/log/journal:/run/log/journal:ro",
    "/var/log/journal:/var/log/journal:ro",
    "/:/host:ro,rslave",
]

[security]
userns = "host"
extra_groups = ["systemd-journal"]

[network]
mode = "pasta"
ports = [
    "127.0.0.1:4317:4317",
    "127.0.0.1:4318:4318",
]

[host]
setup = "setup.sh"

[resources]
# See workloads/alloy/workload.toml: tight ceilings make alloy file-cache-thrash
# against memory.high on busy-journal hosts. 768M/1G keeps the hot working set
# resident; alloy's own anon RSS is only ~270M.
memory_max = "1G"
memory_high = "768M"
cpu_quota = "50%"
