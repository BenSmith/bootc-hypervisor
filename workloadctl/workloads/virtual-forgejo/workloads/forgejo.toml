# In-VM Forgejo workload. Installed into the guest's /etc/workloads.d/
# by the cloud-init bootstrap; not enabled on the host.

[workload]
name = "forgejo"

[container]
image = "codeberg.org/forgejo/forgejo:15-rootless"
pull = "missing"

[container.health]
cmd = "curl -sf http://localhost:3000/api/healthz"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[storage]
volumes = [
    # ./ (bare data anchor) resolves to /var/lib/workloads/forgejo/data, which
    # the cloud-init mounts entry attaches to the data.qcow2 (ext4, label
    # workloaddata). Forgejo's persistent state — including app.ini — lives
    # here so it survives system disk rebuilds.
    "./:/var/lib/gitea",
]

[security]
userns = "keep-id:uid=1000,gid=1000"

[network]
# Use the VM's network namespace directly instead of pasta, so Forgejo
# listens on :3000 (HTTP) and :2222 (SSH) of the VM itself and Caddy (also
# network=host on this VM) reverse-proxies HTTPS:443 to localhost:3000.
# Whether those ports are reachable from the LAN is the *host* workload's
# question, not this one's: under the default passt the VM has no LAN
# identity of its own and the host must publish [vm.network].ports; with
# [vm.network].bridge set it has a real address. See the parent bundle's
# workload.toml.
mode = "host"

[resources]
memory_max = "1G"
memory_high = "768M"
cpu_quota = "200%"
