# virtual-forgejo — a single Fedora VM hosting Forgejo (containerized via
# workloadctl) and a native forgejo-runner. Replaces the old two-VM
# forgejo-vm + runner-vm split: the native runner lives on the same host
# as Forgejo so `podman build` works without container-in-container, and
# we avoid burning a second VM on the runner role.
#
# Support files (cloud-init user-data, in-VM workload TOMLs, Caddyfile,
# app.ini, runner systemd unit) live in /usr/share/workloadctl/workloads/
# virtual-forgejo/ — same convention as the container support trees in
# /usr/share/workloadctl/workloads/. The repo path is workloadctl/workloads/
# virtual-forgejo/.
#
# Configure before enabling:
#   - Review /usr/share/workloadctl/workloads/virtual-forgejo/cloud-init/user-data:
#     the bootstrap script (clones the hypervisor repo, builds workloadctl,
#     installs the three sidecar workloads).
#   - Drop the runner registration token at
#     /etc/credstore.encrypted/runner-token (see README.md). It is read
#     once at first boot to register the runner.
#
# See /usr/share/workloadctl/workloads/virtual-forgejo/README.md for the full
# provisioning walkthrough.

[workload]
name = "virtual-forgejo"

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 4
memory = "6G"
system_disk_size = "40G"
# Per-VM data disk (data.qcow2 in the workload home on the host), attached
# as /dev/vdb. cloud-init formats it ext4 on first boot and mounts it
# at /var/lib/workloads/forgejo/data/ inside the VM — i.e. as the forgejo
# in-VM workload's data subdir. Forgejo state (gitea db, repos) lives
# here so it survives system disk rebuilds (workloadctl update rotates
# system.qcow2 only; data.qcow2 is only removed by `workloadctl disable
# --purge`).
#
# Caddy does not get qcow2-backed storage — its state lives on the system
# disk under its workload home dir, and it re-derives its TLS material from
# the Caddyfile on every boot.
data_disk_size = "60G"
user = "fedora"
rollback_keep = 2

[vm.network]
# A CI host builds arbitrary code against arbitrary registries and mirrors, so
# there is no allowlist that both works and means anything. Left open
# deliberately, and stated rather than defaulted — `egress` defaults to
# "filtered" (ADR 006 §5.1) and a VM with no reachable destinations would
# otherwise be a silent boot-and-hang.
egress = "open"

# Defaults to passt: no bridge, and the guest is assigned the HOST's address.
#
# READ THIS BEFORE DEPLOYING. The cloud-init in this bundle runs Caddy *inside*
# the guest serving https://virtual-forgejo.local, which assumes the VM has its
# own LAN address. Under passt it does not. As shipped you therefore need to
# publish ports on the host — where 80/443 may already be taken, and where the
# hostname has to point at the host rather than at the VM:
#
#   ports = ["8443:443", "8080:80"]
#
# If you want the in-guest Caddy to work as designed, give the VM a real LAN
# identity instead by naming your own LAN bridge. You provision that bridge
# yourself; it is site-specific, which is why nothing is set here. Note that a
# bridged VM is unfiltered — host egress policy cannot reach it.
#
# bridge = "br0"

[vm.cloud_init]
user_data_file = "/usr/share/workloadctl/workloads/virtual-forgejo/cloud-init/user-data"

[vm.cloud_init.template_vars]
# Forgejo runner version pinned for reproducibility — bump after
# verifying release notes on https://code.forgejo.org/forgejo/runner.
RUNNER_VERSION = "6.2.2"
# Hostname the VM announces via mDNS (systemd-resolved) and serves via Caddy.
# Used in fqdn, /etc/hosts, Caddyfile, and app.ini — change to rename the forge.
FORGEJO_HOSTNAME = "virtual-forgejo.local"
# URL the runner registers against when REGISTER_RUNNER = "true". For a
# self-contained instance this should match https://${FORGEJO_HOSTNAME}.
# Set to a remote forge URL to make this VM act as a runner for an existing
# Forgejo without hosting its own.
FORGEJO_URL = "https://virtual-forgejo.local"
# Whether to register the native forgejo-runner on first boot. Default:
# "false" — first boot brings up Forgejo but does NOT register a runner,
# because the registration token is generated by a logged-in admin in a
# running Forgejo (chicken-and-egg on first boot of a fresh instance).
#
# To register on first boot, set this to "true" AND drop the token at
# /etc/credstore.encrypted/runner-token (see ../workloads/virtual-forgejo/README.md).
# To register after manual Forgejo setup, leave this "false" and run
# `forgejo-runner register` inside the VM by hand.
REGISTER_RUNNER = "false"
# URL to fetch the registry host's Caddy internal CA cert over plain HTTP.
# Required for CI jobs that push/pull from registry.local (or any Caddy-fronted
# registry using local_certs). The host serves it at http://<host>/caddy-root.crt
# — see workloadctl/workloads/caddy/Caddyfile for the server-side setup.
# Leave empty to skip CA trust installation.
REGISTRY_CA_URL = ""
# Central otel-lgtm host the in-VM Alloy collector forwards telemetry to.
# Leave empty to skip provisioning Alloy entirely (the cloud-init bootstrap
# gates the alloy.toml install + `workloadctl enable alloy` on this being
# non-empty). Set to the LAN hostname/IP of the host running otel-lgtm.
ALLOY_CENTRAL_HOST = ""
# host.name / host.role labels Alloy stamps on every outbound signal.
# Defaults make the forge VM identifiable in Grafana without further config.
ALLOY_HOST_LABEL = "virtual-forgejo"
ALLOY_ROLE_LABEL = "ci"
