# Caddy - per-host reverse proxy on 80/443
# Routes incoming requests to local workloads by Host header, so clients
# can address services by name (e.g., http://zot.local) without specifying
# the backend port. Pair with the avahi workload that publishes those names
# via mDNS.
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build caddy
#
#   2. Drop a Caddyfile in place (see workloads/caddy/Caddyfile for a sample):
#        sudo cp /usr/share/workloadctl/workloads/caddy/Caddyfile /var/lib/workloads/caddy/Caddyfile
#
#   3. Enable:
#        sudo workloadctl enable caddy
#
#   4. Open 80/443 through the firewall (the UDP/443 line enables HTTP/3,
#      which Caddy serves automatically alongside TCP):
#        sudo firewall-cmd --add-service=http --add-service=https --permanent
#        sudo firewall-cmd --add-port=443/udp --permanent
#        sudo firewall-cmd --reload
#
#   5. To change routes later:
#        sudo nano /var/lib/workloads/caddy/Caddyfile
#        sudo workloadctl recreate caddy
#
# Why host networking:
#   - Caddy needs to bind 80/443 on the host. The hypervisor image sets
#     net.ipv4.ip_unprivileged_port_start=0, so this works rootless.
#   - Caddy reaches backend workloads via the host's loopback (127.0.0.1:<port>),
#     which is the port pasta forwards from for each pasta-networked workload.
#
# Per-host conflicts:
#   - Only one thing per host can hold 80/443. If another workload (e.g., a
#     Pi-hole web UI) wants port 80, move it to a high port and front it via
#     a Caddyfile site block.

[workload]
name = "caddy"
enabled = false

[setup]
required_files = [
    { path = "./Caddyfile", hint = "/usr/share/workloadctl/workloads/caddy/Caddyfile" },
    # Shared homelab CA public root: copied from the image trust store (where the
    # Forgejo build injects it) into the workload dir so it gets a container_file_t
    # label and the container can read it — a direct mount of the trust anchor is
    # cert_t and SELinux-denied. Drop this (and the pki bits below) for a per-host
    # self-signed CA. See README "Shared homelab CA".
    { path = "./homelab-root.crt", hint = "/etc/pki/ca-trust/source/anchors/homelab-root.crt" },
]

[container]
image = "localhost/caddy:latest"
pull = "never"

[container.health]
# Liveness only — we don't care WHAT Caddy answered, just that it answered.
# Using -f would fail on 4xx (e.g. unmatched Host on the sample Caddyfile),
# which would trip on_failure=kill and put us into a restart loop.
cmd = "curl -sS --max-time 5 -o /dev/null http://localhost:80/"
interval = "30s"
timeout = "10s"
retries = 3
start_period = "15s"
on_failure = "kill"

[storage]
volumes = [
    "./Caddyfile:/etc/caddy/Caddyfile:ro",
    "./caddy:/var/lib/caddy",
    "./config:/etc/caddy/config",
    # Shared homelab CA (see README "Shared homelab CA"). Both files live in the
    # workload dir so they carry a container_file_t label caddy can read under
    # keep-id. The public root (./homelab-root.crt) is copied from the image
    # trust store by [setup] required_files above; the private key
    # (./homelab-root.key) is a per-host 0400 file you place yourself, owned by
    # the workload user — NOT shipped in the image or repo. Remove these lines
    # and the Caddyfile import to use a per-host self-signed CA instead.
    "./homelab-root.crt:/etc/caddy/homelab-root.crt:ro",
    "./homelab-root.key:/etc/caddy/homelab-root.key:ro",
    # PKI snippet dir. setup.sh writes homelab-ca.caddyfile here (shared-root
    # block when the key is present, comment-only when absent); the Caddyfile
    # imports it. The snippet is root-owned 0644 (same as ./homelab-root.crt
    # above), so the keep-id container reads it world-readable. This is what
    # lets caddy keep running when the CA key is missing. (No :U — a rootless
    # user can't chown the root-written file.)
    "./pki:/etc/caddy/pki:ro",
]

[security]
userns = "keep-id"

[host]
# Generates the Caddy PKI snippet from the presence of the shared Homelab CA
# key, so caddy degrades to its own internal CA (still serving) instead of
# crash-looping when the key is absent. See setup.sh.
setup = "setup.sh"

[network]
mode = "host"

[resources]
service_type = "simple"
memory_max = "256M"
memory_high = "128M"
cpu_quota = "100%"
