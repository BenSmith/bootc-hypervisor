# Zot Registry - OCI-native registry with pull-through cache and web UI
# Caches images from docker.io, ghcr.io, quay.io, registry.fedoraproject.org, codeberg.org
# Web UI: http://<host>:5050/
# Registry API: http://<host>:5050/v2/
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build zot-registry
#
#   2. Enable the workload (copies config.json template and starts Zot):
#        sudo cp /usr/share/workloadctl/workloads/zot-registry/config.json /var/lib/workloads/zot-registry/data/config.json
#        sudo workloadctl enable zot-registry
#
#   3. (Optional) Edit the config before or after enabling:
#        sudo nano /var/lib/workloads/zot-registry/data/config.json
#        sudo workloadctl recreate zot-registry
#
#   4. Configure firewall to allow registry access:
#        sudo firewall-cmd --add-port=5050/tcp --permanent
#        sudo firewall-cmd --reload
#
#      Or restrict to local network only:
#        sudo firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="203.0.113.0/24" port port="5050" protocol="tcp" accept'
#        sudo firewall-cmd --reload
#
# Web UI:
#   Open http://<host>:5050/ to browse repos, tags, and image metadata.
#
# Configure clients to use as pull-through cache:
#   Add to /etc/containers/registries.conf (or ~/.config/containers/registries.conf):
#
#     [[registry]]
#     prefix = "docker.io"
#     [[registry.mirror]]
#     location = "<host>:5050"
#     insecure = true
#
#     [[registry]]
#     prefix = "ghcr.io"
#     [[registry.mirror]]
#     location = "<host>:5050"
#     insecure = true
#
#     # ... repeat for quay.io, registry.fedoraproject.org, codeberg.org
#
#   On first pull, Zot fetches from upstream and caches; subsequent pulls are local.
#
# Notes:
#   - Port 5050 on host (5000 inside container) avoids collision with the
#     plain `registry` workload, so both can run side-by-side.
#   - Sync `prefix: "**"` matches all repos; Zot tries each upstream in order
#     on a miss. If you only need specific upstreams, remove unused entries.

[workload]
name = "zot-registry"

[setup]
required_files = [
    { path = "./config.json", hint = "/usr/share/workloadctl/workloads/zot-registry/config.json" },
]

[container]
image = "localhost/zot-registry:latest"
pull = "never"

[container.health]
cmd = "curl -fsS http://localhost:5050/v2/ > /dev/null || exit 1"
interval = "30s"
start_period = "10s"
on_failure = "kill"

[storage]
volumes = [
    "./config.json:/etc/zot/config.json:ro",
    "./registry:/var/lib/registry",
]

[security]
userns = "keep-id"

[network]
# Host networking: zot listens directly on :5050, no port forwarding.
# (Historically set to dodge a pasta failure that was misdiagnosed as a
# rootless-pasta incompatibility; the real cause was a stale libpod pause
# pinning a deleted PrivateTmp /tmp, now fixed in the generator's head units.
# pasta works fine for _wl-* users — host here is just a deliberate choice.)
mode = "host"

[resources]
# Registry doesn't send systemd ready notifications, use simple type
service_type = "simple"
memory_max = "1G"
memory_high = "768M"
cpu_quota = "100%"
