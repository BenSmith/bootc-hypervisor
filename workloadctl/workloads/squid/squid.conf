# Squid configuration for local network caching proxy
# Optimized for package management (DNF, APT, etc.) and general web caching

# Recommended minimum configuration
acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 21          # ftp
acl Safe_ports port 443         # https
acl Safe_ports port 70          # gopher
acl Safe_ports port 210         # wais
acl Safe_ports port 1025-65535  # unregistered ports
acl Safe_ports port 280         # http-mgmt
acl Safe_ports port 488         # gss-http
acl Safe_ports port 591         # filemaker
acl Safe_ports port 777         # multiling http
acl CONNECT method CONNECT

# Deny requests to certain unsafe ports
http_access deny !Safe_ports

# Local network ACL - adjust to your network
acl localnet src 192.168.0.0/16
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src fc00::/7
acl localnet src fe80::/10

# ACL for repository domains that need HTTPS access
acl fedora_repos ssl::server_name .fedoraproject.org
acl fedora_repos ssl::server_name .fedorainfracloud.org
acl docker_repos ssl::server_name .docker.io
acl docker_repos ssl::server_name .docker.com
acl github_repos ssl::server_name .github.com
acl github_repos ssl::server_name .githubusercontent.com
acl quay_repos ssl::server_name .quay.io

# Allow CONNECT to repository domains (for HTTPS)
http_access allow CONNECT fedora_repos
http_access allow CONNECT docker_repos
http_access allow CONNECT github_repos
http_access allow CONNECT quay_repos

# Deny CONNECT to other SSL ports to prevent abuse
http_access deny CONNECT !SSL_ports

# Allow access from localhost and local networks
http_access allow localhost
http_access allow localnet

# Deny all other access to this proxy
http_access deny all

# Squid normally listens on port 3128
http_port 3128

# Cache directory: 10GB on disk, 16 directories, 256 subdirs each
cache_dir ufs /var/spool/squid 10240 16 256

# Leave coredumps in the first cache dir
coredump_dir /var/spool/squid

# Memory cache settings
cache_mem 256 MB
maximum_object_size_in_memory 512 KB
maximum_object_size 512 MB

# Cache common package types longer
refresh_pattern -i \.(rpm|deb|exe|zip|tar|tgz|gz|bz2|iso|dmg)$ 129600 100% 129600
refresh_pattern -i \.(jpg|png|gif|mp3|mp4|webm)$ 10080 90% 43200
refresh_pattern . 0 20% 4320

# Log to stdout/stderr so the systemd service forwards them to the journal
access_log stdio:/dev/stdout squid
cache_log /dev/stderr
cache_store_log none

# Hostname
visible_hostname squid-proxy

# PID file in cache dir (avoids needing a separate logs volume)
pid_filename /var/spool/squid/squid.pid
