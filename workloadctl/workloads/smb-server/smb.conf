# Samba configuration
# Place this file at /var/lib/workloads/smb-server/data/smb.conf (the
# `./smb.conf` volume anchor resolves under data/); `workloadctl enable`
# copies it there for you.
# It will be volume-mounted read-only into the container.
#
# After editing, recreate the workload to apply changes:
#   sudo workloadctl recreate smb-server

[global]
    workgroup = WORKGROUP
    server role = standalone server

    # Guest-only access: failed auth falls back to guest
    security = user
    map to guest = Bad User

    logging = systemd
    log level = 1
    max log size = 1000

    smb ports = 445

    # Disable NetBIOS/printing — not needed for direct SMB2/3 access
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes

# `force user = root` is the *container's* name for the unprivileged
# _wl-smb-server host user: userns keep-id maps container uid 0 to it, so this
# grants nothing beyond what that user already has. It must be the container-side
# name — smbd resolves it with getpwnam against the container's passwd database,
# where the host username has no entry, and an unresolvable name fails every tree
# connect with NT_STATUS_NO_SUCH_USER.
[exports]
    path = /exports
    comment = Shared storage
    browseable = yes
    writable = yes
    guest ok = yes
    force user = root
    create mask = 0664
    directory mask = 0775
    force create mode = 0664
    force directory mode = 0775
