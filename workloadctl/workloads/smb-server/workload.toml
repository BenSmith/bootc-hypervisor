# SMB/CIFS File Server - Samba running rootless
#
# Guest-only simple share: all file access runs as the workload user.
# No per-client UID mapping; suitable for shared storage where ownership
# doesn't need to reflect individual client users.
#
# Port 445 (SMB) is a privileged port. Rootless containers cannot bind to it
# directly even with CAP_NET_BIND_SERVICE (the kernel checks the host network
# namespace's user namespace, which is always init_user_ns). Choose one:
#
#   Option A — Direct port binding (default below):
#      The system image ships net.ipv4.ip_unprivileged_port_start = 0, so
#      smbd can bind to port 445 directly. No extra configuration needed.
#
#   Option B — Firewall redirect (no system-wide sysctl):
#      Set "smb ports = 4445" in smb.conf and skip step 5 below, replacing
#      it with:
#        sudo firewall-cmd --add-forward-port=port=445:proto=tcp:toport=4445 --permanent
#        sudo firewall-cmd --reload
#
# Setup:
#   1. Build the container:
#        sudo workloadctl build smb-server
#
#   2. Enable the workload (copies smb.conf template and starts Samba):
#        sudo workloadctl enable smb-server
#
#   3. Edit the config to set share paths, users, and other settings:
#        sudo nano /var/lib/workloads/smb-server/smb.conf
#        sudo workloadctl recreate smb-server
#
#   4. Configure firewall:
#      Option A (direct port 445):
#        sudo firewall-cmd --add-service=samba --permanent
#        sudo firewall-cmd --reload
#
#      Option B (redirect 445→4445):
#        sudo firewall-cmd --add-forward-port=port=445:proto=tcp:toport=4445 --permanent
#        sudo firewall-cmd --add-port=4445/tcp --permanent
#        sudo firewall-cmd --reload
#
#      Or restrict to local network only (recommended):
#        sudo firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="192.168.0.0/24" service name="samba" accept'
#        sudo firewall-cmd --reload
#
#   6. Mount from a client (uid/gid required for non-root writes):
#        sudo mount -t cifs //<host>/exports /mnt/share \
#            -o guest,uid=$(id -u),gid=$(id -g),file_mode=0664,dir_mode=0775
#
#   After editing smb.conf, recreate to apply:
#        sudo workloadctl recreate smb-server

[workload]
name = "smb-server"
enabled = false

[setup]
required_files = [
    { path = "./smb.conf", hint = "/usr/share/workloadctl/workloads/smb-server/smb.conf" },
]

[container]
image = "localhost/smb-server:latest"
pull = "never"

# The smb-server image ships only the `samba` package (server side); smbclient
# is not available in-container. Probe the listening socket instead.
[container.health]
cmd = "bash -c 'exec 3<>/dev/tcp/127.0.0.1/445'"
interval = "30s"
start_period = "10s"
on_failure = "kill"

[storage]
volumes = [
    "./exports:/exports",
    "./samba-state:/var/lib/samba",
    "./samba-run:/run/samba",
    "./samba-logs:/var/log/samba",
    "./smb.conf:/etc/samba/smb.conf:ro",
    "/run/systemd/journal/socket:/run/systemd/journal/socket",
]

[security]
userns = "keep-id"

[network]
# Host networking: SMB clients connect to the real host IP anyway.
mode = "host"

[resources]
memory_max = "512M"
memory_high = "384M"
cpu_quota = "50%"
