# Example: Caddy reverse proxy + backend service (bridge mode)
#
# A small, dependency-free demonstration of bridge-mode multi-container
# networking. Two containers join an auto-created bridge network; only the
# front-end publishes a port to the host, and the proxy reaches the backend
# by its sibling short-name ("app") via the bridge's built-in DNS.
#
# Both containers run as the workload user (--userns=keep-id), so they bind
# to an unprivileged port (8080) inside; the host-side publish remaps it to
# 8888.
#
# Enable:
#   sudo workloadctl enable webproxy-demo
#
# Validate:
#   curl -s  localhost:8888                                     # whoami body
#   curl -sI localhost:8888 | grep -i via                       # Via: 1.1 Caddy
#   sudo workloadctl exec webproxy-demo/proxy \
#       wget -qO- http://app:8080/                              # sibling DNS
#
# Useful:
#   workloadctl status webproxy-demo            # umbrella + both containers
#   workloadctl logs   webproxy-demo/proxy      # just the proxy
#   workloadctl logs   webproxy-demo/app        # just the backend

[workload]
name = "webproxy-demo"
mode = "bridge"

# --- Backend ----------------------------------------------------------------
# Not published. Reached as "app" by the proxy over the bridge network.
[[containers]]
name = "app"

[containers.container]
image = "docker.io/traefik/whoami:latest"
command = ["--port", "8080"]

[containers.health]
cmd = "wget -qO- http://localhost:8080/ > /dev/null || exit 1"
interval = "30s"
start_period = "10s"
on_failure = "kill"

[containers.resources]
memory_max = "64M"
memory_high = "48M"

# --- Caddy reverse proxy ----------------------------------------------------
# Published on host port 8888. Forwards to http://app:8080.
[[containers]]
name = "proxy"

[containers.container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "reverse-proxy", "--from", ":8080", "--to", "http://app:8080"]

[containers.health]
cmd = "wget -qO- http://localhost:8080/ > /dev/null || exit 1"
interval = "30s"
start_period = "10s"
on_failure = "kill"

[containers.network]
ports = ["8888:8080"]

[containers.resources]
memory_max = "128M"
memory_high = "96M"
