# Forgejo - Lightweight self-hosted Git forge
# Web interface: http://<host-ip>:3000
# SSH clone: ssh://git@<host-ip>:2222/<user>/<repo>.git
#
# Uses the rootless image — runs as UID 1000 (git user) with no container root.
# keep-id:uid=1000,gid=1000 maps the workload user to the container's git user,
# so volumes are writable without userns=host.
#
# Setup:
#   1. Add codeberg.org to the container signature policy if needed:
#        In /etc/containers/policy.json under transports.docker, add:
#          "codeberg.org": [{"type": "insecureAcceptAnything"}]
#      Or mirror the image to your local registry and change the image below.
#
#   2. Enable the workload (volume directories are created automatically):
#        sudo workloadctl enable forgejo
#
#   3. Configure firewall:
#        sudo firewall-cmd --add-port=3000/tcp --permanent
#        sudo firewall-cmd --add-port=2222/tcp --permanent
#        sudo firewall-cmd --reload
#
#      Or restrict to local network only:
#        sudo firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="203.0.113.0/24" port port="3000" protocol="tcp" accept'
#        sudo firewall-cmd --permanent --add-rich-rule='rule family="ipv4" source address="203.0.113.0/24" port port="2222" protocol="tcp" accept'
#        sudo firewall-cmd --reload
#
#   4. Open http://<host-ip>:3000 to complete first-time setup.
#      Create your admin account on the initial configuration page.
#      SQLite is the default database — no external database required.
#
# Git clone over SSH (after adding your SSH key in the web UI):
#   git clone ssh://git@<host-ip>:2222/<user>/<repo>.git
#
# Configuration:
#   The rootless image keeps its config at /var/lib/gitea/custom/conf/app.ini
#   inside the container, which is ./gitea/custom/conf/app.ini in the volume.
#   Edit it there, or set FORGEJO__<section>__<KEY> variables below: the
#   image's entrypoint writes them into app.ini at every start.

[workload]
name = "forgejo"

[container]
image = "codeberg.org/forgejo/forgejo:15-rootless"

# Sessions on disk. The image default is `PROVIDER = memory`, which keeps
# every login inside the process: each restart of this container -- an image
# update, a health-check kill, a host reboot -- logs every user out. The
# file store lives in the volume and survives all of them. LOGIN_REMEMBER_DAYS
# is the "Remember this device" token, which is separate from the session.
[container.environment]
FORGEJO__session__PROVIDER = "file"
FORGEJO__session__PROVIDER_CONFIG = "/var/lib/gitea/data/sessions"
FORGEJO__session__SESSION_LIFE_TIME = "2592000"
FORGEJO__session__GC_INTERVAL_TIME = "86400"
FORGEJO__security__LOGIN_REMEMBER_DAYS = "90"

[container.health]
cmd = "curl -sf http://localhost:3000/api/healthz"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[storage]
volumes = [
    "./gitea:/var/lib/gitea",
#    "./app.ini:/var/lib/gitea/custom/conf/app.ini"
]

[security]
userns = "keep-id:uid=1000,gid=1000"

[network]
mode = "pasta"
ports = ["3000:3000", "2222:2222"]

[resources]
memory_max = "512M"
memory_high = "384M"
cpu_quota = "100%"
