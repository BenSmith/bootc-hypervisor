# forgejo-runner — a Fedora VM that registers with a Forgejo instance as a
# native Actions runner.
#
# Split out of virtual-forgejo: the forge can now be a host *container*
# workload, and this VM exists only to run jobs natively — so `podman build`
# works without container-in-container — and to host the nested-KVM gate rung
# (bootc-image-builder + swtpm + OVMF).
#
# No data disk. Nothing here is precious: build artifacts go to the registry or
# the forge, the workspace is scratch, and container image layers live outside
# the VM in the host zot registry. The runner's only state is its registration,
# and a Forgejo registration token is one-shot — so instead of persisting it,
# `setup.sh` (the [host] setup hook) mints a fresh one on every provision and
# drops it in the credstore for the seed to read. That is why the reset is
# `disable --purge` + `enable`: a total rebuild that re-runs the hook.
#
# Configure before enabling:
#   - FORGEJO_ADMIN_URL below: where this host reaches the forge's admin API
#   - a Forgejo admin API token, so `setup.sh` can mint registration tokens:
#       workloadctl secret create forgejo-admin-token
#   - REGISTRY_CA_URL if CI pushes to a Caddy-fronted registry.local
#
# How the runner reaches the forge: the VM's own derived address
# (198.18.x.y from its uid, WORKLOADCTL_VM_INSPECT_ADDR — the only door a
# passt guest has onto its own host) at FORGEJO_PORT. Nothing here names it;
# it is derived, and the seed composes the URL in one substitution pass.
#
# See /usr/share/workloadctl/workloads/forgejo-runner/README.md.

[workload]
name = "forgejo-runner"

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 4
memory = "6G"
system_disk_size = "40G"
user = "fedora"

[vm.network]
# A build host reaches arbitrary registries and mirrors, so no allowlist both
# works and means anything. Left open deliberately and stated rather than
# defaulted — `egress` defaults to "filtered" (ADR 006 §5.1) and a VM with no
# reachable destinations would otherwise be a silent boot-and-hang.
egress = "open"

[vm.cloud_init]
user_data_file = "/usr/share/workloadctl/workloads/forgejo-runner/cloud-init/user-data"

[vm.cloud_init.template_vars]
# Pinned for reproducibility — bump after reading the release notes at
# https://code.forgejo.org/forgejo/runner. v13 is the floor for the modern
# flow; our previous pin (6.2.2) predates `server.connections`.
RUNNER_VERSION = "13.1.0"
# Where the HOST reaches the forge's admin API, to mint registration tokens
# (setup.sh). Host-side, so a host-reachable URL — localhost, or the forge's
# published LAN port — not the derived address the guest uses. The forge must
# be on this host: that is the whole shape, a runner VM whose only door onto
# its host is its own derived address.
FORGEJO_ADMIN_URL = "http://localhost:3000"
# The forge's published HTTP port — the guest's SAME-HOST connection (when
# FORGEJO_URL below is empty) is composed from this and the guest's own
# derived address (WORKLOADCTL_VM_INSPECT_ADDR).
FORGEJO_PORT = "3000"
# The URL the runner's guest dials for the forge. EMPTY (default) = the forge
# is on this same host (the homelab shape): the seed composes the URL from the
# guest's own derived address + FORGEJO_PORT, and the forge's ROOT_URL must be
# a name listed in SAME_HOST_HOSTNAMES. Set a full URL when the forge is on
# another host: the guest dials it directly, needs no mapping, and ROOT_URL is
# whatever that forge uses.
FORGEJO_URL = ""
# Hostnames of services on THIS host that the guest must reach via its own
# derived address — a passt guest cannot reach the host's primary. For the
# same-host shape this MUST include the forge's ROOT_URL host (Forgejo's
# action URLs are ROOT_URL-derived, so an unmapped name means ECONNREFUSED);
# add any other same-host services (e.g. a registry) too. Space-separated.
# Leave empty when those services are remote — the guest then resolves them
# normally. There is no universal default name.
#
# LOAD-BEARING, not a convenience: these entries are /etc/hosts pins, and they
# are the only thing that makes the names usable. A guest's lookups do reach
# the host's resolver through passt (the guest is told the gateway, passt
# intercepts and forwards to the host's dns-host), but mDNS — which is what
# answers .local on the host — answers A only and never AAAA, so curl/podman
# hang on the AAAA lookup. Pin every name the CI touches.
SAME_HOST_HOSTNAMES = ""
# Extra /etc/hosts entries for CI dependencies on OTHER hosts that only mDNS
# knows (see the note above — reachable through passt, but A-only, so A+AAAA
# clients hang on the AAAA lookup). ';'-separated "<ip> <name>" entries, e.g.
# "192.0.2.10 registry.local". A deployment that needs such a name and pins
# nothing gets a name that resolves for `getent ahostsv4` and fails in curl,
# with no hint as to why.
EXTRA_HOSTS = ""
# Plain-HTTP URL serving the registry's CA cert (e.g. a Caddy internal root),
# fetched by the bootstrap and installed into the guest's trust store so CI
# jobs can push/pull over HTTPS. Must be reachable from the guest — in the
# same-host case that means a hostname listed in SAME_HOST_HOSTNAMES (mapped to
# this VM's derived address), never the host's primary address. Fetched over
# plain HTTP because no prior trust exists. Empty skips the step.
REGISTRY_CA_URL = ""
# How many jobs the runner takes at once. A workflow matrix only runs as wide
# as the capacity available to it, and this is a single VM, so every
# concurrent job shares [vm].vcpus and [vm].memory and one podman store. One
# hypervisor image build wants ~4 vCPU / 6G; size the VM up before raising
# this (e.g. 8 vCPU / 12G for 2). The seed bakes this in at provision time:
# changing it takes `disable --purge` + `enable`.
RUNNER_CAPACITY = "1"

[host]
# Mints a fresh registration token per provision and prunes the stale runner
# row. Runs on `enable` (and `disable` for teardown), before the seed is built.
setup = "setup.sh"
