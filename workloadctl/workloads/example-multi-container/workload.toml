# Example: Multi-container workload (Forgejo + PostgreSQL)
#
# A copy-paste template for a multi-container workload. Disabled by default —
# copy it, rename the file and the workload.name to match, then enable.
#
# This uses BRIDGE mode: each container gets its own network namespace, and
# they are joined to an auto-created bridge network (workload-<name>-net).
# The "web" container reaches the database at host "db" (the container name) —
# DNS resolution between siblings is automatic in bridge mode.
#
# Setup:
#   1. Create the database password as an encrypted credential:
#        echo -n 'choose-a-strong-password' | \
#          sudo systemd-creds encrypt --with-key=tpm2 --name=forgejo-db-password \
#          - /etc/credstore.encrypted/forgejo-db-password
#      (The ${SECRET:forgejo-db-password} references below are auto-detected.)
#
#   2. If needed, allow the codeberg.org image source in
#      /etc/containers/policy.json, or mirror the images to a local registry.
#
#   3. Enable (volume directories are created automatically):
#        sudo workloadctl enable example-multi-container
#
#   4. Open http://<host-ip>:3000 to complete Forgejo's first-time setup.
#
# Useful commands once running:
#   workloadctl status example-multi-container        # umbrella + both containers
#   workloadctl logs   example-multi-container/web    # just the web container
#   workloadctl exec   example-multi-container/db psql -U forgejo

[workload]
name = "example-multi-container"
enabled = false
mode = "bridge"

# --- Database container -----------------------------------------------------
# Not published to the host; only reachable by the "web" container over the
# bridge network, at host "db".
[[containers]]
name = "db"

[containers.container]
image = "docker.io/library/postgres:16"

[containers.environment]
POSTGRES_USER = "forgejo"
POSTGRES_DB = "forgejo"
POSTGRES_PASSWORD = "${SECRET:forgejo-db-password}"

[containers.health]
cmd = "pg_isready -U forgejo"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[containers.storage]
volumes = ["./db:/var/lib/postgresql/data"]

[containers.resources]
memory_max = "512M"
memory_high = "384M"

# --- Web container (Forgejo) ------------------------------------------------
# Published on port 3000. Reaches the database at "db:5432".
[[containers]]
name = "web"

[containers.container]
image = "codeberg.org/forgejo/forgejo:15-rootless"

[containers.environment]
FORGEJO__database__DB_TYPE = "postgres"
FORGEJO__database__HOST = "db:5432"
FORGEJO__database__NAME = "forgejo"
FORGEJO__database__USER = "forgejo"
FORGEJO__database__PASSWD = "${SECRET:forgejo-db-password}"

[containers.health]
cmd = "curl -sf http://localhost:3000/api/healthz"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[containers.storage]
volumes = ["./:/var/lib/gitea"]

[containers.network]
ports = ["3000:3000"]

[containers.resources]
memory_max = "512M"
memory_high = "384M"
