[workload]
name = "wayfire-game-streaming"
enabled = false

[container]
image = "localhost/wayfire-game-streaming:latest"
pull = "never"
systemd = "always"

[container.environment]
CONTAINER_USER = "desktop"
CONTAINER_UID = "1000"
CONTAINER_GID = "1000"

[container.health]
cmd = "pgrep -x sunshine > /dev/null || exit 1"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[devices]
# This configuration requires a render node (/dev/dri/renderD*)
gpu = "auto"

# input = true is NOT used — it maps to --device /dev/input, which snapshots
# device nodes at container start. Sunshine's uinput devices appear later, so
# /dev/input must be a volume bind-mount (live view).
# audio = true is NOT used — it mounts host PipeWire/PulseAudio sockets, but
# this container runs its own PipeWire internally. Only /dev/snd is needed.
devices = ["/dev/uinput", "/dev/snd"]

[security]
userns = "keep-id:uid=1000,gid=1000"
capabilities = [
    "CHOWN", "DAC_OVERRIDE", "FOWNER",
    "SETUID", "SETGID", "FSETID",
    "KILL", "NET_BIND_SERVICE",
    "SETFCAP", "SETPCAP",
    "SYS_CHROOT", "SYS_NICE",
]
extra_groups = ["video", "render", "input", "audio"]
# Map container root to the workload user on the host as well, so files
# created by container-bootstrap (running as uid 0 inside) end up owned by
# _wl-wayfire-game-streaming on the host — same as files created by desktop
# (mapped via the keep-id suffix above). Without this, root-created dirs like
# /home/desktop/.config land on a subuid the host workload user can't touch.
extra_uidmaps = ["+0:@{UID}:1"]
extra_gidmaps = ["+0:@{GID}:1"]

[storage]
volumes = [
    "./home:/home/desktop",
    "/run/systemd/journal/socket:/run/host-systemd/journal/socket",
    "/run/udev:/run/udev:ro",
    "/dev/input:/dev/input",
]

[network]
mode = "host"

[host]
setup = "setup.sh"

[resources]
shm_size = "2g"
memory_max = "8G"
memory_high = "6G"
cpu_quota = "400%"
tasks_max = 16384
