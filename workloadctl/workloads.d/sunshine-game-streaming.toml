[workload]
name = "sunshine-game-streaming"
enabled = false

[container]
image = "localhost/sunshine-game-streaming:latest"
pull = "never"
systemd = "always"

[container.environment]
CONTAINER_USER = "desktop"
CONTAINER_UID = "1000"
CONTAINER_GID = "1000"
DESKTOP_RESOLUTION = "1920x1080"

[container.health]
cmd = "pgrep -x sunshine > /dev/null || exit 1"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[devices]
# This configuration requires a render node (/dev/dri/renderD*)
gpu = "auto"

# input = true is NOT used — it maps to --device /dev/input, which snapshots
# device nodes at container start. Sunshine's uinput devices appear later, so
# /dev/input must be a volume bind-mount (live view).
# audio = true is NOT used — it mounts host PipeWire/PulseAudio sockets, but
# this container runs its own PipeWire internally. Only /dev/snd is needed.
devices = ["/dev/uinput", "/dev/snd"]

[security]
userns = "keep-id"
capabilities = [
    "CHOWN", "DAC_OVERRIDE", "FOWNER",
    "SETUID", "SETGID", "FSETID",
    "KILL", "NET_BIND_SERVICE",
    "SETFCAP", "SETPCAP",
    "SYS_CHROOT", "SYS_NICE",
]
extra_groups = ["video", "render", "input", "audio"]
# Per-workload SELinux type (wl_<name>.process) loaded from
# containers/sunshine-game-streaming/sunshine-game-streaming.cil on enable:
# /dev/uinput + /dev/input, /dev/snd, udev, Steam's bwrap sandbox, and
# Wine/Proton execheap/mmap_zero/execmod — scoped to this workload instead of
# all of container_t. The container runs systemd, so the type is init-capable.
selinux_policy = true

[storage]
volumes = [
    "./home:/home/desktop",
    "/run/systemd/journal/socket:/run/host-systemd/journal/socket",
    "/run/udev:/run/udev:ro",
    "/dev/input:/dev/input",
]

[network]
mode = "host"

[resources]
shm_size = "2g"
memory_max = "8G"
memory_high = "6G"
cpu_quota = "400%"
tasks_max = 16384

[host]
# Non-SELinux host prerequisites (uinput kernel module, udev rule, and the
# host-side udev input-event relay). The SELinux policy is handled separately by
# [security].selinux_policy above.
setup = "setup.sh"
