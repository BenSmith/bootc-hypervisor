# Prometheus Server - Time-series metrics storage and alerting
# Scrapes node-exporter (system + workload metrics), stores data, evaluates
# alert rules. Pair with grafana workload for dashboards.
#
# Web interface: http://<host-ip>:9090
#
# Prerequisites:
#   - prometheus workload (node-exporter) must be enabled
#   - workload-metrics timer provides workload-level metrics via textfile collector
#
# Setup:
#   1. Enable the prometheus (node-exporter) workload first:
#        sudo workloadctl enable prometheus
#
#   2. Enable prometheus-server (copies prometheus.yml template automatically):
#        sudo workloadctl enable prometheus-server
#
#   3. (Optional) Copy bundled alert rules:
#        sudo cp -r /usr/share/workloadctl/containers/prometheus-server/rules \
#                 /var/lib/workloads/prometheus-server/rules
#
#   4. Configure firewall:
#        sudo firewall-cmd --add-port=9090/tcp --permanent
#        sudo firewall-cmd --reload
#
#   6. Verify: http://<host-ip>:9090/targets — node-exporter should show as UP
#
# Data retention: 30 days (configurable via command args below)

[workload]
name = "prometheus-server"
enabled = false

[setup]
required_files = [
    { path = "./prometheus.yml", hint = "/usr/share/workloadctl/containers/prometheus-server/prometheus.yml" },
]

[container]
image = "quay.io/prometheus/prometheus:latest"
# The upstream image runs as nobody (65534). keep-id:uid=65534,gid=65534 maps
# the workload user to container UID 65534, so the container process can write
# to volumes owned by the workload user — no container root needed.
command = [
    "--config.file=/etc/prometheus/prometheus.yml",
    "--storage.tsdb.path=/prometheus",
    "--storage.tsdb.retention.time=30d",
    "--web.enable-lifecycle",
]

[container.health]
cmd = "wget -qO- http://localhost:9090/-/ready > /dev/null || exit 1"
interval = "30s"
start_period = "30s"
on_failure = "kill"

[storage]
volumes = [
    "./prometheus.yml:/etc/prometheus/prometheus.yml:ro",
    "./rules:/etc/prometheus/rules:ro",
    "./data:/prometheus",
]

[security]
userns = "keep-id:uid=65534,gid=65534"

[network]
# Host networking: Prometheus needs to reach node-exporter on localhost:9100
# and any future exporters without knowing the host IP at config time.
mode = "host"

[resources]
memory_max = "512M"
memory_high = "384M"
cpu_quota = "50%"
