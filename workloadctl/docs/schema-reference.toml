# ============================================================================
# Workload Configuration Schema Reference
# ============================================================================
# This file documents ALL possible configuration options for rootless workloads.
# Copy and modify sections to create your own workload configurations.
#
# This example is disabled so it won't be loaded by the generator.
# ============================================================================

[workload]
# Required: Unique name for this workload (used in user name and service name)
# Type: string
# Constraints: Max 27 chars (username limit is 31 chars, "_wl-" prefix uses 4 chars)
# Best practice: Match filename to name (e.g., "webserver" for webserver.toml)
# Valid characters: lowercase letters, numbers, hyphen (must start with letter)
# Example: "gaming", "sunshine", "dev-env", "webserver"
# Username format: _wl-{name}
# UID: Auto-assigned from range 10000-52948
# Home directory: /var/lib/workloads/{name}
name = "schema-reference"

# Optional: Bundle (kind) this workload draws shared control files from.
# Type: string
# Default: the workload name
# The build context (Containerfile, plus an optional build.sh escape hatch via
# [build].script), the [host].setup script, and the
# SELinux CIL (policy.cil) are all looked up under
# /usr/share/workloadctl/workloads/<bundle>/.  Defaults to the workload name, so
# a single shipped instance needs no `bundle` field.  `workloadctl init <bundle>
# --as <name>` and `workloadctl duplicate` set it so a copy shares one bundle's
# control tree without copying it (sharing is just the absence of an override).
# Goes straight into a filesystem path, so it must satisfy the same name rules as
# `name` (lowercase letters, numbers, hyphen) — validated at config load.
# bundle = "vncdesktop-wayfire"

# Optional: Lifecycle policy — how the workload's writable state is treated.
# Type: string
# Default: "cattle"
# Options:
#   "cattle" - Ephemeral overlay: `--rm` destroys and rebuilds the container's
#              writable layer on every start.  Plain reboots wipe any in-container
#              changes that were not declared in the image or as explicit volumes.
#              This is the safe, reproducible default.
#   "pet"    - Durable overlay: the container is created once and started/stopped
#              rather than re-run, so the writable layer (graphroot under /var)
#              survives reboots and bootc updates.  Before any destructive verb
#              (update, recreate) workloadctl commits the overlay to a local
#              snapshot image so deliberate rebuilds are recoverable.
#              For VMs: `update`/`reprovision` will NOT rotate system.qcow2 —
#              the durable disk is kept in place instead of being replaced.
#              NOTE: containers accumulating packages or root-fs state are better
#              served by a [vm] workload for full fidelity.
#              TODO (P3): pet reclassifies home/ as backup-included.
# lifecycle = "cattle"

# Optional: How many pet-lifecycle overlay snapshots to retain.
# Type: integer (>= 1)
# Default: 3
# Each destructive verb (update/recreate) on a "pet" container commits the
# writable overlay to localhost/workload-snapshot/<name>:<timestamp> before
# rebuilding it. This bounds that repository to the newest N snapshots; older
# ones are pruned right after each new commit. The VM equivalent is
# [vm].rollback_keep. Ignored for cattle workloads (they never snapshot).
# snapshot_keep = 3

# Optional: Workload mode — how many containers and how they network.
# Type: string
# Default: inferred — "single" for a [container] block, "pod" for [[containers]].
# Options:
#   "single" - One container. Use a top-level [container] block (the classic
#              form documented throughout this file).
#   "pod"    - Multiple containers sharing one network namespace via a podman
#              pod. Containers reach each other on localhost. Ports are
#              published once, workload-level, on the pod (see [network]).
#   "bridge" - Multiple containers, each with its own network namespace, all
#              joined to an auto-created per-workload bridge network. Containers
#              resolve each other by container name (DNS). Ports are published
#              per container (see [containers.network] below).
# Multi-container workloads use [[containers]] arrays instead of [container];
# see the MULTI-CONTAINER WORKLOADS section below.
# mode = "pod"

# ============================================================================
# VM WORKLOADS
# ============================================================================
# A workload with a [vm] top-level section runs as a KVM/QEMU virtual machine
# instead of a container. [vm] is mutually exclusive with [container] and
# [[containers]].
#
# Quick comparison with container workloads:
#   - Same TOML file, same CLI (enable/disable/shell/exec/update/rollback/info)
#   - Same per-workload isolation user _wl-{name} and home dir
#   - Raw QEMU (not libvirt): service file, UEFI NVRAM, bridge networking, SSH
#   - shell → socat serial console; exec → SSH
#   - update → rebuilds system disk with generational rollback
#
# Networking:
#   All VM workloads join the shared _workload-br bridge (192.168.200.0/24).
#   DHCP assigns addresses in 192.168.200.100-199; hostnames are the workload
#   name (e.g. "myvm"). The bridge and dnsmasq are managed by
#   workload-bridge.service (auto-created alongside the first VM workload).
#
# Disk layout (under /var/lib/workloads/{name}):
#   system.qcow2        - Writable root disk (built from image source once)
#   system.qcow2.gen-N  - Previous generations (rollback_keep + 1 retained;
#                         see rollback_keep below)
#   data.qcow2          - Optional second disk (formatted by cloud-init)
#   nvram.fd            - Per-VM UEFI NVRAM (copy of OVMF_VARS.fd)
#   .ssh/id_ed25519     - Per-workload SSH key (generated once)
#   .image-cache/       - Downloaded cloud images (deduplicates re-enables)
#
# Runtime-only (tmpfs, under /run/workload-vm/{name}, rebuilt every boot):
#   cloud-init.iso      - Seed ISO with SSH key + virtiofs fstab. On tmpfs (not
#                         the home) because it can embed rendered secrets; the
#                         rebuild fingerprint persists in the home.
#
# virtiofs:
#   Each volume declared in vm.volumes gets a virtiofsd sidecar service.
#   The guest mounts them via cloud-init on first boot.
#   Requires: vm.memory and a shared-memory NUMA backend (auto-configured).
#
# [vm]
# Required: Number of virtual CPUs
# vcpus = 2
#
# Required: Memory in QEMU notation ("1024M", "4G", etc.)
# memory = "2048M"
#
# Image source — exactly one required:
#
#   cloud_image_url + cloud_image_checksum
#     Download a qcow2 cloud image once, verify its sha256, copy to system.qcow2.
#     cloud_image_url      = "https://example.com/image.qcow2"
#     cloud_image_checksum = "sha256:<64-hex-digits>"
#
#   local_image
#     Copy (reflink if supported) a local qcow2 file.
#     local_image = "/path/to/image.qcow2"
#
#   image
#     Build via bootc-image-builder from an OCI container ref.
#     Requires nested KVM; unsuitable for CI without nested KVM support.
#     image = "quay.io/myorg/mybootcimage:latest"
#
# Optional: Size of the secondary data disk (omit to skip creating one)
# Type: string in qemu-img notation ("20G", "100M", etc.)
# data_disk_size = "20G"
#
# Optional: cloud-init username for SSH / exec access
# Type: string
# Default: "workload"
# user = "workload"
#
# Optional: Shared directory mounts via virtiofs
# Type: array of strings "host-path:guest-mountpoint"
# Requires a shared-memory NUMA backend (auto-configured when non-empty).
# volumes = ["/mnt/data:/mnt/data"]
#
# Optional: How many *older* system disk generations to keep for rollback,
# in addition to the generation rotated by the current update. Each update
# renames the live system.qcow2 to system.qcow2.gen-N (the newest rollback
# point) and then keeps the rollback_keep next-most-recent generations, so the
# total number of system.qcow2.gen-* files retained is rollback_keep + 1
# (e.g. rollback_keep = 2 keeps 3 generations / restore points).
# Type: integer >= 1
# Default: 2
# rollback_keep = 2
#
# Optional: systemd restart policy for the VM service.
#   "always"     - (default) relaunch QEMU on any unexpected exit. QEMU runs
#                  with -no-reboot, so a guest reboot becomes a clean exit;
#                  "always" turns that into a fresh boot (e.g. the first-boot
#                  kernel-upgrade reboot). StartLimitBurst still bounds a
#                  boot-loop, and `workloadctl stop`/`disable` (which goes via
#                  ExecStop) is never auto-restarted regardless.
#   "on-failure" - leave the VM down on a clean exit (incl. a guest reboot);
#                  relaunch only on a non-zero QEMU exit (a crash).
#   "on-reboot"  - relaunch on a guest reboot, but leave the VM down on an
#                  in-guest poweroff (so `poweroff` inside the guest actually
#                  stops it). A crash still relaunches. QEMU can't express this
#                  via exit code, so the notify wrapper watches the QMP SHUTDOWN
#                  event to tell a reboot from a poweroff.
# Type: string ("always" | "on-failure" | "on-reboot")
# Default: "always"
# restart = "always"
#
# Optional: Attach a virtio-balloon device so the host can reclaim idle guest
# memory at runtime. Has no effect if the guest kernel lacks virtio_balloon
# (Fedora Cloud includes it). Set to false only if the balloon driver causes
# problems (e.g., real-time workloads sensitive to balloon-induced pauses).
# Type: boolean
# Default: true
# balloon = true
#
# [vm.network]
# Optional: Host bridge the VM's NIC attaches to (qemu-bridge-helper).
# Type: string, valid Linux interface name (letters/digits/_/-, max 15 chars)
# Default: "_workload-br"  — the workloadctl-managed bridge with built-in dnsmasq
#                     DHCP/DNS. workloadctl provisions this on demand.
# Set to your LAN bridge (e.g. "br0") to put the VM directly on the LAN.
# When at least one VM uses "_workload-br", workload-bridge.service is generated
# to bring it up; user-provided bridges are assumed to be managed elsewhere
# (NetworkManager / systemd-networkd) and skip that service.
# bridge = "_workload-br"
#
# [vm.cloud_init]
# Optional: Override the seed ISO's user-data with a custom #cloud-config.
# Without this section, workloadctl generates a small built-in user-data
# with the workload's SSH key, optional virtiofs mounts, and optional
# data-disk init — enough for `workloadctl exec` to work out of the box.
#
# When set, the file you supply IS the entire #cloud-config; workloadctl
# does NOT parse or merge it. Substitutions happen via plain text only —
# no YAML library is required, so the file's structure is fully yours.
#
# Optional: Path to the cloud-init user-data file. Relative paths are
# resolved against the directory containing this TOML.
# Type: string
# user_data_file = "./cloud-init/user-data"
#
# Optional: Template variables substituted into user-data via ${VAR}.
# Type: table; values must be scalars (string, int, float, bool).
# template_vars = { REPO_URL = "https://...", VERSION = "1.2.3" }
#
# Substitution rules applied to the user_data_file (in order):
#   ${SECRET:name}  - Decrypted via `systemd-creds decrypt` from
#                     /etc/credstore.encrypted/<name> (falls back to plain
#                     /etc/credstore/<name>). The secret is read at ISO
#                     build time and baked into the seed (root-only path).
#                     Missing credential → build fails loudly.
#   ${SECRET?name}  - Optional variant: missing credential → empty string,
#                     no error. Use when the user-data references a
#                     credential the operator may or may not seed; gate
#                     the consumer with a shell check on the rendered
#                     value, e.g. `[ -n "${RUNNER_TOKEN}" ] && register ...`.
#   ${VAR}          - Looked up in template_vars first, then the environment.
#                     Unresolved refs raise an error at build time, so a
#                     typo fails loudly instead of producing a broken guest.
#   $$              - Collapses to a literal `$`; use $${shellvar} when
#                     you need a literal `${...}` to survive substitution.
#
# Magic variables workloadctl injects (always available in template mode):
#   ${WORKLOADCTL_SSH_KEY}        - The workload's generated SSH pubkey.
#                                   Drop this into users[].ssh_authorized_keys
#                                   so `workloadctl exec` keeps working.
#   ${WORKLOADCTL_WORKLOAD_NAME}  - The workload name (e.g. for hostname).
#   ${WORKLOADCTL_VM_HOST_KEY_B64} - The workload's SSH *host* private key,
#                                   base64-encoded (single line). REQUIRED for a
#                                   custom seed: the CLI pins the host key
#                                   (StrictHostKeyChecking=yes), so a custom
#                                   user_data_file must install it via a
#                                   write_files entry for
#                                   /etc/ssh/ssh_host_ed25519_key (encoding: b64)
#                                   or provisioning fails. The default seed does
#                                   this automatically.
#   ${WORKLOADCTL_VM_HOST_PUBKEY} - The matching SSH host public key.
#
# Notes:
#   - The seed ISO lives in the workload's home dir, mode 0640, owned by
#     the workload user. Secrets baked in are still on a root-only path
#     but persist on disk — rotate them by re-encrypting and rebuilding.
#   - Edits to user_data_file trigger a seed-ISO rebuild on next start
#     (the file's mtime is part of the fingerprint).
#   - If the rendered text doesn't start with `#cloud-config`, that
#     header is prepended so cloud-init still recognises the document.

# ============================================================================
# END OF VM WORKLOADS SECTION
# ============================================================================

# ============================================================================
# VM EXAMPLES
# ============================================================================

# Example VM-1: Fedora Cloud image with data disk
# ------------------------------------------------
# [workload]
# name = "fedora-vm"
#
# [vm]
# vcpus = 2
# memory = "2048M"
# cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
# cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
# data_disk_size = "50G"
# user = "fedora"

# Example VM-2: bootc image with virtiofs share
# -----------------------------------------------
# [workload]
# name = "dev-vm"
#
# [vm]
# vcpus = 4
# memory = "8192M"
# image = "quay.io/myorg/dev-image:latest"
# data_disk_size = "100G"
# volumes = ["/home/user/code:/home/workload/code"]
# rollback_keep = 3

# Example VM-3: Cloud image on LAN bridge with custom cloud-init
# ---------------------------------------------------------------
# [workload]
# name = "lan-vm"
#
# [vm]
# vcpus = 2
# memory = "4G"
# cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
# cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
# data_disk_size = "30G"
# user = "fedora"
#
# [vm.network]
# bridge = "br0"                    # LAN bridge instead of _workload-br
#
# [vm.cloud_init]
# user_data_file = "./cloud-init/user-data"
#
# [vm.cloud_init.template_vars]
# REPO_URL = "https://forgejo.local/me/myproject.git"
# VERSION  = "1.4.2"
# # In the user-data file, reference these as ${REPO_URL} / ${VERSION},
# # and pull encrypted secrets with ${SECRET:db-password} etc.

# ============================================================================

[setup]
# Optional: Files that must exist before the workload can be enabled.
# workloadctl enable checks these before starting and prints copy instructions if missing.
# Paths starting with ./ are relative to the workload home dir (/var/lib/workloads/{name}/).
#
# Fields:
#   path  (required) - Path that must exist (file, not directory)
#   hint  (optional) - Source path shown in the copy instruction
#
# Example:
#   required_files = [
#       { path = "./smb.conf", hint = "/usr/share/workloadctl/workloads/smb-server/smb.conf" },
#       { path = "./app.conf" },   # No hint - just flags it as missing
#   ]
#
# Note: Missing volume directories are checked separately (no setup entry needed for dirs).
# required_files = []

# ============================================================================
# MULTI-CONTAINER WORKLOADS
# ============================================================================
# A workload can declare multiple containers that run together under one
# workload user (_wl-{name}). Instead of a single top-level [container] block,
# use an array of [[containers]] tables:
#
#   [[containers]]
#   name = "web"
#   [containers.container]
#   image = "myapp:latest"
#   [containers.network]
#   ports = ["8080:80"]
#
#   [[containers]]
#   name = "db"
#   [containers.container]
#   image = "postgres:16"
#   [containers.security]
#   capabilities = ["CHOWN"]
#
# Each [[containers]] entry requires a unique `name` (same rules as workload
# names: ^[a-z][a-z0-9-]*$, max 27 chars) and a [containers.container] block
# with an `image`. The [containers.foo] tables that follow attach to the most
# recent [[containers]] entry.
#
# Per-workload service: workload-{name}.service is a oneshot "umbrella" that
# pulls in every container. Per container: workload-{name}-{ctr}.service.
# `workloadctl` commands take {name} (whole workload) or {name}/{ctr} (one
# container) — e.g. `workloadctl logs stack/web`, `workloadctl exec stack/db sh`.
#
# --- Pod mode vs. bridge mode (workload.mode) -------------------------------
#   pod    - All containers share one network namespace. Inter-container
#            traffic is localhost. The pod publishes ports once; set them in
#            the top-level [network] block. The pod's infra container owns the
#            shared user namespace, so userns/extra_uidmaps/extra_gidmaps are
#            workload-level (top-level [security]) in pod mode — a per-container
#            [containers.security].userns is warned and ignored.
#   bridge - Each container has its own network namespace; siblings resolve
#            each other by container name over an auto-created bridge network
#            (workload-{name}-net). Publish ports per container in
#            [containers.network]. Workload-level [network].ports is ignored.
#
# --- Field allocation -------------------------------------------------------
# Workload-level (declared once, at the top level):
#   [workload]   name, mode
#   [setup]      required_files
#   [host]       setup
#   [network]    mode, ports          (pod mode only; ignored in bridge mode)
#   [security]   extra_groups; also userns + extra_uidmaps/extra_gidmaps
#                in POD MODE (the pod owns the shared user namespace)
#   [storage]    home
#   [resources]  slice
#
# Per-container (each block is a sibling of [containers.container] under the
# same [[containers]] entry; see Example 14 below):
#   [containers.container]    image, command, pull, systemd, user
#   [containers.environment]  KEY = "value" pairs (see [container.environment]
#                             below for the single-container documentation —
#                             same shape, same ${SECRET:name} support).
#                             For back-compat, [containers.container.environment]
#                             is also accepted; setting both forms on one
#                             container is rejected as ambiguous.
#   [containers.health]       cmd, interval, timeout, retries, start_period,
#                             on_failure. Same accepted-at-either-depth rule
#                             as environment.
#   [containers.security]     capabilities, security_opt, privileged; also
#                             userns + extra_uidmaps/extra_gidmaps EXCEPT in
#                             pod mode (where they are workload-level)
#   [containers.storage]      volumes
#   [containers.devices]      all device options
#   [containers.secrets]      files
#   [containers.resources]    cpu/memory/io/tasks limits, service_type, timeouts
#   [containers.network]      ports                (bridge mode only)
#
# Single-container TOMLs keep using the top-level blocks documented below;
# they are normalized internally into a one-element container list, so their
# generated units are byte-for-byte unchanged.
# ============================================================================

[container]
# Required: Container image to run
# Type: string (any valid podman/docker image reference)
# Examples:
#   "ghcr.io/user/image:latest"
#   "docker.io/library/nginx:alpine"
#   "localhost/my-image:dev"
image = "ghcr.io/example/workload:latest"

# Optional: Command to run in container (overrides image CMD)
# Type: array of strings
# Default: (uses image's default CMD/ENTRYPOINT)
# Example: ["sleep", "infinity"] for testing
# Example: ["/usr/bin/my-app", "--config", "/etc/app.conf"]
# command = ["sleep", "infinity"]

# Optional: Override the container image's USER directive
# Type: string (UID or username)
# Default: (uses the image's USER — typically root or nobody)
# Use this when the image runs as an unprivileged user (e.g., nobody) but the
# workload's volume directories are owned by the workload user. Common pattern:
#   user = "0" with userns = "keep-id:uid=0,gid=0" — container root maps to the
#   workload user in a private userns (prefer this over userns = "host", which
#   is gated behind unsafe_host_userns; see [security].userns).
# user = "0"

# Optional: Pull policy for container images
# Type: string
# Default: "missing" (pull only if image not present locally)
# Options:
#   "missing" - Pull only if image doesn't exist locally (default)
#   "always"  - Always pull image on start (latest version)
#   "newer"   - Pull if newer version available in registry
#   "never"   - Never pull, use only local images (fails if not present)
# pull = "missing"

# Optional: systemd container mode
# Type: string
# Default: (unset — podman auto-detects, --init is used for zombie reaping)
# Options:
#   "always" - Force --systemd=always, skip --init, add KillSignal=SIGRTMIN+3
#   "true"   - Force --systemd=true, skip --init, add KillSignal=SIGRTMIN+3
#   "false"  - Force --systemd=false, skip --init (container has its own init)
#
# When unset, containers get --init (catatonit as PID 1) for zombie reaping
# and signal forwarding. Set this when the container runs systemd as PID 1
# or has its own init process that handles zombie reaping.
#
# Use "always" for containers with systemd as PID 1 (e.g. desktop containers).
# Use "true" for containers where podman should auto-detect systemd entrypoints.
# Use "false" when you have a custom init but don't want --init or --systemd.
#
# Any value of systemd (including "false") skips --init.
# Invalid values cause the workload to be skipped with an error.
# systemd = "always"

# ============================================================================
# ZOMBIE PROCESS REAPING
# ============================================================================
# By default, workload containers run with --init, which injects podman's
# built-in init process (catatonit) as PID 1. This:
#
# - Reaps zombie (defunct) processes that accumulate when child processes exit
# - Forwards signals (SIGTERM, SIGINT) to the container's main process
#
# When container.systemd is set, --init is skipped — systemd or the
# container's own init process handles PID 1 duties instead.
# ============================================================================

# ============================================================================
# LOGGING
# ============================================================================
# Container stdout/stderr go straight into the host's systemd journal via the
# passthrough log driver (--log-driver=passthrough): podman hands the unit's
# journal stream fds to the container, so every line is stored exactly once.
# (The journald driver kept a second, untagged copy of each line via the
# unit's stdout relay.) The stream is named after the container with
# SyslogIdentifier=, so lines read:
#
#   workload-{name}[pid]: message         # single mode
#   workload-{wl}-{ctr}[pid]: message     # pod/bridge member containers
#
# Podman's own messages (image pulls, errors) share the same identifier.
#
# View logs:
#   workloadctl logs {name}                 # wraps journalctl
#   journalctl -u workload-{name}.service   # service lifecycle + container
#   journalctl -t workload-{name}           # container output only
#   journalctl -ft workload-{name}          # follow container output
#
# For systemd containers (containers running systemd inside), console output
# forwarded by the guest systemd lands in the same stream.
#
# Note: `podman logs` does NOT work with the passthrough driver — podman never
# stores its own copy. Use journalctl (or `workloadctl logs`) instead.
#
# This is not configurable per-workload. Log rotation is managed by journald.
# ============================================================================

[container.health]
# Optional: Health check configuration
# Runs a command inside the container periodically to verify the workload is
# functioning correctly. If the check fails after the configured retries,
# podman marks the container as unhealthy.
#
# The cmd field is required to enable health checks. All other fields have
# sensible defaults.
#
# Examples:
#   cmd = "curl -f http://localhost:8080/health || exit 1"
#   cmd = "pg_isready -U postgres"
#   cmd = "redis-cli ping"
#   cmd = "wget -qO- http://localhost/admin/ || exit 1"

# Required: Command to run inside the container
# Type: string (shell command, run via /bin/sh -c)
# cmd = "curl -f http://localhost:8080/ || exit 1"

# Optional: Time between health checks
# Type: string (duration)
# Default: "30s" (podman default)
# interval = "30s"

# Optional: Max time a single health check can take before being killed
# Type: string (duration)
# Default: "30s" (podman default)
# timeout = "30s"

# Optional: Number of consecutive failures before marking unhealthy
# Type: integer
# Default: 3 (podman default)
# retries = 3

# Optional: Grace period after container start before health checks begin
# Type: string (duration)
# Default: "0s" (podman default)
# Use this for containers that need time to initialize (e.g. database migration)
# start_period = "60s"

# Optional: What to do when the container becomes unhealthy
# Type: string
# Default: "none"
# Options:
#   "none"    - Only mark as unhealthy (visible in podman inspect / metrics)
#   "kill"    - Restart the workload unit (systemctl restart)
#   "restart" - Restart the workload unit (systemctl restart)
#   "stop"    - Stop the workload unit (systemctl stop); it stays down
# Recommended: "kill" — restart the workload and track it in NRestarts, which
#   surfaces in monitoring. Use "stop" only when a failing workload should stay
#   down rather than flap.
#
# How the action fires: podman's native healthcheck timer runs inside the user
# manager (ADR 001 option 1b topology) for all modes — single, bridge, and pod.
# There is no separate system-manager timer or workload-healthcheck shim.
# "restart" — podman restarts the container in place (container-level restart,
#             not a full unit restart; the unit stays active).
# "kill"    — podman kills the container; the unit's Restart=on-failure then
#             recovers the workload (unit-level restart). This is the recommended
#             pattern for systemd-managed containers: the unit RestartSec=5s
#             prevents flapping and surfaces NRestarts in monitoring.
# "stop"    — podman stops the container; the unit also stops and stays down
#             (Restart=on-failure does not re-trigger on an explicit stop).
# "none"    — only marks the container unhealthy (visible in podman inspect /
#             metrics); no automatic action.
# on_failure = "none"

[container.environment]
# Optional: Environment variables to inject into the container
# Type: table (key-value pairs)
# Default: {}
# Values can be plain strings or secret references using ${SECRET:name} syntax
# Examples:
#   PUBLIC_URL = "https://example.com"           - Plain value
#   API_KEY = "${SECRET:api-key}"                - Secret reference (auto-detected, loaded from systemd credential)
#   DB_PASSWORD = "${SECRET:db-password}"        - Secret reference (auto-detected)
#   DEBUG = "true"                               - Plain value
# Note: Secrets are auto-detected from ${SECRET:name} references and loaded automatically
# Optionally use [secrets.files] to mount credentials as files in the container
PUBLIC_URL = "https://example.com"
API_KEY = "${SECRET:example-api-key}"
DEBUG = "false"

[secrets]
# Optional: Mount systemd credentials as files inside the container
# Type: array of tables
# Default: [] (no file-mounted secrets)
#
# AUTOMATIC SECRET DETECTION:
# Secrets referenced in environment variables using ${SECRET:name} syntax are
# automatically detected and loaded. You don't need to list them here unless
# you want to mount them as files.
#
# Each entry mounts a systemd credential as a file in the container
# Format: { credential = "name", path = "/container/path", mode = "ro" }
#
# Each credential must have a corresponding encrypted file:
#   /etc/credstore.encrypted/{credential-name}
# At runtime, systemd will decrypt these to:
#   /run/credentials/workload-{name}.service/{credential-name}
#
# Examples:
#   files = [
#     { credential = "tls-cert", path = "/app/cert.pem" },
#     { credential = "tls-key", path = "/app/key.pem", mode = "ro" },
#     { credential = "ssh-key", path = "/home/user/.ssh/id_rsa", mode = "ro" }
#   ]
#
# To create encrypted credentials:
#   echo -n "my-secret" | sudo systemd-creds encrypt --with-key=tpm2 --name=api-key - /etc/credstore.encrypted/api-key
#
# Note: Files are mounted read-only by default for security
files = [
    { credential = "example-api-key", path = "/run/secrets/api-key" }
]

[devices]
# Optional: Generic device passthrough
# Type: array of strings (device paths or CDI device names)
# Default: [] (no devices)
# Format: Regular device paths (/dev/xxx) or CDI names (nvidia.com/gpu=0)
# Examples:
#   ["/dev/sdb"]                        - Block device (WARNING: grants raw disk access!)
#   ["/dev/tpm0"]                       - TPM device
#   ["/dev/ttyUSB0"]                    - USB serial device (Zigbee/Z-Wave stick)
#   ["/dev/video0", "/dev/video1"]      - Webcams or capture cards
#   ["nvidia.com/gpu=0"]                - Raw NVIDIA CDI ref. Prefer gpu = "nvidia:<spec>" instead.
# Note: Device paths must exist on the host and may change on reboot
# Note: You must add appropriate groups (dialout, video, disk, tpm, etc.) to security.extra_groups
devices = ["/dev/ttyUSB0", "/dev/video0"]

# CONVENIENCE FLAGS (for complex multi-device scenarios)
# These are shortcuts that expand to multiple devices and/or special handling

# Optional: GPU type for hardware acceleration
# Type: string
# Options: "amd", "nvidia", "intel", "auto", "none", or "nvidia:<spec>"
# Default: "none"
# "amd"             - Expands to: --device /dev/kfd --device /dev/dri
#                     Requires: extra_groups = ["video", "render"]
# "nvidia"          - Expands to: --device=nvidia.com/gpu=all --device /dev/dri
#                     Requires: extra_groups = ["video"]
# "intel"           - Expands to: --device /dev/dri
# "auto"            - Detect vendor from sysfs (first GPU wins). Resolves to
#                     "amd"/"nvidia"/"intel"/"none" — does NOT pin a card.
# "none"            - No GPU access
# "nvidia:<spec>"   - Pin one NVIDIA GPU. <spec> is any CDI device name from
#                     `nvidia-ctk cdi list`: an enumeration index ("1") or a
#                     stable GPU UUID ("GPU-b6297698-...").
#                     Expands to: --device=nvidia.com/gpu=<spec>
#                     The umbrella /dev/dri is intentionally NOT mounted —
#                     the CDI hook injects only the matching card's
#                     /dev/dri/cardN + /dev/dri/renderDN, so the other GPUs
#                     are invisible inside the container.
#                     Use a UUID for stable pinning (indices change if you
#                     add, remove, or reseat a card).
gpu = "amd"
# gpu = "nvidia:GPU-<uuid>"   # pin by UUID
# gpu = "nvidia:1"            # pin by index (brittle)

# Optional: Enable input device access (/dev/input/*, /dev/uinput)
# Type: boolean
# Default: false
# Expands to: --device /dev/input --device /dev/uinput
# Useful for: game streaming, virtual input, controllers
# Requires: extra_groups = ["input"]
input = true

# Optional: Enable audio device access
# Type: boolean
# Default: false
# Expands to: --device /dev/snd + auto-detects/mounts PulseAudio/PipeWire sockets
# Useful for: media servers, game streaming, audio processing
# Requires: extra_groups = ["audio"]
# Auto-detects and mounts audio server sockets from /run/user/{uid}/
# (PulseAudio: /run/user/{uid}/pulse, PipeWire: /run/user/{uid}/pipewire-0)
audio = true

# Optional: Enable virtualization support (KVM)
# Type: boolean
# Default: false
# Expands to: --device /dev/kvm --device /dev/vhost-net --device /dev/vhost-vsock
# Useful for: nested virtualization, running VMs in containers
# Requires: extra_groups = ["kvm"]
virtualization = true

[security]
# Optional: User namespace mode
# Type: string
# Default: "keep-id"
# Options:
#   "keep-id" - Container UID matches host UID (maximum isolation)
#               Container root (UID 0) → subuid (~100000+) on host
#               Workload user (UID 10009) → same inside container
#               Best for: Maximum security, non-systemd containers
#   "keep-id:uid=N,gid=N" - Like keep-id, but remap workload user to container UID N
#               Workload user on host → container UID N (instead of same UID)
#               Use when the container image runs as a fixed non-root UID
#               (e.g. nobody=65534, git=1000) and volumes need to be writable
#               Same security as keep-id — no container root access
#   "host"    - Share the HOST user namespace (container root → workload user,
#               but in the host's userns, not a private one)
#               GATED: dissolves the per-workload isolation boundary, so it is
#               REFUSED unless unsafe_host_userns = true is also set (see below).
#               Only genuinely needed when the container must see host-side UIDs
#               through a host mount (e.g. a metrics agent reading /host/proc).
#               If the container merely needs to *be* root (systemd, wg-quick,
#               pihole entrypoints), use "keep-id:uid=0,gid=0" instead: that
#               gives container root in a PRIVATE userns — same in-container
#               root, no host userns.
#
# IMPORTANT: Prefer "keep-id:uid=N,gid=N" (incl. uid=0) over "host". Reach for
# "host" only when the container must observe host-side UIDs, and then set
# unsafe_host_userns = true to acknowledge the elevated trust.
# Examples:
#   userns = "keep-id"                        # Default - maximum security
#   userns = "keep-id:uid=65534,gid=65534"   # Remap to nobody (e.g. Prometheus)
#   userns = "keep-id:uid=1000,gid=1000"     # Remap to UID 1000 (e.g. Forgejo)
#   userns = "keep-id:uid=0,gid=0"           # Container root, private userns
#   userns = "host"                           # host userns (needs opt-in below)
# userns = "keep-id"

# GATE: opt in to userns = "host". Host userns dissolves the per-workload
# isolation boundary, so a workload that sets userns = "host" WITHOUT this key
# fails validation (enable/install/validate refuse) and is skipped by the boot
# generator — it never starts. Set this true to acknowledge the elevated trust.
# It is surfaced in `status` and `diagnose` so the posture stays visible.
# Type: bool   Default: false
# unsafe_host_userns = false

# Optional: Linux capabilities to add to the container
# Type: array of strings
# Default: [] (no additional capabilities)
# Format: List of capability names (without CAP_ prefix)
# Examples:
#   ["NET_BIND_SERVICE"]              # Bind to privileged ports (< 1024)
#   ["NET_ADMIN", "NET_RAW"]          # Network administration, raw sockets
#   ["SYS_ADMIN"]                     # System administration (mount, etc.)
#   ["CHOWN", "SETUID", "SETGID"]     # File ownership, user/group changes
#   ["SYS_CHROOT"]                    # chroot capability
#   ["AUDIT_WRITE"]                   # Write to audit log
#
# Common capability needs:
#   DNS server (pihole):        ["NET_BIND_SERVICE", "NET_ADMIN", "CHOWN"]
#   Backup server (borgbackup): ["SETUID", "SETGID", "SYS_CHROOT"]
#   System management (cockpit):["SYS_ADMIN", "NET_ADMIN", "AUDIT_WRITE"]
#
# NOTE: Prefer specific capabilities over privileged = true
# See: man capabilities(7) for full capability list
# capabilities = []

# Optional: Security options for SELinux, seccomp, apparmor, etc.
# Type: array of strings
# Default: [] (use podman defaults)
# Format: List of security options passed to podman --security-opt
#
# Common SELinux options:
#   ["label=type:container_t"]           # Default container type (explicit)
#   ["label=type:custom_container_t"]    # Custom SELinux type
#   ["label=level:s0:c100,c200"]         # Custom MCS categories
#   ["label=disable"]                    # Disable SELinux (NOT recommended)
#
# Other options:
#   ["seccomp=unconfined"]               # Disable seccomp filtering
#   ["apparmor=unconfined"]              # Disable AppArmor
#   ["no-new-privileges=true"]           # Prevent privilege escalation
#
# Examples:
#   # Custom SELinux type with specific MCS label
#   security_opt = ["label=type:workload_container_t", "label=level:s0:c100,c200"]
#
#   # Disable SELinux for troubleshooting
#   security_opt = ["label=disable"]
#
# security_opt = []

# Optional: Ship a per-workload SELinux type
# Type: bool
# Default: false
# When true, `enable` loads the bundle's udica-style CIL policy
# (workloads/<bundle>/policy.cil) as a name-keyed module (wl_<name>) and the
# generator labels the container with type wl_<name>.process; `disable` removes
# it.
#
# The CIL is sourced from the resolved `[workload] bundle` (which defaults to the
# workload name), so a renamed copy keeps using its source bundle's policy with
# no extra field — the loaded module and label stay wl_<name>.process regardless.
# (The old string form of this field is subsumed by `bundle`.)
#
# The .cil is a CIL block using the __WL_MODULE__ placeholder (substituted
# at enable time), e.g.:
#     (block __WL_MODULE__
#         (blockinherit container)        ; required — full container domain
#         (blockinherit net_container)    ; if the workload needs the network
#         (allow process <target_type> (<class> (<perms>))))
# Author new policy with `udica` against a running container. See
# docs/workload-bundles.md and llms.txt "SELinux confinement" for the rationale.
# selinux_policy = false

# Optional: Additional system groups for the workload user
# Type: array of strings
# Default: [] (no additional groups)
#
# Common groups (must exist on host):
#   "audio"   - Audio device access (/dev/snd/*)
#   "dialout" - Serial device access (/dev/ttyUSB*, /dev/ttyACM*)
#   "disk"    - Block device access (/dev/sd*, /dev/nvme*)
#   "input"   - Input device access (/dev/input/*, /dev/uinput)
#   "kvm"     - Virtualization access (/dev/kvm)
#   "render"  - GPU rendering access (/dev/dri/renderD*, /dev/kfd)
#   "tpm"     - TPM device access (/dev/tpm*)
#   "video"   - Video device access (/dev/dri/card*, /dev/nvidia*, /dev/video*)
#
# IMPORTANT: You must explicitly specify groups needed for device access!
# Example for AMD GPU: ["video", "render"]
# Example for NVIDIA GPU: ["video"]
# Example for input devices: ["input"]
# Example for USB serial devices: ["dialout"]
# Example for audio: ["audio"]
# Example for video capture: ["video"]
# Example for virtualization: ["kvm"]
extra_groups = ["video", "render", "input", "dialout", "audio"]

# Optional: Extra UID maps for the container user namespace
# Type: array of strings
# Default: [] (auto-populated from workload user UID)
# Format: podman --uidmap syntax, e.g. "+N:@N:1"
#
# When extra_groups is set with a keep-id userns, the generator auto-populates
# uidmaps and gidmaps to bring the workload user's UID/GID and all extra_groups
# GIDs into the user namespace. Use these fields only if you need additional
# mappings beyond the auto-generated ones.
#
# Placeholders: {UID} and {GID} are replaced with the workload user's UID/GID.
#
# These are deferred to the EnvironmentFile (resolved at service start, not
# generator time) since the workload user may not exist when the generator runs.
#
# Example:
#   extra_uidmaps = ["+1000:@1000:1"]
#   extra_gidmaps = ["+1000:@1000:1"]
# extra_uidmaps = []
# extra_gidmaps = []

# Optional: Run container in privileged mode
# Type: boolean
# Default: false
# WARNING: Privileged containers have ALL capabilities and access to ALL devices
# Consider using specific capabilities instead (capabilities = [...])
# Only use for backward compatibility or extreme edge cases
# privileged = false

[storage]
# The workload's directory is always /var/lib/workloads/{name} — it is not
# configurable. Everything anchored below (./ and @/) resolves under it, and
# workload_root_dir() hardcodes it. To put a workload's data on another
# filesystem, mount that filesystem and give the volume an absolute host path.

# Optional: Additional volume mounts
# Type: array of strings
# Default: []
# Format: "host-path:container-path[:options]"
#
# Path substitution — workload-relative anchors (the /var/lib/workloads/{name}
# tree is split into a precious data/ subtree and a reconstructible state/ one):
#   ./sub   (sugar for data/sub)   -> {root}/data/sub          PRECIOUS  (backed up)
#   @/sub   (sugar for state/sub)  -> {root}/state/volumes/sub  reconstructible (build caches/scratch, NOT backed up)
#   /abs/path                      -> used verbatim (admin must create it)
#   Example: "./cache:/data" becomes "/var/lib/workloads/myapp/data/cache:/data"
#
# Note: the bare host names "data" and "state" (and the data/ / state/ prefixes)
# are reserved anchors — "data:/x" is rewritten to a bind from {root}/data, so
# you cannot declare a *named volume* literally called "data" or "state" here.
# A `..` or absolute escape inside an anchor (e.g. "./../x") is rejected.
#
# Examples:
#   "./config:/config:ro"          - precious data/config, read-only
#   "@/build-cache:/cache"         - reconstructible state scratch (excluded from backup)
#   "/etc/config:/config:ro,z"     - Absolute path, SELinux relabeled
#   "/mnt/data:/data:ro"           - Absolute path, read-only mount
#   "/mnt/shared:/shared"          - Absolute path, read-write mount
volumes = [
    "./config:/config:ro",
    "/mnt/games:/games:ro",
    "/mnt/saves:/saves"
]

[network]
# Optional: Container network mode
# Type: string
# Default: "pasta" (rootless networking with port forwarding, works in Podman 5.3+)
# Options:
#   "host"       - Use host network namespace (no isolation, maximum performance)
#   "mynetwork"  - Custom network name (user-defined network, must create first)
#   "none"       - No networking (container is completely isolated)
#   "pasta"      - Isolated networking with port forwarding (recommended, secure & fast)
#
# Custom networks enable container-to-container communication:
#   1. Create network: sudo -u _wl-myapp-1 podman network create mynetwork
#   2. Set mode = "mynetwork" in workload configs
#   3. Containers on same network can communicate by name/IP
mode = "pasta"

# Optional: Port publishing (port forwarding)
# Type: array of strings
# Default: [] (no ports published)
# Format: "host-port:container-port[/protocol]"
# Examples:
#   "8080:80"              - Map host port 8080 to container port 80
#   "8443:443/tcp"         - Map host port 8443 to container port 443 TCP
#   "127.0.0.1:9000:9000"  - Bind only to localhost
# Note: Port publishing works with pasta mode and custom networks (ignored for host/none)
# Note: Rootless containers cannot bind to ports < 1024 without special config
ports = ["8080:80", "8443:443"]

[host]
# Optional: Host setup script, run during workloadctl enable/disable.
# Type: string (path relative to the container directory)
# Default: (none)
#
# When set, workloadctl enable runs `<script> enable` and workloadctl
# disable runs `<script> disable`. The script is expected to be idempotent
# in both directions.
#
# Container directory: /usr/share/workloadctl/workloads/{name}/
#
# Use for host-level prerequisites that can't be handled by the container
# itself, such as:
#   - Kernel module loading (/etc/modules-load.d/)
#   - udev rules (/etc/udev/rules.d/)
#   - SELinux policy modules (semodule -i)
#   - Host sysctl settings
#
# The script runs as root (workloadctl requires root for enable/disable).
# setup = "setup.sh"

[build]
# Optional: how `workloadctl build <name>` builds this workload's image.
#
# Only relevant for locally-built images, i.e. a [container] (or [[containers]])
# with `pull = "never"`. With a Containerfile present in the bundle and no
# [build] section at all, `build` Just Works: it runs `podman build` over the
# resolved build context and tags the result exactly as [container].image.
#
# THE BUILD CONTEXT IS OVERRIDE-RESOLVED. workloadctl assembles a merged context
# — the shipped /usr/share/workloadctl/workloads/<bundle>/ tree with your
# /etc/workloads.d/<name>/ overrides laid on top, file by file — so editing the
# Containerfile or a COPY-ed asset via `workloadctl edit <name> <file>` actually
# takes effect. (workloadctl's control files — workload.toml, build.sh,
# policy.cil, the [host].setup script — are stripped from the context so a bare
# `COPY . /` can't sweep them into the image.)
#
# containerfile: Containerfile name inside the context. Relative (no '..').
#                Default: "Containerfile".
# containerfile = "Containerfile"
#
# args: static --build-arg values.
# args = { GPU_TYPE = "amd" }
#
# arg_env: host env var names forwarded as --build-arg WHEN SET — the transient
#          per-build knob (an RPM URL, a GPU type). The env value wins over the
#          matching `args` default. Example:
#            sudo GPU_TYPE=nvidia workloadctl build <name>
# arg_env = ["GPU_TYPE"]
#
# target: optional multi-stage build --target.
# target = "runtime"
#
# script: ESCAPE HATCH. Path to a build script (resolved through the override
#         chain like any control file). When set, `build` runs it INSTEAD of the
#         built-in builder, handing it the merged context dir and target tag as
#         argv plus WL_BUILD_CONTEXT / WL_TAG / WL_IMAGE in the environment — so
#         the script builds the override-resolved context rather than locating
#         its own directory. Use only for genuinely imperative builds the
#         declarative fields above can't express; prefer the built-in builder.
# script = "build.sh"

[resources]
# Optional: Resource limits and constraints
# Type: Various (see individual options)
# Default: No limits (workload can use all available resources)
#
# PHILOSOPHY: Simple for common cases, powerful for advanced users
# - Use simple percentage/size strings for convenience ("50%", "2G")
# - Use escape hatches for fine-grained control (custom systemd directives)
#
# All resource limits use systemd cgroup v2 controls (ADR 001 option 1b).
#
# WORKLOAD-LEVEL CAPS (MemoryMax, MemoryHigh, CPUWeight, IOWeight, etc.): go on the
# user@<uid>.service drop-in emitted by the generator; they bind the entire
# workload subtree including all its containers.
#
# VM WORKLOADS take the same block — QEMU runs directly under the VM service unit
# (no user manager in between), so the caps, the timeouts and custom_directives
# all bind there instead of on a drop-in. Same keys, same meaning.
#
# PER-CONTAINER CAPS (memory_max, cpu_quota, pids_max, etc.): passed as podman
# flags (--memory, --cpus, --pids-limit, --device-read-bps, --device-write-bps)
# and bind natively via the user manager's delegated cgroup subtree. All modes
# (single, pod, bridge) are enforced equally — there is no pod-mode exception.
#
# NOTE: per-container MemoryHigh has no podman equivalent (--memory-reservation
# maps to memory.low, not memory.high). Use the workload-level memory_high
# directive for throttle-before-kill semantics.

# Optional: systemd slice for cgroup grouping
# Type: string (systemd slice unit name)
# Default: "workloads.slice"
# The default workloads.slice sets aggregate limits (90% memory, lower CPU/IO
# weight) so workloads can never starve the host. Override to place a workload
# in a different slice, or "system.slice" to use the system default.
# slice = "workloads.slice"

# Optional: Shared memory size (/dev/shm)
# Type: string (size with unit)
# Default: "64m" (podman default)
# Format: "N" (bytes), "Nk" (kilobytes), "Nm" (megabytes), "Ng" (gigabytes)
# Examples:
#   "256m" - 256 megabytes
#   "2g"   - 2 gigabytes
# Use case: Applications that use shared memory (Firefox, GPU-accelerated apps,
#           databases, multiprocessing). Firefox and Chrome commonly need >64MB.
# Podman flag: --shm-size
# shm_size = "2g"

# ============================================================================
# CPU LIMITS - Control processor usage
# ============================================================================

# Optional: CPU quota (percentage of CPU time)
# Type: string (percentage)
# Default: unlimited
# Format: "N%" where N is the percentage of one CPU core
# Examples:
#   "50%"  - Limit to 50% of one CPU core (0.5 CPUs)
#   "100%" - Limit to one full CPU core
#   "200%" - Limit to two CPU cores
#   "350%" - Limit to 3.5 CPU cores
# Note: Enforced over 100ms period by default
# Systemd directive: CPUQuota=
# cpu_quota = "100%"

# Optional: CPU scheduling weight
# Type: integer (1-10000)
# Default: 100
# Purpose: Relative CPU priority when system is under load
# Examples:
#   100  - Default weight (normal priority)
#   50   - Half priority (less CPU time when competing)
#   200  - Double priority (more CPU time when competing)
#   1000 - Very high priority
# Note: Only matters when CPUs are saturated
# Systemd directive: CPUWeight=
# cpu_weight = 100

# ============================================================================
# MEMORY LIMITS - Control RAM and swap usage
# ============================================================================

# Optional: Maximum memory (hard limit)
# Type: string (size with unit)
# Default: unlimited
# Format: "N" (bytes), "NK" (kilobytes), "NM" (megabytes), "NG" (gigabytes)
# Examples:
#   "512M" - 512 megabytes
#   "2G"   - 2 gigabytes
#   "1.5G" - 1.5 gigabytes
# Behavior: If exceeded, processes are killed (OOM killed)
# Use case: Prevent runaway memory consumption
# Systemd directive: MemoryMax=
# memory_max = "2G"

# Optional: Memory high watermark (soft limit)
# Type: string (size with unit)
# Default: unlimited
# Format: Same as memory_max
# Examples:
#   "1G"   - Start throttling at 1GB
#   "1.5G" - Start throttling at 1.5GB
# Behavior: If exceeded, kernel aggressively reclaims memory (throttles but doesn't kill)
# Use case: Set slightly below memory_max to avoid OOM kills
# Recommendation: Set to ~75% of memory_max
# Systemd directive: MemoryHigh=
# memory_high = "1.5G"

# Optional: Maximum swap usage
# Type: string (size with unit or "0")
# Default: unlimited
# Format: Same as memory_max, or "0" to disable swap
# Examples:
#   "0"    - Disable swap for this workload
#   "512M" - Allow up to 512MB swap
#   "1G"   - Allow up to 1GB swap
# Behavior: Limits swap usage separately from memory_max
# Use case: Disable swap for latency-sensitive workloads
# Systemd directive: MemorySwapMax=
# memory_swap_max = "0"

# ============================================================================
# I/O LIMITS - Control disk bandwidth and priority
# ============================================================================

# Optional: I/O scheduling weight
# Type: integer (1-10000)
# Default: 100
# Purpose: Relative I/O priority when disk is saturated
# Examples:
#   100  - Default weight (normal priority)
#   50   - Half priority (less I/O bandwidth when competing)
#   200  - Double priority (more I/O bandwidth when competing)
#   1000 - Very high priority
# Note: Only matters when disk is saturated
# Systemd directive: IOWeight=
# io_weight = 100

# Optional: I/O read bandwidth limit (per-device)
# Type: array of strings
# Default: [] (unlimited)
# Format: "device-path bandwidth"
# Examples:
#   ["/dev/sda 10M"]           - Limit /dev/sda reads to 10 MB/s
#   ["/dev/nvme0n1 100M"]      - Limit /dev/nvme0n1 reads to 100 MB/s
#   ["/dev/sda 10M", "/dev/sdb 20M"]  - Multiple device limits
# Units: K, M, G (KB/s, MB/s, GB/s)
# Use case: Prevent workload from saturating storage bandwidth
# Systemd directive: IOReadBandwidthMax=
# io_read_bandwidth_max = ["/dev/sda 50M"]

# Optional: I/O write bandwidth limit (per-device)
# Type: array of strings
# Default: [] (unlimited)
# Format: "device-path bandwidth"
# Examples: Same as io_read_bandwidth_max
# Use case: Prevent excessive write I/O
# Systemd directive: IOWriteBandwidthMax=
# io_write_bandwidth_max = ["/dev/sda 50M"]

# ============================================================================
# PROCESS LIMITS - Control number of processes/threads
# ============================================================================

# Optional: Maximum number of tasks (processes + threads)
# Type: integer or string
# Default: unlimited
# Format: integer, or "infinity" for unlimited
# Examples:
#   100      - Limit to 100 tasks total
#   1000     - Limit to 1000 tasks
#   "infinity" - No limit (default)
# Use case: Prevent fork bombs and runaway thread creation
# Note: Each thread counts as one task
# Systemd directive: TasksMax=
# tasks_max = 100

# ============================================================================
# SERVICE TYPE AND TIMEOUTS
# ============================================================================

# Optional: Systemd service type
# Type: string
# Default: "exec"
# Valid values: "simple", "exec", "forking", "oneshot", "dbus", "notify", "idle"
# Purpose: Controls how systemd tracks the service state
#
# Common values:
#   "exec" (default)   - Activates once podman has exec'd the container process.
#                        Correct for all workloads. Does not require a READY
#                        notification, which sidesteps the structural sd_notify
#                        incompatibility described under "notify" below.
#   "notify"           - Waits for READY=1 (--sdnotify=conmon). DO NOT USE: this
#                        is structurally incompatible with the rootless+linger
#                        design and the unit will hang in "activating". systemd
#                        attributes an sd_notify message to the unit owning the
#                        sender's cgroup, but the emitter (conmon, or the re-exec'd
#                        podman under --sdnotify=healthy) always lives in
#                        user@<uid>.service's cgroup, not the workload service's,
#                        so READY=1 is misattributed to the user manager and the
#                        workload unit never sees it. No NotifyAccess tweak fixes
#                        it. For readiness tracking use [container.health] +
#                        `workloadctl health`/`update` instead. (Verified 2026-06-21;
#                        see docs/adr/001-container-cgroup-placement.md.)
#   "simple"           - Consider service started immediately after fork.
#
# Systemd directive: Type=
# service_type = "exec"

# Optional: Service startup timeout
# Type: integer (seconds)
# Default: 300 (5 minutes)
# Purpose: How long to wait for container to start before failing
# Use case: Increase for slow image pulls or complex startup scripts
# Systemd directive: TimeoutStartSec=
# timeout_start_sec = 300

# Optional: Service shutdown timeout
# Type: integer (seconds)
# Default: 30 (30 seconds)
# Purpose: How long to wait for graceful shutdown before force-killing
# Use case: Increase for applications with long shutdown procedures
# Systemd directive: TimeoutStopSec=
# Note: also raises `podman stop -t` (the container's drain grace) to this
#   value minus a 5s margin, so a longer drain actually reaches the container
#   instead of being cut off by podman's default 10s. A systemd timespan
#   (e.g. "2min") keeps podman's grace at the 10s default. (integer seconds)
# timeout_stop_sec = 30

# ============================================================================
# ESCAPE HATCH - Advanced systemd directives
# ============================================================================

# Optional: Custom systemd service directives (ADVANCED)
# Type: table (key-value pairs)
# Default: {}
# Purpose: Override or add any systemd service directive not covered above
# Format: directive_name = "value"
# Examples:
#   LimitNOFILE = "65536"           - Max open file descriptors
#   LimitNPROC = "512"              - Max processes (alternative to tasks_max)
#   OOMScoreAdjust = "-500"         - Make less likely to be OOM killed
#   CPUAffinity = "0-3"             - Pin to CPU cores 0-3
#   Nice = "-5"                     - Process priority (-20 to 19)
#   IOSchedulingClass = "realtime"  - I/O scheduling class
#   IOSchedulingPriority = "0"      - I/O priority (0-7 for realtime/best-effort)
# Warning: These are passed directly to systemd - typos will cause service failures
# Reference: man systemd.exec, man systemd.resource-control
# Use case: Fine-grained control not available via simple options
# custom_directives = { LimitNOFILE = "65536", Nice = "-5" }

# ============================================================================
# USAGE EXAMPLES
# ============================================================================

# Example 1: Gaming workload with AMD GPU
# ----------------------------------------
# [workload]
# name = "gaming"
#
# [container]
# image = "ghcr.io/user/gaming-vm:latest"
#
# [devices]
# gpu = "amd"
# input = true
#
# [security]
# extra_groups = ["video", "render", "input"]
#
# [network]
# mode = "host"
#
# [resources]
# cpu_weight = 500        # High priority for gaming
# memory_max = "8G"
# memory_swap_max = "0"   # Disable swap for low latency

# Example 2: NVIDIA Game Streaming (Sunshine)
# --------------------------------------------
# [workload]
# name = "sunshine"
#
# [container]
# image = "ghcr.io/lizardbyte/sunshine:latest"
#
# [devices]
# gpu = "nvidia"
# input = true
#
# # Alternative for specific GPU selection:
# # devices = ["nvidia.com/gpu=0", "/dev/dri"]
#
# [security]
# extra_groups = ["video", "input"]
#
# [network]
# ports = ["47984:47984", "47989:47989", "48010:48010"]

# Example 3: Simple webserver (no GPU)
# -------------------------------------
# [workload]
# name = "webserver"
#
# [container]
# image = "docker.io/library/nginx:alpine"
#
# [security]
# extra_groups = []
#
# [network]
# ports = ["8080:80"]
#
# [resources]
# cpu_quota = "50%"       # Limit to half a CPU
# memory_max = "512M"     # 512MB hard limit
# memory_high = "384M"    # Start throttling at 384MB
# tasks_max = 50          # Limit worker processes

# Example 4: Development environment with custom volumes
# -------------------------------------------------------
# [workload]
# name = "devenv"
#
# [container]
# image = "localhost/my-devenv:latest"
#
# [security]
# extra_groups = []
#
# [storage]
# volumes = [
#   "/home/user/code:/workspace",
#   "/home/user/.ssh:/home/dev/.ssh:ro"
# ]
#
# [network]
# ports = ["3000:3000", "8000:8000"]

# Example 5: Home Assistant with Zigbee USB stick
# ------------------------------------------------
# [workload]
# name = "homeassistant"
#
# [container]
# image = "ghcr.io/home-assistant/home-assistant:stable"
#
# [devices]
# # Pass through Zigbee USB stick (Conbee II on /dev/ttyACM0)
# devices = ["/dev/ttyACM0"]
#
# [security]
# # dialout group needed for serial device access
# extra_groups = ["dialout"]
#
# [network]
# mode = "host"  # Host networking for mDNS discovery
#
# [storage]
# volumes = ["/etc/localtime:/etc/localtime:ro"]
#
# Note: USB device paths may change on reboot. Consider using udev rules for stable names:
# - Create /etc/udev/rules.d/99-zigbee.rules:
#   SUBSYSTEM=="tty", ATTRS{idVendor}=="0403", ATTRS{idProduct}=="6015", SYMLINK+="zigbee"
# - Then use devices = ["/dev/zigbee"] in the config

# Example 6: Test container for group verification
# -------------------------------------------------
# [workload]
# name = "groups-test"
#
# [container]
# image = "docker.io/library/alpine:latest"
# command = ["sleep", "infinity"]
#
# [security]
# extra_groups = ["video", "render", "input"]
#
# To verify groups work:
#   id _wl-groups-test
#   podman exec workload-groups-test id

# Example 7: Plex with audio transcoding
# ---------------------------------------
# [workload]
# name = "plex"
#
# [container]
# image = "docker.io/plexinc/pms-docker:latest"
#
# [devices]
# gpu = "amd"  # Or "nvidia" for hardware transcoding
# audio = true
#
# [security]
# extra_groups = ["video", "render", "audio"]
#
# [network]
# mode = "host"  # For network discovery

# Example 8: Frigate NVR with camera
# -----------------------------------
# [workload]
# name = "frigate"
#
# [container]
# image = "ghcr.io/blakeblackshear/frigate:stable"
#
# [devices]
# devices = ["/dev/video0", "/dev/video1"]  # USB cameras or capture cards
#
# [security]
# extra_groups = ["video"]
#
# [network]
# ports = ["5000:5000", "8554:8554"]
#
# [storage]
# volumes = ["/mnt/storage/frigate:/media/frigate"]

# Example 9: QEMU with KVM (nested virtualization)
# -------------------------------------------------
# [workload]
# name = "qemu-vm"
#
# [container]
# image = "tianon/qemu:latest"
#
# [devices]
# virtualization = true  # Enable KVM
#
# [security]
# extra_groups = ["kvm"]
#
# [network]
# mode = "host"
#
# [storage]
# volumes = ["/mnt/vms:/vms"]

# Example 10: Application with API secrets
# -----------------------------------------
# [workload]
# name = "webapp"
#
# [container]
# image = "myapp:latest"
#
# [container.environment]
# PUBLIC_URL = "https://app.example.com"
# API_KEY = "${SECRET:webapp-api-key}"          # Auto-detected and loaded
# DB_PASSWORD = "${SECRET:db-password}"         # Auto-detected and loaded
# DEBUG = "false"
#
# # No [secrets] section needed - secrets are auto-detected from ${SECRET:name} references
#
# [network]
# ports = ["8080:8080"]
#
# Setup:
#   echo -n "sk-1234567890abcdef" | sudo systemd-creds encrypt --with-key=tpm2 --name=webapp-api-key - /etc/credstore.encrypted/webapp-api-key
#   echo -n "secure-db-password" | sudo systemd-creds encrypt --with-key=tpm2 --name=db-password - /etc/credstore.encrypted/db-password

# Example 11: Database with TLS certificates
# -------------------------------------------
# [workload]
# name = "postgres"
#
# [container]
# image = "postgres:16"
#
# [container.environment]
# POSTGRES_USER = "dbadmin"
# POSTGRES_PASSWORD = "${SECRET:postgres-password}"  # Auto-detected
# POSTGRES_DB = "myapp"
#
# [secrets]
# # postgres-password is auto-detected from env var
# # tls-cert and tls-key are mounted as files
# files = [
#   { credential = "tls-cert", path = "/var/lib/postgresql/server.crt" },
#   { credential = "tls-key", path = "/var/lib/postgresql/server.key" }
# ]
#
# [network]
# ports = ["5432:5432"]
#
# [resources]
# cpu_quota = "200%"      # 2 CPU cores
# memory_max = "4G"
# memory_high = "3G"
# memory_swap_max = "0"   # No swap for databases
# io_weight = 500         # High I/O priority
# io_read_bandwidth_max = ["/dev/sda 200M"]
# io_write_bandwidth_max = ["/dev/sda 100M"]
#
# Setup:
#   echo -n "secure-password-123" | sudo systemd-creds encrypt --with-key=tpm2 --name=postgres-password - /etc/credstore.encrypted/postgres-password
#   sudo systemd-creds encrypt --with-key=tpm2 /path/to/server.crt /etc/credstore.encrypted/tls-cert
#   sudo systemd-creds encrypt --with-key=tpm2 /path/to/server.key /etc/credstore.encrypted/tls-key

# Example 12: Jellyfin with API key and mixed environment
# --------------------------------------------------------
# [workload]
# name = "jellyfin"
#
# [container]
# image = "jellyfin/jellyfin:latest"
#
# [container.environment]
# JELLYFIN_PublishedServerUrl = "https://jellyfin.example.com"
# JELLYFIN_API_KEY = "${SECRET:jellyfin-api-key}"  # Auto-detected and loaded
# TZ = "America/New_York"
#
# # No [secrets] section needed - secret is auto-detected from ${SECRET:name} reference
#
# [devices]
# gpu = "amd"
# audio = true
#
# [security]
# extra_groups = ["video", "render", "audio"]
#
# [network]
# mode = "host"
#
# [storage]
# volumes = ["/mnt/media:/media:ro"]

# Example 13: Multi-container, pod mode (shared netns, localhost between
#             containers, ports published once on the pod)
# --------------------------------------------------------
# [workload]
# name = "proxy-stack"
# mode = "pod"
#
# # Pod-level: ports are published once, on the pod's infra container.
# [network]
# mode = "pasta"
# ports = ["8080:8080"]
#
# [[containers]]
# name = "proxy"
# [containers.container]
# image = "caddy:latest"
# # Reaches the app container at localhost:3000 (shared netns).
#
# [[containers]]
# name = "app"
# [containers.container]
# image = "myapp:latest"
# [containers.environment]
# LISTEN_ADDR = "127.0.0.1:3000"

# Example 14: Multi-container, bridge mode (per-container netns, DNS by name,
#             ports published per container)
# --------------------------------------------------------
# [workload]
# name = "forgejo-stack"
# mode = "bridge"
#
# [[containers]]
# name = "db"
# [containers.container]
# image = "docker.io/library/postgres:16"
# [containers.environment]
# POSTGRES_USER = "forgejo"
# POSTGRES_DB = "forgejo"
# POSTGRES_PASSWORD = "${SECRET:forgejo-db-password}"
# [containers.storage]
# volumes = ["./db:/var/lib/postgresql/data"]
# # No [containers.network] — db is not published to the host. The web
# # container reaches it at host "db" (the container name) over the bridge.
#
# [[containers]]
# name = "web"
# [containers.container]
# image = "codeberg.org/forgejo/forgejo:15-rootless"
# [containers.environment]
# FORGEJO__database__DB_TYPE = "postgres"
# FORGEJO__database__HOST = "db:5432"
# FORGEJO__database__NAME = "forgejo"
# FORGEJO__database__USER = "forgejo"
# FORGEJO__database__PASSWD = "${SECRET:forgejo-db-password}"
# [containers.storage]
# volumes = ["./gitea:/var/lib/gitea"]
# [containers.network]
# ports = ["3000:3000"]

# ============================================================================
# SECRETS MANAGEMENT
# ============================================================================
#
# The workload system uses systemd credentials for secure secrets management.
# See docs/secrets.md for complete documentation.
#
# Quick Start:
# 1. Create encrypted credential:
#    echo -n "my-secret" | sudo systemd-creds encrypt --with-key=tpm2 --name=my-api-key - /etc/credstore.encrypted/my-api-key
#
# 2. Reference in workload config (auto-detected):
#    [container.environment]
#    API_KEY = "${SECRET:my-api-key}"
#
#    # No [secrets] section needed - secrets are auto-detected!
#
# 3. Enable workload:
#    sudo workloadctl enable myworkload
#
# Security Features:
# - Encrypted at rest with AES256-GCM
# - TPM2-backed encryption (hardware security)
# - Decrypted into RAM-only tmpfs (never touches disk unencrypted)
# - Per-workload isolation (workloads can't see each other's secrets)
# - Automatic cleanup on service stop
#
# Encryption Key Types:
# - tpm2: Hardware-backed, machine-specific (most secure)
# - host: Software key, machine-specific
# - host+tpm2: Both required (maximum security)
#
# Managing Secrets:
# - Create: systemd-creds encrypt --with-key=tpm2 --name=NAME - /etc/credstore.encrypted/NAME
# - Verify: sudo systemd-creds decrypt /etc/credstore.encrypted/NAME -
# - Rotate: Create new credential and restart workload
# - List: ls -la /etc/credstore.encrypted/
#
# Advanced Features:
# - PCR policies: Bind decryption to boot state (Secure Boot, kernel cmdline)
# - Expiration: Time-limited credentials (--not-after="+90days")
# - File mounting: Mount secrets as files in container (certificates, keys)
# - Bootc integration: Encrypted credentials safe to commit to git
#
# For more information:
# - Read docs/secrets.md
# - Run: workloadctl secret --help
# - See: man systemd-creds

# ============================================================================
# TECHNICAL DETAILS
# ============================================================================
#
# User and UID Assignment:
# - Username format: _wl-{name}
# - UID: Auto-assigned from range 10000-52948
# - UID assignment: Finds lowest available UID not in use
# - UID persistence: Managed by systemd-sysusers (stored in /etc/passwd)
# - Username max length: 31 characters (27 for name + 4 for "_wl-" prefix)
# - UID range: 10000-52948 (capped to prevent uint32 overflow in /etc/subuid;
#   stays below systemd DynamicUser range 60000+)
#
# Rootless Architecture:
# - Each workload runs as a dedicated user with rootless podman
# - Podman runs rootless (no root privileges)
# - User namespace isolation (--userns=keep-id by default)
# - Host groups passed to container (--group-add for extra_groups)
# - Linger enabled (systemd user session starts at boot)
# - Subuid/subgid ranges: Auto-configured in /etc/subuid and /etc/subgid
# - --init (catatonit) as PID 1 for zombie reaping (skipped when container.systemd is set)
#
# File Locations:
# - Workload configs: /etc/workloads.d/*/workload.toml
# - Generated sysusers configs: /run/sysusers.d/workload-{name}.conf
# - Generated service files: /run/systemd/system/workload-{name}.service
# - User home directory: /var/lib/workloads/{name}
# - Encrypted credentials: /etc/credstore.encrypted/{credential-name}
# - Runtime credentials: /run/credentials/workload-{name}.service/{credential-name}
#
# Service Management:
# - Service name: workload-{name}.service (system service)
# - Start: sudo systemctl start workload-{name}.service
# - Status: sudo systemctl status workload-{name}.service
# - Logs: sudo journalctl -u workload-{name}.service
# - Container logs: sudo journalctl CONTAINER_NAME=workload-{name}
# - Enable/disable: sudo systemctl enable/disable workload-{name}.service
# - Or use: sudo workloadctl enable/disable/restart/status/logs {name}
#
# Networking:
# - Default: pasta (rootless networking with port forwarding, Podman 5.3+)
# - mode="host": Host network (no isolation, maximum performance)
# - mode="pasta": Isolated networking with port forwarding (recommended)
# - Custom networks: Create with podman network create, reference by name
# - Rootless can't bind ports < 1024 without special sysctl configuration
#
# Container Naming:
# - Container name: workload-{name}
# - Service name: workload-{name}.service
# - Username: _wl-{name}
# - All names are based on workload name only (no ID suffix)
#
# For more information, see:
# - Podman: man podman-run
# - Systemd service: man systemd.service, man systemd.exec, man systemd.resource-control
# - Systemd generators: man systemd.generator
# - Systemd credentials: man systemd-creds
# ============================================================================
