# Pod-mode validation workload.
# Two containers share one network namespace; the client reaches the
# server over localhost. The pod publishes 8080 to the host as well.
#
# Validate (inside the VM, after `workloadctl enable podtest`):
#   workloadctl exec podtest/client wget -qO- localhost:8080      -> POD-OK
#   curl -s localhost:8080                                        -> POD-OK
[workload]
name = "podtest"
enabled = false
mode = "pod"

[network]
mode = "pasta"
ports = ["8080:8080"]

[[containers]]
name = "server"
[containers.container]
image = "docker.io/library/busybox:latest"
command = ["sh", "-c", "echo POD-OK > /tmp/index.html && httpd -f -p 8080 -h /tmp"]

[[containers]]
name = "client"
[containers.container]
image = "docker.io/library/busybox:latest"
command = ["sh", "-c", "while true; do sleep 3600; done"]
