# Bridge-mode validation workload.
# Each container gets its own network namespace, joined to an auto-created
# bridge network. The client resolves the server by its short name.
#
# Validate (inside the VM, after `workloadctl enable bridgetest`):
#   workloadctl exec bridgetest/client wget -qO- http://server:8080  -> BRIDGE-OK
#   curl -s localhost:8081                                              -> BRIDGE-OK
[workload]
name = "bridgetest"
enabled = false
mode = "bridge"

[[containers]]
name = "server"
[containers.container]
image = "docker.io/library/busybox:latest"
command = ["sh", "-c", "echo BRIDGE-OK > /tmp/index.html && httpd -f -p 8080 -h /tmp"]
[containers.network]
ports = ["8081:8080"]

[[containers]]
name = "client"
[containers.container]
image = "docker.io/library/busybox:latest"
command = ["sh", "-c", "while true; do sleep 3600; done"]
