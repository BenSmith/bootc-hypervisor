[pytest]
markers =
    container: tests that exercise the container substrate
    vm: tests that require VM substrate (needs /dev/kvm)
    slow: long-running tests (VM boot, image pull, etc.)
    interactive: pty/shell smoke tests (lower assurance)
    mutating: tests that modify workload state
    destructive: tests that permanently remove state (purge, delete)
    runtime: runtime-rung checks that boot a harness-owned VM (--target=vm:<mode>)
