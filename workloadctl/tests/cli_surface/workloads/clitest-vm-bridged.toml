# clitest-vm-bridged — VM fixture on br0 (real LAN bridge).
# Same image as clitest-vm but attached to the LAN bridge (br0) so VMs
# get routable LAN IPs.
# Gate: has_kvm AND has_br0.

[workload]
name = "clitest-vm-bridged"
enabled = false

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 1
memory = "1024M"
system_disk_size = "10G"
user = "workload"
rollback_keep = 1

[vm.network]
bridge = "br0"
