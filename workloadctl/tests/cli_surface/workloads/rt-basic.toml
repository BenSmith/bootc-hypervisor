# rt-basic — the runtime rung's minimal pasta+health workload (B2).
# caddy is a trivially always-running image; a `true` health command settles to
# "healthy" within one short interval, so `workloadctl health` reaches ok on a
# real kernel. Publishes host 19081 -> container 8080 (host != container on
# purpose): this exercises `cmd_health`'s port_accessibility against the real
# published host port, guarding the container-vs-host-port fix.
# Do NOT enable this manually; it is managed by the runtime harness.

[workload]
name = "rt-basic"
enabled = false

[container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]

[container.health]
cmd = "true"
interval = "5s"
timeout = "5s"
retries = 1

[network]
mode = "pasta"
ports = ["19081:8080"]

[resources]
memory_max = "128M"
memory_high = "96M"
