# rt-caps — runtime rung's per-container resource-cap workload (C1 GAP: caps).
# memory_max / tasks_max map to podman --memory / --pids-limit flags, which crun
# writes onto the container's own cgroup. For a single-container workload these
# live in a TOP-LEVEL [resources] block: normalize_containers reads
# config["resources"], so a nested [container.resources] is silently ignored
# (buried under container["container"]) and the caps never reach podman. This
# workload exists to prove those caps land as real cgroup limit *values* on a live
# kernel. caddy is a trivially always-running image; the health cmd settles fast so
# the harness's readiness wait resolves.
# Do NOT enable this manually; it is managed by the runtime harness.

[workload]
name = "rt-caps"
enabled = false

[container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]

[resources]
memory_max = "128M"    # -> podman --memory=128M   -> cgroup memory.max = 134217728
tasks_max = 100        # -> podman --pids-limit=100 -> cgroup pids.max   = 100

[container.health]
cmd = "true"
interval = "5s"
timeout = "5s"
retries = 1

[network]
mode = "pasta"
ports = ["19085:8080"]
