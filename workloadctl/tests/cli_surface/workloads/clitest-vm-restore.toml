# clitest-vm-restore — VM fixture with a data disk, for the restore round-trip.
# Same base as clitest-vm-fresh plus data_disk_size: backup captures the
# precious data/ subtree only (lib/backup.py — state/, including system.qcow2,
# is deliberately out of scope as reconstructible), so a VM with no data disk
# has nothing for a restore to prove. 1G is the smallest size that still gets a
# real filesystem written into it by the test.
# Gate: has_kvm.

[workload]
name = "clitest-vm-restore"
enabled = false

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 1
memory = "1024M"
system_disk_size = "10G"
data_disk_size = "1G"
user = "workload"
rollback_keep = 1

[vm.network]
# Default: unset — passt (no bridge; the guest takes the host's address)
