# rt-pod — pod-mode runtime fixture: two caddy containers sharing a netns.
# Exercises the pod-mode teardown/re-enable path (test_runtime_pod_reenable): a
# plain (non-purge) disable must not orphan the pod's transient cgroup slice, so
# a same-boot re-enable comes back healthy. Both containers use the always-
# running caddy image on distinct localhost ports (they share the pod netns).
# Do NOT enable this manually; it is managed by the runtime harness.

[workload]
name = "rt-pod"
enabled = false
mode = "pod"

[[containers]]
name = "app"

[containers.container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]

[[containers]]
name = "proxy"

[containers.container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8081"]

[network]
mode = "pasta"
ports = ["19083:8080"]

[resources]
memory_max = "128M"
memory_high = "96M"
