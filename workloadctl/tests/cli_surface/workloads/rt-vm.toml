# rt-vm — the runtime rung's minimal [vm] workload (B6 nested-KVM smoke).
# A single small Fedora Cloud VM on the workloadctl-managed NAT bridge
# (passt). workloadctl's default VM cloud-init enables sshd, creates the
# `workload` user, and injects the per-workload SSH key, so `workloadctl exec`
# (which goes over SSH to the guest) works once cloud-init settles.
#
# Deliberately small: this runs *nested* inside the runtime harness guest, so
# keep vcpus/memory/disk minimal. Pinned image + checksum mirror clitest-vm.toml
# (same cached-download shape). Gate: has_kvm (nested /dev/kvm inside the harness
# guest). Do NOT enable this manually; it is managed by the runtime harness.

[workload]
name = "rt-vm"
enabled = false

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 1
memory = "768M"
system_disk_size = "6G"
user = "workload"
rollback_keep = 1

[vm.network]
# Default: unset — passt (no bridge; the guest takes the host's address)
