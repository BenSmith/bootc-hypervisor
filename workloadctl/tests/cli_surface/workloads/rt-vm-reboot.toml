# rt-vm-reboot — the runtime rung's [vm].restart="on-reboot" proof (O6).
# Identical to rt-vm.toml but with restart = "on-reboot": a guest reboot must
# cycle the VM (relaunch) while a guest poweroff must stay down. That mode arms
# the notify wrapper to watch the QMP SHUTDOWN event and translate guest-reset →
# nonzero exit (Restart=on-failure relaunches) vs guest-shutdown → exit 0 (stays
# down). Nested inside the harness guest, so keep it minimal. Do NOT enable this
# manually; it is managed by the runtime harness.

[workload]
name = "rt-vm-reboot"
enabled = false

[vm]
cloud_image_url = "https://download.fedoraproject.org/pub/fedora/linux/releases/44/Cloud/x86_64/images/Fedora-Cloud-Base-Generic-44-1.7.x86_64.qcow2"
cloud_image_checksum = "sha256:28680fe5b371a5a82ebf43a31926e086a168e59949d03969c5093e7071f90b7f"
vcpus = 1
memory = "768M"
system_disk_size = "6G"
user = "workload"
rollback_keep = 1
restart = "on-reboot"

[vm.network]
# Default: unset — passt (no bridge; the guest takes the host's address)
