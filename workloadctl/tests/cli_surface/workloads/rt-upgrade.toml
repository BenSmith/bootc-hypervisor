# rt-upgrade — a workload that must survive an RPM upgrade underneath it.
# Deliberately a copy of rt-basic rather than a reuse: the upgrade test leaves
# this workload running across a `just rpm-install`, and sharing a fixture with
# the tests that edit rt-basic's config would couple two mutating tests to the
# same live units. Its own host port (19085) for the same reason.
# Do NOT enable this manually; it is managed by the runtime harness.

[workload]
name = "rt-upgrade"
enabled = false

[container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]

[container.health]
cmd = "true"
interval = "5s"
timeout = "5s"
retries = 1

[network]
mode = "pasta"
ports = ["19085:8080"]

[resources]
memory_max = "128M"
memory_high = "96M"
