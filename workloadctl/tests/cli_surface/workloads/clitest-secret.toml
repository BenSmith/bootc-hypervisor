# clitest-secret — single-container fixture that references a secret.
# References ${SECRET:clitest_token} so the EnvironmentFile + secret
# round-trip can be tested. The clitest_token credential must be created
# by the clitest_secret_credential fixture before enabling this workload.

[workload]
name = "clitest-secret"
enabled = false

[container]
image = "docker.io/library/caddy:2-alpine"
command = ["caddy", "file-server", "--root", "/usr/share/caddy", "--listen", ":8080"]

[container.environment]
CLITEST_TOKEN = "${SECRET:clitest_token}"
CLITEST_MARKER = "secret-test-workload"

[network]
mode = "pasta"
ports = ["19084:8080"]

[resources]
memory_max = "128M"
memory_high = "96M"
