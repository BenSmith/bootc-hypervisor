# tmpfiles.d configuration for workload directories
# Ensures base workload directory and runtime env dir exist
# Type  Path                                    Mode UID  GID  Age Argument
d       /var/lib/workloads                      0755 root root -   -
# 0755 on /run/workload-env is LOAD-BEARING — do not "harden" it to 0700.
# Workload units run ExecStart as User=_wl-<name> with
# --env-file /run/workload-env/<container>.secrets, so the unprivileged
# workload user must be able to traverse this directory. 0700 root-owned
# EACCESes there and every secret-using workload fails to start.
# Confidentiality lives on the files, not the directory: workload-write-env
# creates each .secrets with O_CREAT|O_TRUNC mode 0600 before writing, then
# chowns. The tradeoff is that any local user can list *which* workloads have
# secrets; the values stay unreadable.
d       /run/workload-env                       0755 root root -   -
d       /run/workload-exporter                  0755 root root -   -
# The per-request record's root. It is stated HERE rather than left to the
# inspect unit's LogsDirectory= because systemd creates a LogsDirectory's
# PARENTS at 0755 -- it applies LogsDirectoryMode= to the leaf only, so the
# per-workload directories would sit 0700 under a root anyone could list.
#
# 0711, NOT 0700, for exactly the reason /run/workload-env above is 0755: the
# listener runs as User=_wl-<name> and has to TRAVERSE this directory to reach
# its own leaf. A 0700 root-owned parent EACCESes it -- measured on a KVM host
# 2026-08-31, where every per-request write failed
#   [Errno 13] Permission denied: /var/log/workloadctl/egress/<name>/requests.log
# with no AVC and no other symptom, because that write is guaranteed never to
# raise. The record was simply never written and `workloadctl egress` reported
# a workload that had made no requests.
#
# The ACL the decision to keep this record out of the journal rests on is
# unharmed: the search bit alone grants no read, so the directory still cannot
# be LISTED by anyone but root (verified on the same host), and each leaf is
# 0700 owned by its own workload. What 0711 concedes is that a local user who
# already knows a workload's name learns nothing more than that a directory by
# that name exists -- the same trade `/run/workload-env` makes, and a weaker
# disclosure than the one made there.
#
# Nothing here is per-workload: the leaf directories are systemd's to create as
# each inspect service starts.
d       /var/log/workloadctl                    0755 root root -   -
d       /var/log/workloadctl/egress             0711 root root -   -
