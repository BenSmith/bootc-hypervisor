# tmpfiles.d configuration for workload directories
# Ensures base workload directory and runtime env dir exist
# Type  Path                                    Mode UID  GID  Age Argument
d       /var/lib/workloads                      0755 root root -   -
# 0755 on /run/workload-env is LOAD-BEARING — do not "harden" it to 0700.
# Workload units run ExecStart as User=_wl-<name> with
# --env-file /run/workload-env/<container>.secrets, so the unprivileged
# workload user must be able to traverse this directory. 0700 root-owned
# EACCESes there and every secret-using workload fails to start.
# Confidentiality lives on the files, not the directory: workload-write-env
# creates each .secrets with O_CREAT|O_TRUNC mode 0600 before writing, then
# chowns. The tradeoff is that any local user can list *which* workloads have
# secrets; the values stay unreadable.
d       /run/workload-env                       0755 root root -   -
d       /run/workload-exporter                  0755 root root -   -
# The per-request record's root. The 0700 is the ACL the whole decision to keep
# that record out of the journal rests on: root and the workload uid, nobody
# else. It is stated HERE rather than left to the inspect unit's LogsDirectory=
# because systemd creates a LogsDirectory='s PARENTS at 0755 -- it applies
# LogsDirectoryMode= to the leaf only, so the per-workload directories would sit
# 0700 under a root anyone could list and traverse.
#
# Nothing here is per-workload: the leaf directories are systemd's to create as
# each inspect service starts.
d       /var/log/workloadctl                    0755 root root -   -
d       /var/log/workloadctl/egress             0700 root root -   -
