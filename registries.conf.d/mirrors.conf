# Route public-registry pulls through the homelab zot pull-through cache
# (registry.local, the zot-registry workload). Podman tries the mirror first
# and falls through to the real upstream if the mirror can't serve the image,
# so a down cache degrades to a direct pull rather than a failure. The registry
# list mirrors the upstreams zot syncs on-demand
# (workloadctl/workloads/zot-registry/config.json).
#
# SHIPPED ONLY IN IMAGES THAT CARRY THE HOMELAB CA. hypervisor.Containerfile
# installs this file inside the ca-trust-inject block, so it is present on
# internal Forgejo builds and absent from the public ghcr image. Do not add an
# unconditional COPY back; workloadctl/tests/test_registry_mirror.py pins that.
#
# Why the two are tied together: registry.local resolves over mDNS — the image
# enables avahi and puts mdns4_minimal ahead of dns in nsswitch, and .local is
# mDNS's own domain, so unicast DNS is never consulted for it. Any host on the
# link can answer for the name. What makes that safe is TLS verification
# against the homelab CA: an impostor has no cert Caddy's chain would validate.
# Hence no `insecure = true` here — turning it on would disable the only check
# standing between a spoofed mDNS reply and every docker.io / ghcr.io / quay.io
# pull on the host, which policy.json does not catch because those scopes are
# allowlisted-unverified and the policy is keyed on the ref the user wrote, not
# on the host actually contacted.

[[registry]]
location = "docker.io"

[[registry.mirror]]
location = "registry.local"

[[registry]]
location = "ghcr.io"

[[registry.mirror]]
location = "registry.local"

[[registry]]
location = "quay.io"

[[registry.mirror]]
location = "registry.local"

[[registry]]
location = "registry.fedoraproject.org"

[[registry.mirror]]
location = "registry.local"

[[registry]]
location = "codeberg.org"

[[registry.mirror]]
location = "registry.local"
