# Route public-registry pulls through the homelab zot pull-through cache
# (registry.local, the zot-registry workload). Podman tries the mirror first
# and falls through to the real upstream if the mirror can't serve the image,
# so a down cache degrades to a direct pull rather than a failure. Shipped in
# the image so every host — including a fresh install — gets the cache without
# per-host /etc setup. The registry list mirrors the upstreams zot syncs
# on-demand (workloadctl/workloads/zot-registry/config.json).

[[registry]]
location = "docker.io"

[[registry.mirror]]
location = "registry.local"
insecure = true

[[registry]]
location = "ghcr.io"

[[registry.mirror]]
location = "registry.local"
insecure = true

[[registry]]
location = "quay.io"

[[registry.mirror]]
location = "registry.local"
insecure = true

[[registry]]
location = "registry.fedoraproject.org"

[[registry.mirror]]
location = "registry.local"
insecure = true

[[registry]]
location = "codeberg.org"

[[registry.mirror]]
location = "registry.local"
insecure = true
