# Weekly runtime rung (B1) for workloadctl on the Forgejo runner: boots a
# harness-owned VM and runs the `runtime`-marked checks (`just test-runtime`
# -> pytest -m runtime). Runs BOTH fidelities, back to back in one job:
#   - dev  (WLRT_MODE=dev):  cached Fedora Cloud image + RPM built in-guest.
#   - gate (WLRT_MODE=gate): the REAL bootc image (registry.local/
#                            hypervisor-bootc:latest) turned into a bootable
#                            qcow2 by bootc-image-builder, booted with a
#                            swtpm-backed vTPM (B1b) — the shipped artifact
#                            under nested KVM.
# Mirror of .github/workflows/workloadctl-runtime.yml, but the gate rung is
# Forgejo-only: it needs registry.local (homelab-internal) and privileged BIB,
# neither of which a GitHub-hosted runner can reach. This is a CADENCE gate,
# not a PR gate: schedule + manual dispatch only.
#
# The two fidelities are sequential steps of a single job, not a `strategy.matrix`:
# Forgejo expands a matrix into independent jobs and dispatches them all at once
# (it has no `max-parallel`; `needs` is its only ordering primitive). Concurrent
# entries would contend for /dev/kvm and — because a workspace path is derived
# from repo + workflow + SHA, with no matrix key in it — check out into the SAME
# tree and reset it under one another. One job keeps the two rungs serialized on
# a runner whose capacity is shared with the image builds. The gate step runs
# even when dev fails: the fidelities are independent signals.
#
# No server-URL gate is needed here: GitHub never reads .forgejo/workflows/,
# so this file can only ever run on the Forgejo runner. (The .github/ twin
# carries a gate because Forgejo *does* fall back to reading .github/workflows.)
#
# The native runner lives inside the virtual-forgejo VM, which exposes nested
# KVM (workloadctl launches it with `-cpu host`; verified live 2026-07-10) and
# whose cloud-init bakes the gate toolchain (qemu-kvm, swtpm, edk2-ovmf). The
# /dev/kvm probe below is a capability check, not a host list: any runner
# without KVM records a warning and exits green rather than failing. gate mode
# additionally self-skips green when swtpm is absent (tests/runtime/vmlaunch.py).
#
# gate builds the qcow2 from registry.local/hypervisor-bootc:latest, pulled
# FRESH into root's podman store each run — so it tests whatever the last image
# build published. The cron is offset to run AFTER the weekly image build so it
# exercises the current artifact; a manual dispatch tests whatever is on the
# registry now.
#
# No secrets are used. See workloadctl/docs/wip/test-suite-remaining.md (D1)
# and the project review's B1b notes for the design.
name: workloadctl runtime

on:
  workflow_dispatch:
  schedule:
    # Weekly, Tuesday 03:00 UTC — offset from the GitHub-hosted runtime rung
    # (Monday) and the Sat/Sun image builds, so failures are attributable and
    # the gate image is freshly built.
    - cron: '0 3 * * 2'

jobs:
  runtime:
    runs-on: native
    # Both rungs, back to back: dev is ~10min, gate ~12min plus a BIB build on a
    # cold cache.
    timeout-minutes: 150
    env:
      # Per-runner persistent cache, as an absolute path: the runner daemon runs
      # with no HOME in its environment, so "$HOME/wlrt-cache" resolved to the
      # filesystem root.
      WLRT_CACHE: /var/cache/wlrt
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for /dev/kvm
        id: kvm
        run: |
          if [ -e /dev/kvm ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "KVM present:"; ls -l /dev/kvm
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::/dev/kvm absent on this runner; skipping runtime rung."
          fi

      - name: Install runtime dependencies
        if: steps.kvm.outputs.available == 'true'
        run: |
          # Probe-then-install, matching workloadctl.yml. Host-side binaries the
          # harness needs (vmlaunch.py _DEV_BINARIES + rsync/pytest), plus swtpm
          # for gate mode (B1b — the emulated vTPM the bootc image boots with):
          #   qemu-system-x86_64  <- qemu-system-x86-core
          #   qemu-img            <- qemu-img
          #   cloud-localds       <- cloud-utils
          #   ssh-keygen          <- openssh (always present)
          #   swtpm               <- swtpm  (gate only; harmless for dev)
          declare -A need=(
            [qemu-system-x86_64]=qemu-system-x86-core
            [qemu-img]=qemu-img
            [cloud-localds]=cloud-utils
            [rsync]=rsync
            [pytest]=python3-pytest
            [just]=just
            [swtpm]=swtpm
          )
          missing=()
          for bin in "${!need[@]}"; do
            command -v "$bin" >/dev/null || missing+=("${need[$bin]}")
          done
          # OVMF has no binary to probe. gate boots UEFI-only, so it is required
          # there; dev falls back to SeaBIOS without it, but UEFI matches the
          # VM-workload launch path.
          rpm -q edk2-ovmf >/dev/null || missing+=(edk2-ovmf)
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo dnf install -y "${missing[@]}"
          fi
          just --version

      - name: Persistent image cache
        if: steps.kvm.outputs.available == 'true'
        run: |
          # The launcher caches the Fedora Cloud qcow2 (dev) and the built gate
          # qcow2 + stable gate ssh key (gate) under tests/runtime/.cache/. Point
          # that at a per-runner persistent dir (the tp-host wlrt-cache pattern)
          # so runs don't re-download ~500MB or re-run BIB on a fresh workspace.
          mkdir -p "$WLRT_CACHE"
          rm -rf workloadctl/tests/runtime/.cache
          ln -s "$WLRT_CACHE" workloadctl/tests/runtime/.cache

      - name: Reap stale harness VMs
        if: steps.kvm.outputs.available == 'true'
        working-directory: workloadctl
        run: |
          # This runner is long-lived, so a cancelled run's QEMU survives it —
          # still running, still holding its scratch dir. Left alone they pile up
          # and starve the gate's bootc-image-builder build of disk. Sweep first;
          # a no-op when nothing is stale.
          just reap-stale-runs
          df -h /var/tmp

      - name: Runtime rung (dev)
        if: steps.kvm.outputs.available == 'true'
        working-directory: workloadctl
        env:
          WLRT_MODE: dev
        run: just test-runtime

      - name: Runtime rung (gate)
        # !cancelled(), not success(): a dev failure must not hide the gate's
        # verdict on the shipped image.
        if: ${{ !cancelled() && steps.kvm.outputs.available == 'true' }}
        working-directory: workloadctl
        env:
          WLRT_MODE: gate
        run: just test-runtime
