name: Build Hypervisor Bootc Images

on:
  workflow_run:
    workflows: ["Build Fedora Minimal Bootc"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      variants:
        description: 'Variants to build (besides base)'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'none'
          - 'amd'
          - 'nvidia'
          - 'nvidia-negativo17'
#          - 'nvidia-rpmfusion'
      versions_override:
        description: 'JSON array of Fedora versions to build, e.g. [44] (empty = use fedora-versions.yml)'
        required: false
        default: ''
        type: string

concurrency:
  group: build-hypervisor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: native
    # Skip if the upstream minimal build failed; allow all other triggers.
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    outputs:
      versions: ${{ steps.r.outputs.versions }}
      stable: ${{ steps.r.outputs.stable }}
      rechunker: ${{ steps.r.outputs.rechunker }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          command -v yq >/dev/null || sudo dnf install -y yq
          if [ -n "${{ inputs.versions_override }}" ]; then
            echo "versions=${{ inputs.versions_override }}"
          else
            echo "versions=$(yq -o=json -I=0 '.supported' fedora-versions.yml)"
          fi >> "$GITHUB_OUTPUT"
          {
            echo "stable=$(yq '.stable' fedora-versions.yml)"
            echo "rechunker=$(yq '.rechunker' fedora-versions.yml)"
          } >> "$GITHUB_OUTPUT"

  # One reusable-workflow call per Fedora version. Each call runs its own
  # base + variant jobs, so F44's variants only need F44's base
  build:
    needs: setup
    # Do NOT add `runs-on:` to this job. It's a reusable-workflow call (`uses:`),
    # and Forgejo's server-side expander (expandForJob) silently SKIPS any `uses:`
    # job that carries a runs-on label — the whole matrix is marked skipped and
    # nothing builds. The expansion runs base+variant server-side without it.
    # Trade-off: server-side expansion evaluates the `with:` expressions without
    # the dispatch inputs context, so a manual workflow_dispatch variant selection
    # (none / single variant) is ignored and all variants build. The scheduled and
    # workflow_run paths want all variants anyway, so that's acceptable.
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ${{ fromJson(needs.setup.outputs.versions) }}
    uses: ./.forgejo/workflows/build-hypervisor-version.yml
    with:
      fedora_version: ${{ matrix.fedora_version }}
      stable: ${{ needs.setup.outputs.stable }}
      rechunker: ${{ needs.setup.outputs.rechunker }}
      variants: ${{ inputs.variants || 'all' }}
      event_name: ${{ github.event_name }}
    secrets: inherit
