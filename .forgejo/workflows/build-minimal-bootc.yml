name: Build Fedora Minimal Bootc

on:
  workflow_dispatch:
    inputs:
      versions_override:
        description: 'JSON array of Fedora versions to build, e.g. [44] (empty = use fedora-versions.yml)'
        required: false
        default: ''
        type: string
      manifests_repo:
        description: 'Git URL of the fedora-bootc-base-images repo to clone'
        required: false
        default: 'https://git.local/ben/fedora-bootc-base-images.git'
        type: string

  # Run manually via workflow_dispatch for now.

concurrency:
  group: build-minimal-bootc-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: fedora-bootc-minimal
  # HTTPS registry fronted by Caddy (zot backend on :5050).
  # Caddy's internal CA is trusted on the runner VM via cloud-init.
  REGISTRY: registry.local
  MANIFESTS_REPO: ${{ inputs.manifests_repo || 'https://git.local/ben/fedora-bootc-base-images.git' }}

jobs:
  setup:
    runs-on: native
    outputs:
      versions: ${{ steps.r.outputs.versions }}
      stable: ${{ steps.r.outputs.stable }}
      rechunker: ${{ steps.r.outputs.rechunker }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          command -v yq >/dev/null || sudo dnf install -y yq
          if [ -n "${{ inputs.versions_override }}" ]; then
            echo "versions=${{ inputs.versions_override }}"
          else
            echo "versions=$(yq -o=json -I=0 '.supported' fedora-versions.yml)"
          fi >> "$GITHUB_OUTPUT"
          {
            echo "stable=$(yq '.stable' fedora-versions.yml)"
            echo "rechunker=$(yq '.rechunker' fedora-versions.yml)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: native
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ${{ fromJson(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          {
            echo "tag=${TAG}"
            echo "image_base=${REGISTRY}/${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Render policy.json
        env:
          # Hardcoded: the ghcr.io sigstore scope must name the canonical
          # publish namespace (ghcr.io/bensmith, where the GitHub pipeline signs
          # and pushes). On the Forgejo mirror github.repository_owner is the
          # Forgejo user (ben), not the ghcr owner, so deriving it here scopes
          # the rule to a namespace that holds nothing. registry.local trust
          # comes from the template.
          OWNER: bensmith
        run: |
          sed -e "s|__REGISTRY_NAMESPACE__|${OWNER}|g" \
              policy-minimal.json.template > policy.json
          cat policy.json

      - name: Clone Fedora bootc manifests
        run: |
          rm -rf manifests
          git clone --depth 1 "${MANIFESTS_REPO}" manifests
          git -C manifests log -1
          cp policy.json manifests/policy.json
          cp cosign.pub manifests/cosign.pub

      - name: Build minimal bootc image
        env:
          VERSION: ${{ matrix.fedora_version }}
        run: |
          sudo podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            -f fedora-bootc-minimal.Containerfile \
            --build-arg MANIFEST=minimal \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILDER_IMAGE=quay.io/fedora/fedora:${VERSION} \
            --build-arg REPOS_IMAGE=quay.io/fedora/fedora:${VERSION} \
            -t "localhost/${IMAGE_NAME}:build-${VERSION}" \
            manifests
          sudo podman inspect "localhost/${IMAGE_NAME}:build-${VERSION}" > /dev/null

      - name: Rechunk image
        env:
          VERSION: ${{ matrix.fedora_version }}
          RECHUNKER: ${{ needs.setup.outputs.rechunker }}
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:${RECHUNKER} \
            /usr/libexec/bootc-base-imagectl rechunk \
            "localhost/${IMAGE_NAME}:build-${VERSION}" \
            "localhost/${IMAGE_NAME}:rechunked-${VERSION}"

      - name: Tag and push
        id: push
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          VERSION: ${{ matrix.fedora_version }}
          TAG: ${{ steps.params.outputs.tag }}
          STABLE: ${{ needs.setup.outputs.stable }}
        run: |
          TAGS=("${VERSION}-${TAG}" "${VERSION}")
          if [ "${VERSION}" = "${STABLE}" ]; then
            TAGS+=("latest")
          fi

          # Sign at push via containers/image (no cosign in CI; its *.local
          # scheme race broke signing — docs/cosign-local-redirect-loop.md).
          # The signature is a cosign-compatible sigstore attachment, verified
          # by both `sigstoreSigned` policy and `cosign verify`. Key and
          # passphrase are host-key-sealed systemd credentials decrypted into
          # the runner service's tmpfs (sealed once by the seal-signing-key
          # workflow — docs/ci-image-signing.md); no Forgejo secrets involved.
          # Missing credentials → the job fails; nothing unsigned reaches
          # the registry. Only the first push signs: the signature is
          # digest-addressed (sha256-<digest>.sig in the same repo), so
          # further tags of the same image are already covered.
          CREDS=/run/credentials/forgejo-runner.service
          if ! sudo test -s "${CREDS}/cosign-key"; then
            echo "::error::no signing credential at ${CREDS}/cosign-key — refusing to push unsigned. Run the seal-signing-key workflow, then re-run this build."
            exit 1
          fi
          SIGN_ARGS=(--sign-by-sigstore-private-key "${CREDS}/cosign-key"
                     --sign-passphrase-file "${CREDS}/cosign-pass")

          FIRST=true
          for t in "${TAGS[@]}"; do
            sudo podman tag "localhost/${IMAGE_NAME}:rechunked-${VERSION}" "${IMAGE_BASE}:${t}"
            if [ "${FIRST}" = "true" ]; then
              sudo podman push "${SIGN_ARGS[@]}" --digestfile /tmp/digest.txt "${IMAGE_BASE}:${t}"
              FIRST=false
            else
              sudo podman push "${IMAGE_BASE}:${t}"
            fi
          done

          DIGEST=$(cat /tmp/digest.txt)
          {
            printf 'tags<<EOF\n%s\nEOF\n' "${TAGS[*]}"
            echo "versioned_tag=${VERSION}-${TAG}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          TAGS: ${{ steps.push.outputs.tags }}
        run: |
          {
            echo "## Minimal bootc build complete (F${{ matrix.fedora_version }})"
            echo ""
            echo "Pushed and signed:"
            for t in $TAGS; do
              echo "- \`${IMAGE_BASE}:${t}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local tags
        # Drop intermediates and the dated registry tag. Keep the floating
        # :<N> (and :latest, if stable) tags — build-hypervisor's FROM uses
        # them to resolve from local cache without a re-pull from zot.
        if: always()
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          VERSION: ${{ matrix.fedora_version }}
          VERSIONED_TAG: ${{ steps.push.outputs.versioned_tag }}
        run: |
          sudo podman untag "localhost/${IMAGE_NAME}:build-${VERSION}" 2>/dev/null || true
          sudo podman untag "localhost/${IMAGE_NAME}:rechunked-${VERSION}" 2>/dev/null || true
          if [ -n "${VERSIONED_TAG:-}" ]; then
            sudo podman untag "${IMAGE_BASE}:${VERSIONED_TAG}" 2>/dev/null || true
          fi
          # Reclaim the layers we just untagged (and any other dangling ones)
          # on this long-lived native runner. Dangling-only: never removes a
          # tagged image, so the floating :<N>/:latest base stays cached for
          # build-hypervisor's FROM, and the Containerfile's type=cache build
          # cache (bootc-base-image-cache) is preserved.
          df -h /
          sudo podman image prune -f || true
          df -h /
