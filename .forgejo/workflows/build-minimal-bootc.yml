name: Build Fedora Minimal Bootc

on:
  workflow_dispatch:
    inputs:
      versions_override:
        description: 'JSON array of Fedora versions to build, e.g. [44] (empty = use fedora-versions.yml)'
        required: false
        default: ''
        type: string
      manifests_repo:
        description: 'Git URL of the fedora-bootc-base-images repo to clone'
        required: false
        default: 'https://git.local/ben/fedora-bootc-base-images.git'
        type: string

  # Run manually via workflow_dispatch for now.

concurrency:
  group: build-minimal-bootc-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: fedora-bootc-minimal
  # HTTPS registry fronted by Caddy (zot backend on :5050).
  # Caddy's internal CA is trusted on the runner VM via cloud-init.
  REGISTRY: registry.local
  MANIFESTS_REPO: ${{ inputs.manifests_repo || 'https://git.local/ben/fedora-bootc-base-images.git' }}

jobs:
  setup:
    runs-on: native
    outputs:
      versions: ${{ steps.r.outputs.versions }}
      stable: ${{ steps.r.outputs.stable }}
      rechunker: ${{ steps.r.outputs.rechunker }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        run: |
          command -v yq >/dev/null || sudo dnf install -y yq
          if [ -n "${{ inputs.versions_override }}" ]; then
            echo "versions=${{ inputs.versions_override }}"
          else
            echo "versions=$(yq -o=json -I=0 '.supported' fedora-versions.yml)"
          fi >> "$GITHUB_OUTPUT"
          {
            echo "stable=$(yq '.stable' fedora-versions.yml)"
            echo "rechunker=$(yq '.rechunker' fedora-versions.yml)"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    runs-on: native
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fedora_version: ${{ fromJson(needs.setup.outputs.versions) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve build parameters
        id: params
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          {
            echo "tag=${TAG}"
            echo "image_base=${REGISTRY}/${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify cosign (provisioned on runner)
        # cosign is installed once on the runner during VM bootstrap
        # (vms/virtual-forgejo/cloud-init/user-data, step 8b), pinned to v2:
        # v2 emits the legacy ".sig" simple-signing format that containers-policy
        # `sigstoreSigned` (bootc/podman pull verification) reads; v3's default
        # bundle format is NOT verified by sigstoreSigned. We assert the pinned
        # version here instead of downloading, so a GitHub outage can't fail the
        # build; if it's absent/wrong, signing (already best-effort) is skipped.
        env:
          COSIGN_VERSION: v2.4.3
        run: |
          WANT="${COSIGN_VERSION#v}"
          # cosign reports `GitVersion:    v2.4.3` — note the leading `v`. Match
          # that line allowing the optional v, with dots taken literally. The
          # earlier `[[:space:]]*${WANT}` (v stripped) never matched the v-prefixed
          # output, so signing was silently skipped on every build.
          if cosign version 2>/dev/null | grep -qE "GitVersion:[[:space:]]+v?${WANT//./\\.}\b"; then
            echo "Pinned cosign ${WANT} present on runner."
            cosign version
          else
            echo "::warning::Pinned cosign ${WANT} not found on runner — image signing will be skipped. Reinstall via the VM bootstrap (user-data step 8b)."
          fi

      - name: Render policy.json
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          # Scope the ghcr.io rule to this repo's owner (matches the GitHub
          # pipeline's ${OWNER}) rather than hardcoding a namespace, so forks
          # trust their own subtree. registry.local trust comes from the template.
          sed -e "s|__REGISTRY_NAMESPACE__|${OWNER}|g" \
              policy-minimal.json.template > policy.json
          cat policy.json

      - name: Clone Fedora bootc manifests
        run: |
          rm -rf manifests
          git clone --depth 1 "${MANIFESTS_REPO}" manifests
          git -C manifests log -1
          cp policy.json manifests/policy.json
          cp cosign.pub manifests/cosign.pub

      - name: Build minimal bootc image
        env:
          VERSION: ${{ matrix.fedora_version }}
        run: |
          sudo podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            -f fedora-bootc-minimal.Containerfile \
            --build-arg MANIFEST=minimal \
            --build-arg VERSION=${VERSION} \
            --build-arg BUILDER_IMAGE=quay.io/fedora/fedora:${VERSION} \
            --build-arg REPOS_IMAGE=quay.io/fedora/fedora:${VERSION} \
            -t "localhost/${IMAGE_NAME}:build-${VERSION}" \
            manifests
          sudo podman inspect "localhost/${IMAGE_NAME}:build-${VERSION}" > /dev/null

      - name: Rechunk image
        env:
          VERSION: ${{ matrix.fedora_version }}
          RECHUNKER: ${{ needs.setup.outputs.rechunker }}
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:${RECHUNKER} \
            /usr/libexec/bootc-base-imagectl rechunk \
            "localhost/${IMAGE_NAME}:build-${VERSION}" \
            "localhost/${IMAGE_NAME}:rechunked-${VERSION}"

      - name: Tag and push
        id: push
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          VERSION: ${{ matrix.fedora_version }}
          TAG: ${{ steps.params.outputs.tag }}
          STABLE: ${{ needs.setup.outputs.stable }}
        run: |
          TAGS=("${VERSION}-${TAG}" "${VERSION}")
          if [ "${VERSION}" = "${STABLE}" ]; then
            TAGS+=("latest")
          fi

          FIRST=true
          for t in "${TAGS[@]}"; do
            sudo podman tag "localhost/${IMAGE_NAME}:rechunked-${VERSION}" "${IMAGE_BASE}:${t}"
            if [ "${FIRST}" = "true" ]; then
              sudo podman push --digestfile /tmp/digest.txt "${IMAGE_BASE}:${t}"
              FIRST=false
            else
              sudo podman push "${IMAGE_BASE}:${t}"
            fi
          done

          DIGEST=$(cat /tmp/digest.txt)
          {
            printf 'tags<<EOF\n%s\nEOF\n' "${TAGS[*]}"
            echo "versioned_tag=${VERSION}-${TAG}"
            echo "digest=${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign images
        # Best-effort: sign if a key is configured and cosign succeeds,
        # but never fail the build over signing.
        continue-on-error: true
        timeout-minutes: 2
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SECRET }}
          # cosign keys are always encrypted; CI must supply the password
          # non-interactively. Empty (unset secret) is correct for a key
          # generated without a password.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "COSIGN_SECRET not set — skipping image signing."
            exit 0
          fi
          # Local key-based signature only: --tlog-upload=false keeps image
          # digests out of the public Sigstore transparency log (Rekor). These
          # are private homelab images served from registry.local and are never
          # distributed; the verification policy (policy*.json) checks the
          # key-based signature via keyPath and needs no transparency-log entry.
          # If this fails with "stopped after 10 redirects", see
          # docs/cosign-local-redirect-loop.md (cosign *.local scheme race vs
          # Caddy's 80->443 redirect on the registry host).
          cosign sign -y \
            --key env://COSIGN_PRIVATE_KEY \
            --tlog-upload=false \
            "${IMAGE_BASE}@${DIGEST}"

      - name: Summary
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          TAGS: ${{ steps.push.outputs.tags }}
        run: |
          {
            echo "## Minimal bootc build complete (F${{ matrix.fedora_version }})"
            echo ""
            echo "Pushed and signed:"
            for t in $TAGS; do
              echo "- \`${IMAGE_BASE}:${t}\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup local tags
        # Drop intermediates and the dated registry tag. Keep the floating
        # :<N> (and :latest, if stable) tags — build-hypervisor's FROM uses
        # them to resolve from local cache without a re-pull from zot.
        if: always()
        env:
          IMAGE_BASE: ${{ steps.params.outputs.image_base }}
          VERSION: ${{ matrix.fedora_version }}
          VERSIONED_TAG: ${{ steps.push.outputs.versioned_tag }}
        run: |
          sudo podman untag "localhost/${IMAGE_NAME}:build-${VERSION}" 2>/dev/null || true
          sudo podman untag "localhost/${IMAGE_NAME}:rechunked-${VERSION}" 2>/dev/null || true
          if [ -n "${VERSIONED_TAG:-}" ]; then
            sudo podman untag "${IMAGE_BASE}:${VERSIONED_TAG}" 2>/dev/null || true
          fi
          # Reclaim the layers we just untagged (and any other dangling ones)
          # on this long-lived native runner. Dangling-only: never removes a
          # tagged image, so the floating :<N>/:latest base stays cached for
          # build-hypervisor's FROM, and the Containerfile's type=cache build
          # cache (bootc-base-image-cache) is preserved.
          df -h /
          sudo podman image prune -f || true
          df -h /
