# Operator-triggered, re-runnable: seal the image-signing key from Forgejo's
# secret store into host-key-bound systemd credentials on the CI runner VM.
# Build workflows then sign at push time (podman push
# --sign-by-sigstore-private-key) by reading the runner service's credential
# tmpfs — no Forgejo secrets in the build path at all.
#
# After a successful run (and the delayed runner restart), verify signing
# with the next build, then DELETE COSIGN_SECRET and COSIGN_PASSWORD from
# the Forgejo repo secrets. Re-run this workflow (re-adding the secrets
# first) only when the runner VM is re-provisioned — the credentials are
# sealed to the VM's /var/lib/systemd/credential.secret host key and don't
# survive a rebuild. See docs/ci-image-signing.md.
#
# Re-running is safe: the previous blobs are copied to
# /etc/forgejo-runner/creds/backup-<UTC timestamp>/ first, the new ones are
# written to .new and must survive a decrypt round-trip before they replace
# anything, and nothing is touched if that fails.
name: seal-signing-key

on:
  workflow_dispatch: {}

jobs:
  seal:
    runs-on: native
    steps:
      - name: Seal signing key as systemd credentials
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_SECRET }}
          # The key's passphrase. Empty (unset secret) is correct for a key
          # generated without a password — an empty passphrase credential is
          # still written so the build-side flags stay unconditional.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY:-}" ]; then
            echo "COSIGN_SECRET is not set in Forgejo secrets — nothing to seal."
            exit 1
          fi
          CREDS=/etc/forgejo-runner/creds
          sudo install -d -m 0700 "${CREDS}"

          # Back up whatever is sealed now BEFORE overwriting it. These blobs
          # are bound to this VM's host key and cannot be regenerated from
          # anywhere else, and the documented flow deletes COSIGN_SECRET from
          # Forgejo after the first successful seal — so a re-run with a
          # mangled or truncated secret would otherwise destroy the only live
          # copy of the signing key with no way back. Backups are kept, not
          # rotated: they are a few hundred bytes each and the workflow is
          # hand-triggered.
          if sudo test -e "${CREDS}/cosign-key.cred"; then
            BACKUP="${CREDS}/backup-$(date -u +%Y%m%dT%H%M%SZ)"
            sudo install -d -m 0700 "${BACKUP}"
            # The copy runs inside a root shell so the glob is expanded by
            # root: ${CREDS} is 0700 root-owned, and this job's shell is not
            # root, so expanding *.cred out here yields the literal pattern
            # and cp fails.
            sudo sh -c 'cp -a "$1"/*.cred "$2"/' _ "${CREDS}" "${BACKUP}"
            echo "Backed up existing sealed credentials to ${BACKUP}"
          else
            echo "No existing sealed credentials; nothing to back up."
          fi

          # Seal to .new first, so a failure anywhere below leaves the live
          # credentials untouched.
          trap 'sudo sh -c '"'"'rm -f "$1"/*.cred.new'"'"' _ "${CREDS}"' EXIT
          printf '%s' "${COSIGN_PRIVATE_KEY}" | sudo systemd-creds encrypt \
            --with-key=host --name=cosign-key - "${CREDS}/cosign-key.cred.new"
          printf '%s' "${COSIGN_PASSWORD:-}" | sudo systemd-creds encrypt \
            --with-key=host --name=cosign-pass - "${CREDS}/cosign-pass.cred.new"

          # Round-trip each blob before trusting it. systemd-creds encrypt
          # succeeding proves only that it wrote a file; this proves the
          # runner will get the same bytes back out. Compared by digest so
          # neither the key nor the passphrase can reach the job log.
          verify() {
            local name="$1" file="$2" want got
            want=$(printf '%s' "$3" | sha256sum | cut -d' ' -f1)
            got=$(sudo systemd-creds decrypt --name="${name}" "${file}" - \
                  | sha256sum | cut -d' ' -f1)
            if [ "${want}" != "${got}" ]; then
              echo "FATAL: ${name} does not survive a decrypt round-trip." >&2
              echo "Live credentials left untouched; nothing was changed." >&2
              return 1
            fi
            echo "Verified round-trip: ${name}"
          }
          verify cosign-key  "${CREDS}/cosign-key.cred.new"  "${COSIGN_PRIVATE_KEY}"
          verify cosign-pass "${CREDS}/cosign-pass.cred.new" "${COSIGN_PASSWORD:-}"

          sudo mv "${CREDS}/cosign-key.cred.new"  "${CREDS}/cosign-key.cred"
          sudo mv "${CREDS}/cosign-pass.cred.new" "${CREDS}/cosign-pass.cred"
          trap - EXIT

          sudo install -d /etc/systemd/system/forgejo-runner.service.d
          {
            echo "# Decrypt the sealed signing key/passphrase into the service's"
            echo "# credential tmpfs (/run/credentials/forgejo-runner.service/) at"
            echo "# start. Build jobs run as root children of the runner and read"
            echo "# them via podman push --sign-by-sigstore-private-key. Installed"
            echo "# by the seal-signing-key workflow; see docs/ci-image-signing.md."
            echo "[Service]"
            echo "LoadCredentialEncrypted=cosign-key:/etc/forgejo-runner/creds/cosign-key.cred"
            echo "LoadCredentialEncrypted=cosign-pass:/etc/forgejo-runner/creds/cosign-pass.cred"
          } | sudo tee /etc/systemd/system/forgejo-runner.service.d/50-signing-creds.conf > /dev/null
          sudo systemctl daemon-reload

          # Restart the runner AFTER this job has reported success — an
          # immediate restart would kill this very job. The restart aborts
          # any concurrently running jobs, so run this workflow while the
          # runner is otherwise idle.
          sudo systemd-run --on-active=30 --collect systemctl restart forgejo-runner.service
          echo "Sealed. Runner restarts in ~30s. Verify signing on the next" \
               "build, then delete COSIGN_SECRET/COSIGN_PASSWORD from Forgejo."
