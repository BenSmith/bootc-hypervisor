name: workloadctl

on:
  workflow_dispatch:
  push:
    branches: [internal]
    paths: ['workloadctl/**']

jobs:
  test:
    runs-on: native
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure build tooling
        run: |
          for pkg in just rpm-build python3; do
            bin=${pkg/rpm-build/rpmbuild}
            command -v "$bin" >/dev/null || sudo dnf install -y "$pkg"
          done
          # Macro packages provide no binary to probe; install unconditionally.
          # Required by the spec's BuildRequires (%{_unitdir}, %{python3_sitelib}).
          sudo dnf install -y systemd-rpm-macros python3-rpm-macros
          python3 --version
          just --version

      # The unit suite runs as a non-root user, exactly as it does on the gate
      # host (tp). Run as root on this runner, the suite writes real
      # /var/lib/workloads/<name> trees that the selinux_labels checks then
      # read as mislabeled (var_lib_t). As a normal user it cannot create them,
      # and the checks read "unknown" and pass. `fedora` is the VM's [vm].user,
      # created by the seed; the workspace is chowned to it first so the suite
      # can write where it runs.
      - name: Make the workspace writable by the test user
        run: chown -R fedora:fedora "$GITHUB_WORKSPACE"

      - name: Lint (py_compile)
        working-directory: workloadctl
        run: runuser -u fedora -- just lint

      - name: Unit tests
        working-directory: workloadctl
        run: runuser -u fedora -- just test

      - name: Build RPM
        working-directory: workloadctl
        run: |
          # This runs on a persistent `native` runner, so the workspace can carry
          # untracked files between runs and `just rpm-build` only ever adds to
          # rpmbuild/. Left alone, the artifact glob below matches every RPM
          # the runner has ever built — an old package attached to a green run.
          rm -rf rpmbuild
          just rpm-build

      - name: Upload RPM artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: workloadctl-rpm
          path: workloadctl/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

