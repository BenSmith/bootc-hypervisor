name: workloadctl

on:
  workflow_dispatch:
  push:
    branches: [internal]
    paths: ['workloadctl/**']

jobs:
  test:
    runs-on: native
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure build tooling
        run: |
          for pkg in just rpm-build python3; do
            bin=${pkg/rpm-build/rpmbuild}
            command -v "$bin" >/dev/null || sudo dnf install -y "$pkg"
          done
          # Macro packages provide no binary to probe; install unconditionally.
          # Required by the spec's BuildRequires (%{_unitdir}, %{python3_sitelib}).
          sudo dnf install -y systemd-rpm-macros python3-rpm-macros
          python3 --version
          just --version

      - name: Lint (py_compile)
        working-directory: workloadctl
        run: just lint

      - name: Unit tests
        working-directory: workloadctl
        run: just test

      - name: Build RPM
        working-directory: workloadctl
        run: |
          # This runs on a persistent `native` runner, so the workspace can carry
          # untracked files between runs and `just rpm-build` only ever adds to
          # rpmbuild/. Left alone, the timestamped glob below matches every RPM
          # the runner has ever built and publish picks one arbitrarily — an old
          # package uploaded under a green run.
          rm -rf rpmbuild
          just rpm-build
          mkdir -p /tmp/wl-rpm-${{ github.run_id }}
          cp rpmbuild/RPMS/noarch/workloadctl-*.rpm /tmp/wl-rpm-${{ github.run_id }}/

      - name: Upload RPM artifact
        uses: forgejo/upload-artifact@v4
        with:
          name: workloadctl-rpm
          path: workloadctl/rpmbuild/RPMS/**/*.rpm
          if-no-files-found: error

  publish:
    needs: test
    runs-on: native
    # Auto-publish on internal pushes; also allow publishing from any branch via
    # a manual workflow_dispatch (for testing a branch's RPM before merge).
    if: github.ref == 'refs/heads/internal' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Publish to Forgejo package registry
        env:
          PKG_PUBLISH_TOKEN: ${{ secrets.PKG_PUBLISH_TOKEN }}
        run: |
          rpm=(/tmp/wl-rpm-${{ github.run_id }}/workloadctl-*.rpm)
          # "$rpm" is element 0, so more than one match would publish whichever
          # sorted first with nothing in the log to say so.
          if [ "${#rpm[@]}" -ne 1 ] || [ ! -f "${rpm[0]}" ]; then
            echo "expected exactly one RPM to publish, got ${#rpm[@]}:"
            ls -l /tmp/wl-rpm-${{ github.run_id }}/
            exit 1
          fi
          code=$(curl -sS -o /tmp/pkg-upload.log -w "%{http_code}" \
            -H "Authorization: token ${PKG_PUBLISH_TOKEN}" \
            --upload-file "$rpm" \
            "https://git.local/api/packages/ben/rpm/upload")
          # 201 = uploaded, 409 = version already exists (idempotent)
          if [ "$code" != "201" ] && [ "$code" != "409" ]; then
            echo "Upload failed (HTTP $code):"
            cat /tmp/pkg-upload.log
            exit 1
          fi
          echo "Published $(basename $rpm) (HTTP $code)"
          rm -rf /tmp/wl-rpm-${{ github.run_id }}
