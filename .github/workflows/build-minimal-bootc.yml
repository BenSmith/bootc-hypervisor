name: Build Fedora Minimal Bootc

on:
  # Manual trigger with version selection
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build'
        required: true
        default: '43'
        type: choice
        options:
          - '43'
          - '44'
          - 'rawhide'

  # Scheduled daily build (2am UTC)
  schedule:
    - cron: '0 2 * * *'

  # Build on pushes to main that touch these files
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-minimal-bootc.yml'

jobs:
  build-minimal-bootc:
    runs-on: ubuntu-latest
    container:
      image: quay.io/fedora/fedora:43
      options: --privileged

    strategy:
      matrix:
        # Build for multiple Fedora versions
        fedora_version:
          - '43'
          - 'rawhide'

    steps:
      - name: Install build tools
        run: |
          dnf install -y git buildah

      - name: Configure buildah for nested containers
        run: |
          # Use vfs storage driver to avoid overlay-on-overlay issues
          mkdir -p /etc/containers
          cat > /etc/containers/storage.conf <<EOF
          [storage]
          driver = "vfs"
          EOF

      - name: Set Fedora version
        id: set_version
        run: |
          # Use manual input if provided, otherwise use matrix version
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.fedora_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ matrix.fedora_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone Fedora bootc base-images
        run: |
          git clone --depth 1 https://gitlab.com/fedora/bootc/base-images.git
          cd base-images
          git log -1

      - name: Build minimal bootc container
        run: |
          cd base-images
          buildah build \
            --isolation=chroot \
            --cap-add=SYS_ADMIN \
            --cap-add=NET_ADMIN \
            --cap-add=SYS_CHROOT \
            --cap-add=MKNOD \
            --device /dev/fuse \
            --build-arg MANIFEST=minimal \
            --build-arg BUILDER_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            --build-arg REPOS_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            -t localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            -t localhost/minimal-bootc:latest \
            .

      - name: Test built image
        run: |
          buildah images | grep minimal-bootc
          buildah inspect localhost/minimal-bootc:${{ steps.set_version.outputs.version }}

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | buildah login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GitHub Container Registry
        run: |
          # Tag with version
          buildah tag localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/minimal-bootc:${{ steps.set_version.outputs.version }}

          # Also tag 'latest' for the stable version
          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            buildah tag localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
              ghcr.io/${{ github.repository_owner }}/minimal-bootc:latest
          fi

          # Push all tags
          buildah push ghcr.io/${{ github.repository_owner }}/minimal-bootc:${{ steps.set_version.outputs.version }}

          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            buildah push ghcr.io/${{ github.repository_owner }}/minimal-bootc:latest
          fi

      - name: Save image as artifact
        run: |
          mkdir -p artifacts
          buildah push localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            oci-archive:artifacts/minimal-bootc-f${{ steps.set_version.outputs.version }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-bootc-f${{ steps.set_version.outputs.version }}
          path: artifacts/minimal-bootc-f${{ steps.set_version.outputs.version }}.tar
          retention-days: 7
