name: Build Fedora Minimal Bootc

on:
  # Manual trigger with version selection
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build'
        required: true
        default: '43'
        type: choice
        options:
          - '43'
          - '44'
          - 'rawhide'
      rechunk:
        description: 'Rechunk the image for better efficiency'
        required: false
        default: true
        type: boolean

  # Weekly build (Saturdays at 2am UTC)
  schedule:
    - cron: '0 2 * * 6'

  # Build on pushes to main that touch these files
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-minimal-bootc.yml'

jobs:
  build-minimal-bootc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        # Build for multiple Fedora versions
        fedora_version:
          - '43'
          - 'rawhide'

    steps:
      - name: Setup podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Set Fedora version
        id: set_version
        run: |
          # Use manual input if provided, otherwise use matrix version
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.fedora_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ matrix.fedora_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Set build timestamp
        id: timestamp
        run: |
          echo "tag=$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT

      - name: Clone Fedora bootc base-images
        run: |
          git clone --depth 1 https://gitlab.com/fedora/bootc/base-images.git
          cd base-images
          git log -1

      - name: Patch Containerfile for podman 4.x compatibility
        run: |
          cd base-images
          # Replace the entire RUN --mount with COPY + RUN
          # Bind mounts are read-only in GitHub Actions, but rpm-ostree needs write access
          cat > /tmp/patch.py << 'PATCHEOF'
          import re
          import sys

          with open('Containerfile', 'r') as f:
              content = f.read()

          old_pattern = r'RUN --mount=type=cache,rw,id=bootc-base-image-cache,target=/cache\s+\\\s+--mount=type=bind,rw,from=repos,src=/,dst=/repos\s+<<EORUN.*?^EORUN$'

          new_text = """# Copy repos to writable location (bind mounts are read-only in some environments)
          COPY --from=repos / /repos
          RUN --mount=type=cache,id=bootc-base-image-cache,target=/cache sh -c 'set -xeuo pipefail && \\
              ./install-manifests && \\
              install -m 0755 -t /usr/libexec ./bootc-base-imagectl && \\
              /usr/libexec/bootc-base-imagectl list >/dev/null && \\
              /usr/libexec/bootc-base-imagectl build-rootfs --cachedir=/cache --reinject --manifest=${MANIFEST} /repos /target-rootfs'"""

          content = re.sub(old_pattern, new_text, content, flags=re.MULTILINE | re.DOTALL)

          with open('Containerfile', 'w') as f:
              f.write(content)
          PATCHEOF
          python3 /tmp/patch.py

          echo "=== Patched Containerfile ==="
          cat -n Containerfile
          echo "==========================="

      - name: Build minimal bootc container
        run: |
          cd base-images
          podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            -f Containerfile \
            --build-arg MANIFEST=minimal \
            --build-arg BUILDER_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            --build-arg REPOS_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            -t localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }} \
            -t localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }} \
            -t localhost/fedora-bootc-minimal:latest \
            .

      - name: Test built image
        run: |
          podman images | grep fedora-bootc-minimal
          podman inspect localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}

      - name: Rechunk image
        id: rechunk
        if: github.event_name == 'workflow_dispatch' && inputs.rechunk || github.event_name == 'schedule'
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v1.2.4'
          prev-ref: ghcr.io/${{ github.repository_owner }}/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}
          ref: localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}
          version: ${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}
          pretty: Fedora ${{ steps.set_version.outputs.version }}
          revision: ${{ github.sha }}
          skip_compression: true

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GitHub Container Registry
        run: |
          # Lowercase repository owner for ghcr.io compatibility
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Tag with timestamp and version
          podman tag localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }} \
            ghcr.io/${OWNER}/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}

          podman tag localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }} \
            ghcr.io/${OWNER}/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}

          # Also tag 'latest' for the stable version
          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            podman tag localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }} \
              ghcr.io/${OWNER}/fedora-bootc-minimal:latest
          fi

          # Push all tags
          podman push ghcr.io/${OWNER}/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}
          podman push ghcr.io/${OWNER}/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}

          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            podman push ghcr.io/${OWNER}/fedora-bootc-minimal:latest
          fi

      - name: Save image as artifact
        run: |
          mkdir -p artifacts
          podman save localhost/fedora-bootc-minimal:${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }} \
            -o artifacts/fedora-bootc-minimal-f${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedora-bootc-minimal-f${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}
          path: artifacts/fedora-bootc-minimal-f${{ steps.set_version.outputs.version }}-${{ steps.timestamp.outputs.tag }}.tar
          retention-days: 7
