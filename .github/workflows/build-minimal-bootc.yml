name: Build Fedora Minimal Bootc

on:
  # Manual trigger with version selection
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Fedora version to build'
        required: true
        default: '43'
        type: choice
        options:
          - '43'
          - '44'
          - 'rawhide'

  # Scheduled daily build (2am UTC)
  schedule:
    - cron: '0 2 * * *'

  # Build on pushes to main that touch these files
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-minimal-bootc.yml'

jobs:
  build-minimal-bootc:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Build for multiple Fedora versions
        fedora_version:
          - '43'
#          - 'rawhide'

    steps:
      - name: Install latest podman
        run: |
          # Remove old podman if present
          sudo apt-get remove -y podman || true

          # Add Kubic repo for latest podman
          echo "deb https://download.opensuse.org/repositories/devel:/kubic:/libcontainers:/unstable/xUbuntu_$(lsb_release -rs)/ /" | sudo tee /etc/apt/sources.list.d/devel:kubic:libcontainers:unstable.list
          curl -fsSL https://download.opensuse.org/repositories/devel:kubic:libcontainers:unstable/xUbuntu_$(lsb_release -rs)/Release.key | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/kubic-libcontainers-unstable.gpg > /dev/null

          sudo apt-get update
          sudo apt-get install -y podman

          podman --version

      - name: Set Fedora version
        id: set_version
        run: |
          # Use manual input if provided, otherwise use matrix version
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.fedora_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ matrix.fedora_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Clone Fedora bootc base-images
        run: |
          git clone --depth 1 https://gitlab.com/fedora/bootc/base-images.git
          cd base-images
          git log -1

      - name: Patch Containerfile for podman 4.x compatibility
        run: |
          cd base-images
          # Remove 'rw' from mount options (podman 4.x duplicate options bug)
          sed -i 's/type=cache,rw,id=/type=cache,id=/g' Containerfile
          sed -i 's/type=bind,rw,from=/type=bind,from=/g' Containerfile

          # Convert heredoc to inline sh -c (podman 4.x doesn't support heredoc)
          awk '
          BEGIN { in_heredoc=0 }
          /<<EORUN/ {
            in_heredoc=1
            printf "    sh -c '\''set -xeuo pipefail"
            next
          }
          /^EORUN$/ {
            in_heredoc=0
            printf "'\''\n"
            next
          }
          in_heredoc && !/^#/ && NF {
            gsub(/\\/,"\\\\")
            gsub(/'"'"'/,"\047")
            printf " && %s", $0
          }
          !in_heredoc { print }
          ' Containerfile > Containerfile.tmp && mv Containerfile.tmp Containerfile

          echo "=== Patched Containerfile ==="
          cat -n Containerfile
          echo "==========================="

      - name: Build minimal bootc container
        run: |
          cd base-images
          podman build \
            --security-opt=label=disable \
            --cap-add=all \
            --device /dev/fuse \
            -f Containerfile \
            --build-arg MANIFEST=minimal \
            --build-arg BUILDER_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            --build-arg REPOS_IMAGE=quay.io/fedora/fedora:${{ steps.set_version.outputs.version }} \
            -t localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            -t localhost/minimal-bootc:latest \
            .

      - name: Test built image
        run: |
          podman images | grep minimal-bootc
          podman inspect localhost/minimal-bootc:${{ steps.set_version.outputs.version }}

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push to GitHub Container Registry
        run: |
          # Tag with version
          podman tag localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            ghcr.io/${{ github.repository_owner }}/minimal-bootc:${{ steps.set_version.outputs.version }}

          # Also tag 'latest' for the stable version
          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            podman tag localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
              ghcr.io/${{ github.repository_owner }}/minimal-bootc:latest
          fi

          # Push all tags
          podman push ghcr.io/${{ github.repository_owner }}/minimal-bootc:${{ steps.set_version.outputs.version }}

          if [ "${{ steps.set_version.outputs.version }}" == "43" ]; then
            podman push ghcr.io/${{ github.repository_owner }}/minimal-bootc:latest
          fi

      - name: Save image as artifact
        run: |
          mkdir -p artifacts
          podman save localhost/minimal-bootc:${{ steps.set_version.outputs.version }} \
            -o artifacts/minimal-bootc-f${{ steps.set_version.outputs.version }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minimal-bootc-f${{ steps.set_version.outputs.version }}
          path: artifacts/minimal-bootc-f${{ steps.set_version.outputs.version }}.tar
          retention-days: 7
