name: Build Hypervisor Bootc Images

on:
  # Trigger after minimal build completes successfully
  workflow_run:
    workflows: ["Build Fedora Minimal Bootc"]
    types:
      - completed
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      variants:
        description: 'Which variants to build'
        required: true
        default: 'base'
        type: choice
        options:
          - 'base'
          - 'all'
          - 'base,nvidia-rpmfusion'
          - 'base,nvidia-negativo17'
          - 'base,amd'

  # Build when hypervisor files change
  push:
    branches:
      - main
    paths:
      - 'hypervisor*.Containerfile'
      - '.github/workflows/build-hypervisor.yml'

  # Weekly builds (Sundays at 3am UTC) - backup if workflow_run doesn't trigger
  schedule:
    - cron: '0 3 * * 0'

jobs:
  build-hypervisor:
    runs-on: ubuntu-latest
    # Only run if:
    # 1. workflow_run: minimal build succeeded
    # 2. Other events: allow (manual, schedule, push)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if should skip build
        id: should_build
        run: |
          # For push events, skip if minimal Containerfile changed (will trigger via workflow_run)
          if [ "${{ github.event_name }}" == "push" ]; then
            FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
            echo "Changed files:"
            echo "$FILES"

            if echo "$FILES" | grep -q "fedora-bootc-minimal.Containerfile"; then
              echo "run=false" >> $GITHUB_OUTPUT
              echo "⚠️  Minimal Containerfile changed - skipping push trigger"
              echo "   Hypervisor will build automatically after minimal completes"
            else
              echo "run=true" >> $GITHUB_OUTPUT
              echo "✅ Proceeding with build"
            fi
          else
            # For non-push events (workflow_run, manual, schedule), always run
            echo "run=true" >> $GITHUB_OUTPUT
            echo "✅ Event: ${{ github.event_name }} - proceeding with build"
          fi

      - name: Setup podman
        if: steps.should_build.outputs.run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Install cosign
        if: steps.should_build.outputs.run == 'true'
        uses: sigstore/cosign-installer@v3.7.0

      - name: Login to GitHub Container Registry
        if: steps.should_build.outputs.run == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Determine variants to build
        if: steps.should_build.outputs.run == 'true'
        id: variants
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VARIANTS="${{ inputs.variants }}"
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            VARIANTS="all"
          else
            VARIANTS="base"
          fi
          echo "variants=${VARIANTS}" >> $GITHUB_OUTPUT

      - name: Free up disk space
        if: steps.should_build.outputs.run == 'true'
        run: |
          # Remove unnecessary packages and cleanup
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          df -h

      - name: Build base hypervisor
        if: steps.should_build.outputs.run == 'true'
        run: |
          TAG=$(date +%Y%m%d-%H%M)
          echo "base_tag=${TAG}" >> $GITHUB_ENV

          podman build \
            -f hypervisor.Containerfile \
            -t localhost/hypervisor-bootc:${TAG} \
            -t localhost/hypervisor-bootc:latest \
            .

      - name: Copy base image to root storage for rechunking
        if: steps.should_build.outputs.run == 'true'
        run: |
          podman save localhost/hypervisor-bootc:${{ env.base_tag }} | sudo podman load

      - name: Rechunk base hypervisor image
        if: steps.should_build.outputs.run == 'true'
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v1.2.4'
          prev-ref: ghcr.io/${{ github.repository_owner }}/hypervisor-bootc:latest
          ref: localhost/hypervisor-bootc:${{ env.base_tag }}
          version: ${{ env.base_tag }}
          pretty: Hypervisor Base
          revision: ${{ github.sha }}
          skip_compression: true

      - name: Retag rechunked base image as latest
        if: steps.should_build.outputs.run == 'true'
        run: |
          # Ensure :latest tag points to rechunked image for variant builds
          podman tag localhost/hypervisor-bootc:${{ env.base_tag }} localhost/hypervisor-bootc:latest

      - name: Push base hypervisor to GHCR
        if: steps.should_build.outputs.run == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Tag for GHCR
          podman tag localhost/hypervisor-bootc:${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-bootc:${{ env.base_tag }}
          podman tag localhost/hypervisor-bootc:${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-bootc:latest

          # Push to GHCR
          podman push ghcr.io/${OWNER}/hypervisor-bootc:${{ env.base_tag }}
          podman push ghcr.io/${OWNER}/hypervisor-bootc:latest

          # Note: Don't clean up base image yet - variants need it for their builds

      - name: Build NVIDIA RPMFusion variant
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman build \
            -f hypervisor-nvidia-rpmfusion.Containerfile \
            -t localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} \
            -t localhost/hypervisor-nvidia:rpmfusion \
            .

      - name: Copy NVIDIA RPMFusion image to root storage for rechunking
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman save localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} | sudo podman load

      - name: Rechunk NVIDIA RPMFusion variant image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v1.2.4'
          prev-ref: ghcr.io/${{ github.repository_owner }}/hypervisor-nvidia:rpmfusion
          ref: localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }}
          version: ${{ env.base_tag }}
          pretty: Hypervisor NVIDIA RPMFusion
          revision: ${{ github.sha }}
          skip_compression: true

      - name: Retag rechunked NVIDIA RPMFusion image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman tag localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} localhost/hypervisor-nvidia:rpmfusion

      - name: Push NVIDIA RPMFusion variant to GHCR
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Tag for GHCR
          podman tag localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion-${{ env.base_tag }}
          podman tag localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion

          # Push to GHCR
          podman push ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion-${{ env.base_tag }}
          podman push ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion

          # Clean up to free space
          sudo podman rmi localhost/hypervisor-nvidia:rpmfusion-${{ env.base_tag }} || true
          podman system prune -af --volumes

      - name: Build NVIDIA negativo17 variant
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman build \
            -f hypervisor-nvidia-negativo17.Containerfile \
            -t localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} \
            -t localhost/hypervisor-nvidia:negativo17 \
            .

      - name: Copy NVIDIA negativo17 image to root storage for rechunking
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman save localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} | sudo podman load

      - name: Rechunk NVIDIA negativo17 variant image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v1.2.4'
          prev-ref: ghcr.io/${{ github.repository_owner }}/hypervisor-nvidia:negativo17
          ref: localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }}
          version: ${{ env.base_tag }}
          pretty: Hypervisor NVIDIA negativo17
          revision: ${{ github.sha }}
          skip_compression: true

      - name: Retag rechunked NVIDIA negativo17 image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman tag localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} localhost/hypervisor-nvidia:negativo17

      - name: Push NVIDIA negativo17 variant to GHCR
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Tag for GHCR
          podman tag localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-nvidia:negativo17-${{ env.base_tag }}
          podman tag localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-nvidia:negativo17

          # Push to GHCR
          podman push ghcr.io/${OWNER}/hypervisor-nvidia:negativo17-${{ env.base_tag }}
          podman push ghcr.io/${OWNER}/hypervisor-nvidia:negativo17

          # Clean up to free space
          sudo podman rmi localhost/hypervisor-nvidia:negativo17-${{ env.base_tag }} || true
          podman system prune -af --volumes

      - name: Build AMD variant
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman build \
            -f hypervisor-amd.Containerfile \
            -t localhost/hypervisor-amd:${{ env.base_tag }} \
            -t localhost/hypervisor-amd:latest \
            .

      - name: Copy AMD image to root storage for rechunking
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman save localhost/hypervisor-amd:${{ env.base_tag }} | sudo podman load

      - name: Rechunk AMD variant image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        uses: hhd-dev/rechunk@5fbe1d3a639615d2548d83bc888360de6267b1a2 # v1.2.4
        with:
          rechunk: 'ghcr.io/hhd-dev/rechunk:v1.2.4'
          prev-ref: ghcr.io/${{ github.repository_owner }}/hypervisor-amd:latest
          ref: localhost/hypervisor-amd:${{ env.base_tag }}
          version: ${{ env.base_tag }}
          pretty: Hypervisor AMD
          revision: ${{ github.sha }}
          skip_compression: true

      - name: Retag rechunked AMD image
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          podman tag localhost/hypervisor-amd:${{ env.base_tag }} localhost/hypervisor-amd:latest

      - name: Push AMD variant to GHCR
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Tag for GHCR
          podman tag localhost/hypervisor-amd:${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-amd:${{ env.base_tag }}
          podman tag localhost/hypervisor-amd:${{ env.base_tag }} ghcr.io/${OWNER}/hypervisor-amd:latest

          # Push to GHCR
          podman push ghcr.io/${OWNER}/hypervisor-amd:${{ env.base_tag }}
          podman push ghcr.io/${OWNER}/hypervisor-amd:latest

          # Clean up to free space
          sudo podman rmi localhost/hypervisor-amd:${{ env.base_tag }} || true
          podman system prune -af --volumes

      - name: Login to GitHub Container Registry for cosign
        if: steps.should_build.outputs.run == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Sign base hypervisor images
        if: steps.should_build.outputs.run == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-bootc:${{ env.base_tag }}
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-bootc:latest

      - name: Sign NVIDIA RPMFusion images
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-rpmfusion') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion-${{ env.base_tag }}
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-nvidia:rpmfusion

      - name: Sign NVIDIA negativo17 images
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'nvidia-negativo17') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-nvidia:negativo17-${{ env.base_tag }}
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-nvidia:negativo17

      - name: Sign AMD images
        if: steps.should_build.outputs.run == 'true' && (contains(steps.variants.outputs.variants, 'amd') || contains(steps.variants.outputs.variants, 'all'))
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-amd:${{ env.base_tag }}
          cosign sign --yes ghcr.io/${OWNER}/hypervisor-amd:latest

      - name: Summary
        if: steps.should_build.outputs.run == 'true'
        run: |
          echo "## Build Complete! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Built variants: ${{ steps.variants.outputs.variants }}" >> $GITHUB_STEP_SUMMARY
          echo "Tag: ${{ env.base_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Images:" >> $GITHUB_STEP_SUMMARY
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "- \`ghcr.io/${OWNER}/hypervisor-bootc:${{ env.base_tag }}\` ✅ Signed" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${OWNER}/hypervisor-bootc:latest\` ✅ Signed" >> $GITHUB_STEP_SUMMARY
