# fail2ban ships /var/lib/fail2ban as an RPM payload directory, but bootc keeps
# /var empty in the image (it's machine-local state) and the build explicitly
# deletes it. The stock fail2ban tmpfiles.d only covers /run/fail2ban, so on a
# fresh boot the state dir is absent and fail2ban-server aborts opening its
# sqlite db (/var/lib/fail2ban/fail2ban.sqlite3 -> exit 255/EXCEPTION).
# Recreate it at boot.
d /var/lib/fail2ban 0750 root root -
